# The app's releases (packaging/; docs/app.md §19, "Packaging"): Velopack's, a Windows installer, the macOS app
# zipped and a Linux AppImage, each with the update package and feed the installed app's updater reads (crates/nettai's
# updates.rs). Run by hand (Actions → Release → Run workflow) for the packages alone, as the run's artifacts; on a
# tag `v*` also, with a draft release of them, which is never published from here: the apps see it once someone
# publishes it. Each package bundles the ffmpeg
# packaging/ffmpeg.sha256 pins (nettaisen/ffmpeg-build's release, built by that repository's own workflow),
# which the packaging scripts download and check.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Velopack's vpk: the version crates/nettai's velopack is.
  VPK_VERSION: 1.2.161

jobs:
  icons:
    name: Icons
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install librsvg and ImageMagick
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends librsvg2-bin imagemagick
      - name: Make the icons from docs/logo/nettai-icon.svg
        run: packaging/icons.sh "$RUNNER_TEMP/icons"
      - uses: actions/upload-artifact@v7
        with:
          name: icons
          path: ${{ runner.temp }}/icons
          if-no-files-found: error

  windows:
    name: Windows installer
    needs: icons
    runs-on: windows-latest
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: icons
          path: ${{ runner.temp }}/icons
      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "NETTAI_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Rust
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # (datachannel-facade's libdatachannel has a submodule, nlohmann/json, whose test files' paths pass Windows'
      # 260 characters under cargo's git folder: Git, and the libgit2 cargo checks submodules out with, take long
      # paths only when asked.)
      - name: Long paths for Git
        run: git config --global core.longpaths true
      # (crates/nettai/build.rs lists the packages offline: every one is fetched first.)
      - name: Fetch the crates
        run: cargo fetch --locked
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      # (Into the runner's temp folder, put on the PATH for the steps after: the same on every system.)
      - name: Velopack's vpk
        shell: pwsh
        run: |
          dotnet tool install vpk --version $env:VPK_VERSION --tool-path (Join-Path $env:RUNNER_TEMP 'vpk')
          if ($LASTEXITCODE -ne 0) { throw "installing vpk failed" }
          Add-Content $env:GITHUB_PATH (Join-Path $env:RUNNER_TEMP 'vpk')
      # Optional: a code-signing certificate (base64 of a .pfx) in the secrets WINDOWS_CERTIFICATE and
      # WINDOWS_CERTIFICATE_PASSWORD. Skipped without it: no program of the release is signed.
      - name: Signing certificate
        if: env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'certificate.pfx'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          "WINDOWS_CERTIFICATE_PATH=$path" >> $env:GITHUB_ENV
      - name: Package
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: packaging\windows\package.ps1 -Icon "$env:RUNNER_TEMP\icons\nettai.ico"
      - uses: actions/upload-artifact@v7
        with:
          name: nettai-windows
          path: target/package/windows/releases/*
          if-no-files-found: error

  macos:
    name: macOS disk image
    needs: icons
    runs-on: macos-latest
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: icons
          path: ${{ runner.temp }}/icons
      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "NETTAI_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Fetch the crates
        run: cargo fetch --locked
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      # (Into the runner's temp folder, put on the PATH for the steps after: the same on every system.)
      - name: Velopack's vpk
        shell: pwsh
        run: |
          dotnet tool install vpk --version $env:VPK_VERSION --tool-path (Join-Path $env:RUNNER_TEMP 'vpk')
          if ($LASTEXITCODE -ne 0) { throw "installing vpk failed" }
          Add-Content $env:GITHUB_PATH (Join-Path $env:RUNNER_TEMP 'vpk')
      # Optional: a Developer ID Application certificate (base64 of a .p12) in MACOS_CERTIFICATE, its password in
      # MACOS_CERTIFICATE_PASSWORD; with APPLE_ID, APPLE_TEAM_ID and APPLE_APP_PASSWORD (an app-specific password)
      # the disk image is notarized too. Skipped without it: the app is signed ad hoc, and the player allows it
      # once (System Settings → Privacy & Security → Open Anyway).
      - name: Signing certificate
        if: env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 16)
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application[^"]*\)".*/\1/p' | head -n 1)
          echo "MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "MACOS_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          # (With the Apple ID's app-specific password, a notarytool profile in that keychain, which vpk notarizes the
          # app with.)
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_APP_PASSWORD" ]; then
            xcrun notarytool store-credentials nettai --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --keychain "$keychain"
            echo "MACOS_NOTARY_PROFILE=nettai" >> "$GITHUB_ENV"
          fi
      - name: Package
        env:
          NETTAI_UNIVERSAL: "1"
          NETTAI_ICONS: ${{ runner.temp }}/icons
        run: packaging/macos/package.sh
      - uses: actions/upload-artifact@v7
        with:
          name: nettai-macos
          path: target/package/macos/releases/*
          if-no-files-found: error

  linux:
    name: Linux AppImage
    needs: icons
    # (The oldest image GitHub has: the program needs the glibc it was built against, or a later one.)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: icons
          path: ${{ runner.temp }}/icons
      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "NETTAI_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      # ALSA (cpal), fontconfig (Slint's text), udev (SDL's gamepads), Wayland and xkbcommon (the window), and
      # libclang (bindgen, for libdatachannel's C API: nettai-rtc's datachannel-facade).
      - name: Libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake pkg-config libasound2-dev libfontconfig1-dev libudev-dev libwayland-dev libxkbcommon-dev libclang-dev
      - name: Rust
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Fetch the crates
        run: cargo fetch --locked
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      # (Into the runner's temp folder, put on the PATH for the steps after: the same on every system.)
      - name: Velopack's vpk
        shell: pwsh
        run: |
          dotnet tool install vpk --version $env:VPK_VERSION --tool-path (Join-Path $env:RUNNER_TEMP 'vpk')
          if ($LASTEXITCODE -ne 0) { throw "installing vpk failed" }
          Add-Content $env:GITHUB_PATH (Join-Path $env:RUNNER_TEMP 'vpk')
      - name: Package
        env:
          NETTAI_ICONS: ${{ runner.temp }}/icons
        run: packaging/linux/package.sh
      - uses: actions/upload-artifact@v7
        with:
          name: nettai-linux
          path: target/package/linux/releases/*
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: nettai-*
          path: releases
          merge-multiple: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      # (Into the runner's temp folder, put on the PATH for the steps after: the same on every system.)
      - name: Velopack's vpk
        shell: pwsh
        run: |
          dotnet tool install vpk --version $env:VPK_VERSION --tool-path (Join-Path $env:RUNNER_TEMP 'vpk')
          if ($LASTEXITCODE -ne 0) { throw "installing vpk failed" }
          Add-Content $env:GITHUB_PATH (Join-Path $env:RUNNER_TEMP 'vpk')
      # A draft: someone publishes it by hand, and only then do the installed apps see it. Each platform's channel
      # (win, osx, linux) goes up into the one release; a run again (the same tag) merges into it.
      - name: Draft release
        env:
          VPK_TOKEN: ${{ github.token }}
        run: |
          for channel in win osx linux; do
            vpk upload github --outputDir releases --channel "$channel" --repoUrl "https://github.com/$GITHUB_REPOSITORY" \
              --tag "$GITHUB_REF_NAME" --releaseName "nettai ${GITHUB_REF_NAME#v}" --merge
          done
