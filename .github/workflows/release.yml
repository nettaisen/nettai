# The app's packages (packaging/; docs/app.md, "Packaging"): a Windows installer, a macOS disk image and a Linux
# AppImage. Run by hand (Actions → Release → Run workflow) for the packages alone, as the run's artifacts; on a
# tag `v*` also, with a draft release of them, which is never published from here. Each package bundles the ffmpeg
# packaging/ffmpeg.sha256 pins (nettaisen/ffmpeg-build's release, built by that repository's own workflow),
# which the packaging scripts download and check.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  icons:
    name: Icons
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install librsvg and ImageMagick
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends librsvg2-bin imagemagick
      - name: Make the icons from docs/logo/nettai-icon.svg
        run: packaging/icons.sh "$RUNNER_TEMP/icons"
      - uses: actions/upload-artifact@v7
        with:
          name: icons
          path: ${{ runner.temp }}/icons
          if-no-files-found: error

  windows:
    name: Windows installer
    needs: icons
    runs-on: windows-latest
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: icons
          path: ${{ runner.temp }}/icons
      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "NETTAI_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Rust
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # (datachannel-facade's libdatachannel has a submodule, nlohmann/json, whose test files' paths pass Windows'
      # 260 characters under cargo's git folder: Git, and the libgit2 cargo checks submodules out with, take long
      # paths only when asked.)
      - name: Long paths for Git
        run: git config --global core.longpaths true
      # (crates/nettai/build.rs lists the packages offline: every one is fetched first.)
      - name: Fetch the crates
        run: cargo fetch --locked
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --yes --no-progress }
      # Optional: a code-signing certificate (base64 of a .pfx) in the secrets WINDOWS_CERTIFICATE and
      # WINDOWS_CERTIFICATE_PASSWORD. Skipped without it: the program and the installer are unsigned.
      - name: Signing certificate
        if: env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'certificate.pfx'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          "WINDOWS_CERTIFICATE_PATH=$path" >> $env:GITHUB_ENV
      - name: Package
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: packaging\windows\package.ps1 -Icon "$env:RUNNER_TEMP\icons\nettai.ico"
      - uses: actions/upload-artifact@v7
        with:
          name: nettai-windows
          path: |
            target/package/windows/*.exe
            target/package/windows/*.zip
          if-no-files-found: error

  macos:
    name: macOS disk image
    needs: icons
    runs-on: macos-latest
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: icons
          path: ${{ runner.temp }}/icons
      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "NETTAI_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Fetch the crates
        run: cargo fetch --locked
      # Optional: a Developer ID Application certificate (base64 of a .p12) in MACOS_CERTIFICATE, its password in
      # MACOS_CERTIFICATE_PASSWORD; with APPLE_ID, APPLE_TEAM_ID and APPLE_APP_PASSWORD (an app-specific password)
      # the disk image is notarized too. Skipped without it: the app is signed ad hoc, and the player allows it
      # once (System Settings → Privacy & Security → Open Anyway).
      - name: Signing certificate
        if: env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 16)
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application[^"]*\)".*/\1/p' | head -n 1)
          echo "MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Package
        env:
          NETTAI_UNIVERSAL: "1"
          NETTAI_ICONS: ${{ runner.temp }}/icons
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: packaging/macos/package.sh
      - uses: actions/upload-artifact@v7
        with:
          name: nettai-macos
          path: target/package/macos/*.dmg
          if-no-files-found: error

  linux:
    name: Linux AppImage
    needs: icons
    # (The oldest image GitHub has: the program needs the glibc it was built against, or a later one.)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: icons
          path: ${{ runner.temp }}/icons
      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "NETTAI_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      # ALSA (cpal), fontconfig (Slint's text), udev (SDL's gamepads), Wayland and xkbcommon (the window), and
      # libclang (bindgen, for libdatachannel's C API: nettai-rtc's datachannel-facade).
      - name: Libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake pkg-config libasound2-dev libfontconfig1-dev libudev-dev libwayland-dev libxkbcommon-dev libclang-dev
      - name: Rust
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Fetch the crates
        run: cargo fetch --locked
      - name: Package
        env:
          NETTAI_ICONS: ${{ runner.temp }}/icons
        run: packaging/linux/package.sh
      - uses: actions/upload-artifact@v7
        with:
          name: nettai-linux
          path: target/package/linux/*.AppImage
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: nettai-*
          path: packages
          merge-multiple: true
      # A draft: someone publishes it by hand. A run again (the same tag) replaces its files.
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" packages/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" packages/* --draft --verify-tag --title "nettai ${GITHUB_REF_NAME#v}" --generate-notes
          fi
