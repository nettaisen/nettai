# EXE4's manifest (docs/design/content-model-v2.md §4.0): a game pack: what a match plays. It requires only its own
# modules and those of the support packs it depends on. What it has is what its top module, init.luau, requires.
# tools/content/index.py (the verification workspace) keeps it. EXE4's port is under way (docs/design/exe4-map.md):
# its compat tables come first, for the extractor.
id = "exe4"
kind = "game"
depends = ["exelib"]
# Its locales' text tables (top-level tables of key to text that no definition owns): `patch_card_effects`, each patch
# card effect's line, by the effect's kind and choice; `bugs`, each NaviCust bug's name, by the bug's name in the
# rules; `builds`, what a build is made of, by name (rules/builds: its versions and its choices' presets).
text = ["patch_card_effects", "bugs", "builds"]
