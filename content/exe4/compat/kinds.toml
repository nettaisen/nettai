# EXE4's object kinds: the original's pool and index (the recordings compare them), and the positions the comparison
# skips (register garbage the spawner leaves until the kind's init places it). Written by hand from the EXE4 recordings
# and code, as kinds come up in the replays: edit it when content is renamed or added. A key without a root is EXE4's
# own; `engine/...` the engine's.

"engine/player" = { pool = "actor", index = 0x00 }
"engine/full-synchro-aura" = { pool = "actor", index = 0x5E, scratch_position = true }
"engine/intro" = { pool = "effect", index = 0x02, scratch_position = true }
"engine/effect" = { pool = "effect", index = 0x00 }
"engine/hitbox" = { pool = "attack", index = 0x03 }
"engine/spark" = { pool = "effect", index = 0x04 }
"engine/status-visual" = { pool = "effect", index = 0x06, scratch_position = true }
"charge-glow" = { pool = "effect", index = 0x05 }
"barrier-visual" = { pool = "effect", index = 0x07 }
"projectile" = { pool = "attack", index = 0x00 }
"attachment" = { pool = "attack", index = 0x02 }
"bomb" = { pool = "attack", index = 0x08 }
"bullet" = { pool = "attack", index = 0x12 }
# The stages' boulder (the actor lists' entry type 3, 0x08006880) and the debris it breaks into (0x080E621C).
"boulder" = { pool = "attack", index = 0x6E }
"rock/debris" = { pool = "effect", index = 0x38 }
