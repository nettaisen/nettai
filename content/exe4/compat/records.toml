# EXE4's numbers of what its NaviStats name (exe4-compat's NaviStats conversion reads them). Written by hand from the
# EXE4 ROM: edit it when content is renamed or added.

# Navis: the navi numbers NaviStats +0x23 names (MegaMan 0, the one navi EXE4's netbattles have).
[navis]
"megaman" = 0

# Weapons: the weapon routine numbers NaviStats +0x09 (the B button's), +0x0A (the charged weapon's) and +0x0C (B+Left's)
# name (the routines at 0x0800CA7C: 0 the buster, 0x0800CC2E; 1 the charged shot, 0x0800CC54; 0x21 the taunt
# DrkCanon's cost leaves, 0x0800CFEC; 0x25 Shield's guard, 0x0800CF88; 0x26 Reflect's, 0x0800CFA8).
[weapons]
"megaman/buster" = [0]
"megaman/charged-shot" = [1]
"megaman/taunt" = [0x21]
"megaman/shield" = [0x25]
"megaman/reflect" = [0x26]
# The patch cards' chips (navis/megaman/weapons/chips).
"megaman/cannon" = [0x29]
"megaman/minibomb" = [0x2A]
"megaman/heatshot" = [0x2B]
"megaman/bubbler" = [0x2C]
"megaman/sword" = [0x2E]
"megaman/spreader" = [0x2F]
"megaman/crakout" = [0x36]
"megaman/dublcrak" = [0x3C]
"megaman/wideswrd" = [0x3E]
"megaman/recov10" = [0x40]
"megaman/lance" = [0x41]
"megaman/energbom" = [0x45]
"megaman/tripcrak" = [0x48]
"megaman/longswrd" = [0x49]
"megaman/fullcust" = [0x4B]
"megaman/megenbom" = [0x4F]
"megaman/wideblde" = [0x52]
"megaman/longblde" = [0x53]
"megaman/repair" = [0x5E]
"megaman/airshot" = [0x5F]

# MegaMan's forms by soul number (NaviStats +0x24: 0 his base form; the souls, to port, from 1).
[forms]
"base" = 0

# The auras a battle starts with by number (NaviStats +0x21: FstBarr's 1; patch card 0x21's 2 Barrier100, 3 Barrier200,
# 6 LifeAura; 0 none), those the content has (content/exe4/lib/barriers).
[barriers]
"barrier/10" = 1
"barrier/100" = 2
"barrier/200" = 3
"barrier/life-aura" = 6
