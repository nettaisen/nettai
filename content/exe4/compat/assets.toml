# EXE4's asset names, written by tools/exe4/gen_content.py (bn6battle-verify) from the EXE4 ROMs:
# a battle sprite whose archive is a named EXE5 or EXE6 sprite's takes its name; a sprite or sound EXE4's
# code uses where EXE5's or EXE6's same code uses a named one takes that name (gen_content.py's
# `asset_names`); one named for the EXE4 code that uses it says where (BY_USE). The extractor writes each asset
# under its name here, the rest under a number (`sprite-cc-ii`, `sound-nnn`, `background-nn`), which it lists in
# its extraction.txt and content may not use.

# Sprites: "cc-ii", the category's byte offset in the sprite list (0x0802793C) and the index.
[sprites]
megaman = "00-00"
instrument = "04-08"
cannon = "0c-01"  # the Cannon held: attachment row 0 (0x080CD524), action 0x0B's variant 0 (0x080EB894)
bomb = "0c-02"
muzzle-flash = "0c-06"  # the buster's flash: attachment row 0x10 (0x080CD524), 0x080EB396
aura = "0c-07"
grab-shot = "0c-13"
sword-slash = "0c-14"
black-bomb = "0c-24"
geyser = "0c-25"
meta-gel = "0c-26"
wind-rack = "0c-27"
swirl = "0c-28"
gust = "0c-2e"
shuriken = "0c-2f"
anubis = "0c-30"
voodoo-doll = "0c-34"
guardian-statue = "0c-35"
sun-beam = "0c-3c"
barrier = "0c-3d"
holy-dream-shot = "0c-3e"
bug-curse = "0c-3f"
black-wing = "0c-42"
pile-driver = "0c-46"
sun-beam-ex = "0c-47"
rush = "0c-48"
pile-beam = "0c-4a"
beat = "0c-4b"
tango = "0c-4c"
tango-heal = "0c-4d"
rock = "10-02"
number-ball = "10-05"
rock-debris = "10-09"
django-rubble = "10-0e"
thunder-ball = "10-11"
hockey-puck = "10-12"
boomerang = "10-14"
element-pillar-lightning = "10-1a"
satellite-beam = "10-1f"
satellite-flare = "10-21"
heart = "10-26"
follow-effect = "10-34"
cross-slash = "10-35"
explosion = "14-00"  # hit spark 0x0B (0x080E2090; EXE5's row 0x0B)
impact = "14-01"  # hit spark 7 (0x080E2090; EXE5's row 7)
small-puff = "14-02"
pink-flash = "14-04"  # hit spark 5, the charged shot's (0x080E2090; EXE5's 0x080E0814 row 5)
hit-sparks = "14-05"
hit = "14-06"  # hit spark 8 (0x080E2090; EXE5's row 8)
hit-marker = "14-07"
charge-glow = "14-08"
confusion = "14-0b"
chip-destruction-spark = "14-0c"  # hit spark 9 (0x080E2090; EXE5's row 9)
vulcan-hit = "14-0f"
energy-burst = "14-12"
lightning = "14-14"
charge-glow-a = "14-15"

# Sounds: the song table's numbers (0x08155FF8), music and sound effects.
[sounds]
netbattle = 0x015  # a netbattle's music, which the fight's setup starts (the lab's flow/buster-duel, frame 130)
description-open = 0x066  # R's description on the custom screen (0x080203C0)
unselect-68 = 0x068
refused = 0x069  # what the custom screen can't pick or take back, a soul it can't give (0x08020386, 0x08020634)
buster-shot = 0x06a  # the buster shot and the charged shot (0x080EB372, 0x080ECC72)
hit-bomb-0 = 0x06f
hit-bomb-1 = 0x070
log-in = 0x077
program-advance-part = 0x079  # the Program Advance animation naming a chip of the recipe (0x0801E74E)
custom-open = 0x07a  # the custom screen's opening (the lab's flow/buster-duel, frame 258)
custom-cursor = 0x07d  # the custom screen's cursor moving (0x0802049C, 0x080206F6, 0x080207DC)
custom-pick = 0x07e  # a chip picked on the custom screen (0x080203A0, from 0x080204B8)
custom-back = 0x07f  # a pick taken back on the custom screen (0x080203A0, 0x0802066E, from 0x080204B8)
custom-ok = 0x080  # OK on the custom screen (0x0802063E)
cannon = 0x08c  # the cannon's shot: action 0x0B (0x080EB968)
program-advance = 0x097  # the Program Advance animation's Program Advance (0x0801E83A)
appear = 0x0b0  # the navis' appearance as a round starts (the lab's flow/buster-duel, frame 148)
dark-hover = 0x100  # the custom screen's cursor resting on a dark chip, every 61 ticks (0x0801E4A6)
buster-blank = 0x1c0  # the buster's blank shot (0x080EB39E)

# Battle backgrounds: the loader's numbers (0x08085430, its descriptors at 0x0808563C: 0x00 to 0x1a), each
# named for the in-game area that shows it (the rest wait: docs/design/exe4-map.md §18).
[backgrounds]
comp = 0x03  # the default: a map the picker 0x08085BAC doesn't list (0x08085BC6), every netbattle's settings (0x080FC138's records' +5)

# Banners: the banner block's numbers (0x02037CE0's +1), by the banner table's records (0x08016C04, 0x0801617E): EXE6's
# names for EXE6's records in EXE6's places (0x00 to 0x38), then EXE4's navis' wins and deletions (the navi banner
# table 0x08008548's), each named for its words.
[banners]
battle-start = 0x00
enemy-deleted = 0x04  # a netbattle's winner's console (the lab's flow/buster-duel)
megaman-deleted = 0x08  # a netbattle's loser's console (flow/buster-duel-bluemoon); MegaMan's entry of 0x08008548
turn-start = 0x0c  # each turn's start (flow/buster-duel, frame 327)
final-turn = 0x10
you-win = 0x14
you-lose = 0x18
draw = 0x1c
battle-number = 0x20
program-advance = 0x24
hit-damage-judge = 0x28
flag-deleted = 0x2c
battle-number-start = 0x30  # a round's start, before its first custom screen (flow/buster-duel, frame 195)
program-advance-empty = 0x34
megaman-win = 0x38
roll-win = 0x3c
gutsman-win = 0x40
windman-win = 0x44
searchman-win = 0x48
fireman-win = 0x4c
thunderman-win = 0x50
protoman-win = 0x54
numberman-win = 0x58
metalman-win = 0x5c
junkman-win = 0x60
aquaman-win = 0x64
woodman-win = 0x68
normalnavi-win = 0x6c
healnavi-win = 0x70
roll-deleted = 0x74
gutsman-deleted = 0x78
windman-deleted = 0x7c
searchman-deleted = 0x80
fireman-deleted = 0x84
thunderman-deleted = 0x88
protoman-deleted = 0x8c
numberman-deleted = 0x90
metalman-deleted = 0x94
junkman-deleted = 0x98
aquaman-deleted = 0x9c
woodman-deleted = 0xa0

# Mugshots: the emotion window's faces (0x08014B78), by the number the extractor gives them (its exe4/hud.rs): MegaMan's
# five (each brings its box) and Red Sun's six souls, in their own palettes (the face table's eleven pictures), then
# Blue Moon's six souls (Blue Moon's ROM's same table).
[mugshots]
megaman = 0x00
megaman-angry = 0x01
megaman-worried = 0x02
megaman-full-synchro = 0x03
megaman-dark = 0x04
rollsoul = 0x05
