mark = 0x12f  # DeltaRay's mark on his target (0x080C7494)
roll-whip = 0x131  # Roll's whip, every 8 ticks of her lash (0x080C1838)
prop-bomb = 0x133  # a PropBom's bomb out: attack 0x8C's init (0x080DEC04)
tango-land = 0x13b  # Tango landing: actor 0x4D (0x080CAAA6)
wood-tower = 0x13e  # GreenWd's wood tower rising: attack 0x92's row 1 (0x080DF680)
lightning = 0x143  # LigtNin's lightning striking: attack 0x8E's init (0x080DF05A)
roll-warp = 0x145  # Roll warping out and away (0x080C16B2)
justice-one = 0x146  # a meteor falling: attack 0x56 (0x080D86CE), EXE5's meteor's (0xC4)
gear = 0x149  # the gear stages' gear starting to roll (0x080DBF66)
rage-roar = 0x14c  # the Elem chips' roar on their panel: action 0x60 (0x080EE390), EXE5's ElemRage's
soul-image = 0x157  # a soul's navi coming in as the change's image: effect 0x13 (0x080E369E)
soul-unite = 0x158  # the change's second flash, as MegaMan unites with the soul: action 0x0D's step 4 (0x080EBB36)
soul-revert = 0x159  # the revert out of a soul: action 0x11 (0x080EBEBC)
arrive = 0x15a  # Tango arriving: actor 0x4D's init (0x080CAA12)
sun-beam = 0x160  # the sun beam's hum, every 11 ticks: effect 0x48 (0x080E71E2), EXE5's (0xF9)
crack-shot = 0x1a9  # a panel broken or cracked by a crack (0x08009D04: 0x08009D30, 0x08009D4C), EXE5's crack's break
bblstar1 = 0x1ba  # a crack coming: attack 0x18's init (0x080CFEB0), EXE5's crack's
damage-bonus = 0x1bb  # Full Synchro's boost of a chip (0x0800D54E: 0x0800D572)
bite = 0x1be  # Rush's bite: actor 0x4B (0x080CA6A4)
snatch = 0x1bf  # Beat taking the chip: actor 0x4C (0x080CA89A)
buster-blank = 0x1c0  # the buster's blank shot (0x080EB39E)

# Battle backgrounds: the loader's numbers (0x08085430, its descriptors at 0x0808563C: 0x00 to 0x1a), each named
# for the area whose maps draw it: a battle draws its settings' (their byte 5), or with 0xFF there its map's
# (0x08085BAC: the table at 0x08085BD0 by map group and number; 0x03 for a real-world map), a link battle one of
# 0x0803AA6C's table (0x0803AAA4: all but 0x0a, 0x11 and 0x17). The names are the menu's (0x0802DEB0) in lower
# case with hyphens; the engine's docs/frontend.md §1 has the table of them, tools/backgrounds the names and their
# areas from the ROM. No map draws five: two are named for the battles that state them (darksoul, duo), three
# for the tournament venues whose scripts start theirs (stadium, air-stadium, colosseum).
[backgrounds]
eltwr-comp = 0x00  # ElTwrComp1 and 2
toyrobo-comp = 0x01  # ToyRoboComp1 to 3
lans-hp = 0x02  # Lan's HP
# the default (every real-world map); the 44 comps of map groups 0x8c to 0x8e draw it too (MicrowvComp to VendMchComp,
# CardComp to CookComp, WtrGodComp1 to 16), and every netbattle's settings state it
comp = 0x03
acdc-area = 0x04  # ACDC Area1 to 3
town-area = 0x05  # Town Area1 to 4
park-area = 0x06  # Park Area1 to 3
yumland-area = 0x07  # YumLand Area
undernet = 0x08  # Undernet1 to 6
# no map's: the DarkSoul battle's settings state it (LaserMan's possessed GutsMan in Red Sun, AquaMan in Blue Moon:
# records 58 and 59), on CastNBMComp (0x8c:6, whose own is 0x03; cutscene 0x080892DC)
darksoul = 0x09
meteor-comp = 0x0a  # MeteorComp1 to 4; ControlArea too
mayls-hp = 0x0b  # Mayl's HP
dexs-hp = 0x0c  # Dex's HP
yais-hp = 0x0d  # Yai's HP
hotel-hp = 0x0e  # Hotel HP
castillo-hp = 0x0f  # Castillo HP
jomonelec-hp = 0x10  # JomonElec HP
black-earth = 0x11  # BlackEarth1 and 2
toyrobo-comp4 = 0x12  # ToyRoboComp4 (0x01 is ToyRoboComp1 to 3); ShadeMan's battle states it too
netopia-area = 0x13  # Netopia Area
netfrica-area = 0x14  # NetFricaArea
sharo-area = 0x15  # Sharo Area
spacectr-hp = 0x16  # SpaceCtr HP
# no map's: Duo's two battles' settings state it (records 93 and 94), on ControlArea (0x82:4, whose own is 0x0a;
# cutscene 0x0808C2F4)
duo = 0x17
# no map's: the eight tournament battles the Stadium's scripts start (DenDome's, map 2:3: records 13, 14, 22, 30, 31,
# 36, 46, 47)
stadium = 0x18
# no map's: the eight tournament battles the AirStadium's scripts start (map 3:3: records 63, 64, 66, 68, 69, 70, 71,
# 76)
air-stadium = 0x19
# no map's: the eight tournament battles the Colosseum's scripts start (Netopia's, map 4:4: records 97, 103, 104, 120,
# 132, 137, 161, 168)
colosseum = 0x1a

# Banners: the banner block's numbers (0x02037CE0's +1), by the banner table's records (0x08016C04, 0x0801617E): EXE6's
