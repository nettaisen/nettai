# EXE4's panel types by number, written by tools/exe4/gen_content.py (bn6battle-verify) from the EXE4 ROMs:
# the name content/exe4/rules/panels.luau gives each number (the same number there) and the panel flag word it
# has (the table at 0x0800A3A8): type 5 metal (flag 0x20000, which nothing cracks or breaks), 10 SandRing's
# pitfall, 11 the Hole chip's hole (docs/design/exe4-map.md §18 item 12). The panel blocks the extractor writes
# are by these numbers (0x08706640: 6 * type + 3 * owner + row - 1), each under its type's name.

[types.0]
name = "missing"
flags = 0x18000

[types.1]
name = "broken"
flags = 0x14000

[types.2]
name = "normal"
flags = 0x10010

[types.3]
name = "cracked"
flags = 0x10050

[types.4]
name = "poison"
flags = 0x10110

[types.5]
name = "metal"
flags = 0x30010

[types.6]
name = "grass"
flags = 0x10410

[types.7]
name = "ice"
flags = 0x10810

[types.8]
name = "lava"
flags = 0x11010

[types.9]
name = "holy"
flags = 0x12010

[types.10]
name = "pitfall"
flags = 0x10210

[types.11]
name = "hole"
flags = 0x10010
