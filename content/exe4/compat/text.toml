# §10.5): the stacked MB U+E005, the stacked V2 to V5 U+E009 to U+E00C (EXE4's own; the US fonts have V5
# alone), the zenny sign Ƶ, the dialogue font's □, ○, ✕ and its brackets [ ]. A byte below 0xE4 is a glyph
# of both fonts; E4 xx is glyph 0xE4 + xx (the second page: the Japanese encoding's). The US fonts draw
# 0x00 to 0x6F (the suits 0x6B to 0x6F in the dialogue font alone; the 8x16 font leaves them blank), and
# draw 0x69 and 0x6A as > and < in the 8x16 font, < and > in the dialogue font: the encoding names the 8x16
# font's. The extractor writes the fonts' charmaps with it; the locales encode with it.

