# EXE4's library order: the NaviCust programs and patch cards by their numbers, and the chips by library
# category in the order the game's own library screen lists them (0x08037798 on: Standard, Mega, Giga, Secret,
# Program Advance), Red Sun's version chips before Blue Moon's where the two list different chips at the same
# places; only what the content defines. Written by the verification workspace's tools/exe4/gen_content.py
# (library.py) from the ROMs; its `check` compares it with them. Menus list in it (nettai_content::library);
# the battle reads none of it.

