# Written by gen-content (the verification workspace) from the ROM, which its `check`
# compares this with. Edit it when content is renamed or added.
#
# Records a setup names by the original's byte.

# The save's SP navi deletion times (`byte_203EB00`, 20 halfwords): the SP chips'
# damage goes by their slot's time.
[sp_slots]
"sp/heatman" = 0
"sp/elecman" = 1
"sp/slashman" = 2
"sp/eraseman" = 3
"sp/chrgeman" = 4
"sp/spoutman" = 5
"sp/tmhkman" = 6
"sp/tenguman" = 7
"sp/grndman" = 8
"sp/dustman" = 9
"sp/protoman" = 10
"sp/blastman" = 11
"sp/diveman" = 12
"sp/crcusman" = 13
"sp/judgeman" = 14
"sp/elmntman" = 15
"sp/count" = 16
"sp/colonel" = 17

# The rocks a stage places, by the argument of the actor list's entry (the row of
# `byte_80CF934`).
[rock_variants]
"rockcube/rock/brittle" = 0
"rockcube/rock/cube" = 1
"rockcube/rock/hard" = 2
"rockcube/rock/ice" = 3

# The projectile's variants a navi's stats name as a shot program (NaviStats+0x4D the
# buster shot's, +0x4F the charged shot's), by the row of `off_80C4C78`. (The byte 0 is no
# program.)
