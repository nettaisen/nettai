# BN6's manifest (docs/design/content-model-v2.md §4.0): a game pack: what a match plays. It requires only its own
# modules and those of the support packs it uses; [definitions] lists its modules that define what a person picks or a
# ruleset names. The loader loads them and what they require, nothing else; the define phase refuses a definition of
# these that isn't listed. tools/content/index.py (the verification workspace) keeps it.
id = "bn6"
kind = "game"
uses = ["exelib"]

[definitions]
# Its rules: its stock ruleset (rules/init.luau: its systems, its rule sections and its roles).
rules = [
    "rules",
]
