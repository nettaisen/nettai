# BN6's content root (docs/design/rules-in-luau.md §7.2). Its modules, compat
# and locale tables write keys unqualified (`minibomb`); loaded, every key is
# qualified with the root's name (`bn6:minibomb`), so other games' roots load
# beside it.

# Its namespace: a game root's is its game.
name = "bn6"
# Its asset names resolve in BN6's pack (bn6-extract writes it).
assets = "bn6"
# A game root requires no other root.
requires = []
