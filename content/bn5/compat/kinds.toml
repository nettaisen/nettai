# BN5's object kinds: the original's pool and index (the traces compare them), and the positions the comparison
# skips (register garbage the spawner leaves until the kind's init places it): bn5-compat's comparison reads them.
# Written by hand from the BN5 recordings and code, as kinds come up in the replays: edit it when content is renamed
# or added. A key without a root is BN5's own; `engine/...` the engine's; a qualified one (`bn6:...`) BN6's, which
# BN5's code shares (its flags here are BN6's compat's, the same code).

