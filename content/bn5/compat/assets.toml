# BN6's, BN5's music and sprites by the place BN5's code uses them where BN6's same code uses a named one,
# the banners whose records are BN6's). bn5-extract writes each asset under its name here, the rest under a
# placeholder (`sprite-cc-ii`, `sound-nnn`, `banner-nn`), which content may not use.

