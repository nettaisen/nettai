"shot/charged-attack-a0" = 0x1C
"shot/charged-uninstalling" = 0x1D
"shot/charged-hp-bug" = 0x1E

# The barriers NaviStats +0x06 names as the one a navi enters with (0 none): FstBarr's (1), the Barrier chip's
# (lib/barriers: BN6's rows, BN5's visual).
[barriers]
"barrier/10" = 1
"barrier/100" = 5
"barrier/200" = 7
"barrier/bubble" = 8
"barrier/life-aura" = 9
