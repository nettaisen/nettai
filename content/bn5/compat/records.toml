# BN5's numbers of what its NaviStats name (bn5-compat's NaviStats conversion reads them). Written by hand from
# the BN5 ROM: edit it when content is renamed or added. A key without a root is BN5's own; a qualified one
# (`bn6:...`) is BN6's definition, which BN5's code shares.

# Weapons: the weapon routine numbers (0x0800F370, BN6's `off_80117D4`) NaviStats +0x04 (buster), +0x05 (charged
# shot), +0x07 (B+Back) and +0x39 (A charge) name; 0xFF none.
[weapons]
"megaman/buster" = [0x00]
"megaman/charged-shot" = [0x01]
# The NaviCust programs' B+Back specials (navis/megaman/weapons/guards): Shield's, Reflect's (the program's 0x61; 0x20
# the same routine), AntiDmg's. A weapon's first number is the one its program writes.
"megaman/shield" = [0x1F]
"megaman/reflect" = [0x61, 0x20]
"megaman/anti-damage" = [0x21]
# The patch cards' B buttons, charged shots and B+Back specials (navis/megaman/weapons: chips, guards, buster,
# charged-shot, spreads, instants, fire-arm, zap-ring, rapid-buster, hells-rolling).
"megaman/card-shield" = [0x62]
"megaman/tri-buster" = [0x65]
"megaman/program-charged-shot" = [0x63]
"megaman/zap-ring" = [0x42]
"megaman/invisible" = [0x47]
"megaman/longswrd" = [0x48]
"megaman/thunder" = [0x49]
