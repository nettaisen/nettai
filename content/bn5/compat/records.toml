# Projectile variants: the projectile table's rows (0x080C4718, BN6's `off_80C4C78`) the buster-shot and
# charged-shot programs (NaviStats +0x4D, +0x4F) name; the buster's and the charged shot's own, and the chips'.
[projectile_variants]
"shot/plain" = 0x00
"shot/cannon" = 0x01
"shot/bright" = 0x03
"shot/air" = 0x04
"shot/charged" = 0x06
"shot/gigacan" = 0x0C
# The patch cards' buster-shot and charged-shot programs (objects/projectile/variants), and Hub Style's spread.
"shot/breaking" = 0x05
"shot/cracking" = 0x07
"shot/poisoning" = 0x08
"shot/attack-90" = 0x09
"shot/grass" = 0x0D
"shot/ice" = 0x0E
"shot/hub" = 0x12
"shot/sea" = 0x14
"shot/charged-confusing" = 0x15
"shot/charged-paralyzing" = 0x16
"shot/charged-blinding" = 0x17
"shot/charged-cracking" = 0x18
