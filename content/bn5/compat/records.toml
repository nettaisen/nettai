"megaman/yoyo" = [0x4B]
"megaman/vacuum" = [0x4C]
"megaman/katana1" = [0x4D]
"megaman/fire-arm" = [0x4E]
"megaman/pulsar1" = [0x50]
"megaman/poltrgst" = [0x51]
"megaman/wideswrd" = [0x52]
"megaman/minibomb" = [0x53]
"megaman/cannball" = [0x54]
"megaman/tornado" = [0x55]
"megaman/bubble-shot" = [0x56]
"megaman/crakout" = [0x57]
"megaman/moonbld1" = [0x58]
"megaman/airhoc" = [0x59]
"megaman/circgun" = [0x5A]
"megaman/drilarm1" = [0x5B]
"megaman/wideblde" = [0x5C]
