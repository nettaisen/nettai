# Simplified Chinese: EXE6's strings by definition key, for the battle and the app in zh-Hans (docs/design/
# text-rendering.md §10). Display text only: the battle counts the content's own strings (en.toml), so this
# table changes neither the battle nor the content's hash. The game's words are the Legacy Collection's Simplified Chinese (简体中文), as
# bn6battle-verify's tools/bnlc/locales.py writes and checks them (Mega Man Battle Network Legacy
# Collection Vol. 2: its message packs and its card reader's texts); the content's own words, which no game
# has (the rulesets', the battle themes', the lettered pictures', the DS's party programs'...), are
# translated here and kept as they are.

