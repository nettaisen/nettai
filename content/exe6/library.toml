# EXE6's library order: the chips by library category in the order the game's own library screen lists them
# (sub_81258F8 on: Standard, Mega, Giga, Secret, Program Advance), Gregar's version chips before Falzar's where
# the two versions list different chips at the same places (Mega #7-21, Giga #1-5), and the NaviCust programs and
# patch cards by their numbers. Written by the verification workspace's `gen-content library` from the ROMs;
# its `check` compares it with them. Menus list in it (nettai_content::library); the battle reads none of it.

