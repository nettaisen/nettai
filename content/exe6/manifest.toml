# EXE6's manifest (docs/design/content-model-v2.md §4.0): a game pack: what a match plays. It requires only its own
# modules and those of the support packs it depends on. What it has is what its top module, init.luau, requires.
# tools/content/index.py (the verification workspace) keeps it.
id = "exe6"
kind = "game"
depends = ["exelib"]
# Its locales' text tables (top-level tables of key to text that no definition owns; a top-level table that is no
# collection and not one of these the locales' check refuses): `game`, the game's `name` as a player sees it (BN6 in
# English, EXE6 in Japanese: the header's, a message's); `patch_card_effects`, each patch card effect's line on the
# card screen, by the effect's kind and choice; `patch_card_groups`, the two groups the card screen lists them in, by
# the effects' `group`; `bugs`, each NaviCust bug's name; `builds`, what a build is made of, by name (rules/builds:
# its versions and its choices' presets); `battle_themes`, each battle theme's name, by its song's asset name
# (rules/battle_themes); `lettering`, the words of the battle's lettered pictures (the banners, the HUD's labels, the
# chip window's help pictures) by picture, which the enhanced graphics draw in a font in their place
# (docs/design/text-rendering.md §12).
# `emotions`, the emotions a navi can be held in (its rules' `emotion.order`, `EmotionRules::holdable`), by name,
# for the app's practice menu, which holds a side in one.
text = ["game", "patch_card_effects", "patch_card_groups", "bugs", "builds", "battle_themes", "rulesets", "lettering", "emotions"]
