# BN5's look in nettai (docs/app.md §10; docs/design/app-ui.md §4): the colors the app's menus are drawn in while the
# game is selected, and the pattern of their backdrop. Team ProtoMan and Team Colonel's liberation map: field-ops
# lime over olive dark, an isometric grid. The app reads it from the content alone, as it reads the game's name, so
# the menus are in the game's look before the game is loaded; the battle reads none of it. A color is 0xRRGGBB; a
# strength is the opacity something is drawn at, from 0 to 1.

# The backdrop's ground, top to bottom, and the glow at its top right.
ground_top = 0x11150F
ground_bottom = 0x040603
glow = 0xC8FF5A
glow_strength = 0.16
# A panel, a control raised on it (a button, a pressed row), every line, and a well cut into them (a field, a
# value's box).
panel = 0x141A12
raised = 0x1D2619
line = 0x3F5435
inset = 0x080B06
# Text, text that says less, and text that says least.
text = 0xF0F5E8
muted = 0xA6B597
dim = 0x617056
# The cursor (and the chosen row's bar, the active pane's title), the main action, and the text on the main action.
cursor = 0xC8FF5A
action = 0xFFCC33
action_ink = 0x171200

# The backdrop's pattern: an isometric grid, its lines at 30 degrees each way.
[pattern]
kind = "isometric_grid"
color = 0xC8FF5A
strength = 0.055
