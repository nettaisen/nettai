[package]
name = "nettai-android-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The nettai app on Android: the library the APK's activity loads (`android_main`), which packaging/android/package.sh makes the APK of (empty elsewhere)"
publish = false

[lib]
# (libnettai_app.so: the manifest's android.app.lib_name. Not `nettai`, the app's own crate's name.)
name = "nettai_app"
crate-type = ["cdylib"]

[target.'cfg(target_os = "android")'.dependencies]
nettai = { path = "../nettai" }
nettai-android = { path = "../nettai-android" }
android-activity = { version = "0.6", features = ["game-activity"] }
# The app's futures under tokio, as the desktop's `main` runs them (crates/nettai/src/main.rs).
tokio = { version = "1", features = ["rt-multi-thread"] }
# reqwest checks certificates with Android's own verifier through this (the version reqwest's is), which calls its
# Kotlin component in the APK through JNI: it is given the VM and the activity first (`android_main`).
rustls-platform-verifier = "0.7"

[build-dependencies]
# The NDK's clang, asked where its compiler-rt builtins are (build.rs).
cc = "1"
