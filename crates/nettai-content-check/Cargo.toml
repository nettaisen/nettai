[package]
name = "nettai-content-check"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Type-checks a Luau content pack against the content API definitions (core.d.luau)"

# Luau's analysis frontend, in process. It bundles its own copy of Luau, so
# this crate must never be linked into a binary with nettai-luau (mlua's Luau):
# the two copies' C++ symbols collide.
[dependencies]
luau-analyze = "0.0.1"
# The content's packs (their manifests, their declarations, what a pack may
# require) and its requires' paths (`keys::resolve`): no mlua there.
nettai-content-api = { path = "../nettai-content-api" }
