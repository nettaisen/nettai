[package]
name = "nettai-luau"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Luau runtime for bn6 battle content: stateless scripts over the content API"

[dependencies]
nettai-content-api = { path = "../nettai-content-api" }
mlua = { version = "0.12", features = ["luau"] }

[features]
# Luau's native code generator (mlua's `luau-jit`), selectable per pack with
# `Options::native_code`.
jit = ["mlua/luau-jit"]
