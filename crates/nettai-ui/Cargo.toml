[package]
name = "nettai-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The nettai app's UI: its Slint files compiled to Rust, with its fonts and its translations bundled. No logic: the app (crates/nettai) drives it"

# This crate is what `slint-build` generates and nothing else, so that an edit to the app's Rust never compiles
# it again, and so that it can be built without optimization while the rest of the workspace's dev profile is
# optimized (the workspace's Cargo.toml; docs/app.md §14).

[dependencies]
# Slint on winit, drawn with femtovg (OpenGL): the one renderer that tells the app when it draws, which is the
# app's clock (docs/app.md §1). `unstable-winit-030` lets the app hear winit's events before Slint does.
slint = { version = "1.18", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "compat-1-2", "unstable-winit-030", "unstable-fontique-011"] }

[build-dependencies]
slint-build = "1.18"
