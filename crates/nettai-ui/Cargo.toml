[package]
name = "nettai-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The nettai app's UI: its Slint files compiled to Rust, with its fonts and its translations bundled. No logic: the app (crates/nettai) drives it"

# This crate is what `slint-build` generates and nothing else, so that an edit to the app's Rust never compiles
# it again, and so that it can be built without optimization while the rest of the workspace's dev profile is
# optimized (the workspace's Cargo.toml; docs/app.md §14).

[dependencies]
# Slint on winit. `unstable-winit-030` lets the app hear winit's events before Slint does.
slint = { version = "1.18", default-features = false, features = ["std", "backend-winit", "compat-1-2", "unstable-winit-030", "unstable-fontique-011"] }

# The renderer: femtovg, on OpenGL (WebGL in a browser); on iOS, where Slint has no OpenGL, on wgpu (Metal), which tells
# when it draws, as the app's clock asks (docs/app.md §1), only with `unstable-wgpu-30` (without it the window drew
# and nothing ran). (Slint's winit backend builds Skia on iOS too, and would pick it: the app asks for femtovg by name
# there, since Skia can't have the UI changed in its rendering notifier, where the app's frame runs: a component
# dropped there panics in it.) The app draws the same on each.
[target.'cfg(not(target_os = "ios"))'.dependencies]
slint = { version = "1.18", default-features = false, features = ["renderer-femtovg"] }
[target.'cfg(target_os = "ios")'.dependencies]
slint = { version = "1.18", default-features = false, features = ["renderer-femtovg-wgpu", "unstable-wgpu-30"] }

[build-dependencies]
slint-build = "1.18"
