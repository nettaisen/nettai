[package]
name = "nettai-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The nettai app's UI: its Slint files compiled to Rust, with its fonts and its translations bundled. No logic: the app (crates/nettai) drives it"

# This crate is what `slint-build` generates and nothing else, so that an edit to the app's Rust never compiles
# it again, and so that it can be built without optimization while the rest of the workspace's dev profile is
# optimized (the workspace's Cargo.toml; docs/app.md §14).

[dependencies]
# Slint on winit (the app reaches winit's events itself, through Slint's winit backend: crates/nettai).
slint = { version = "1.18", default-features = false, features = ["std", "backend-winit", "compat-1-2", "unstable-fontique-011"] }

# The renderer: femtovg, on OpenGL (WebGL in a browser); on iOS, where Slint has no OpenGL, on wgpu (Metal). The app
# draws the same on either, and its clock runs on either (each tells when it draws: docs/app.md §1).
[target.'cfg(not(target_os = "ios"))'.dependencies]
slint = { version = "1.18", default-features = false, features = ["renderer-femtovg"] }
[target.'cfg(target_os = "ios")'.dependencies]
slint = { version = "1.18", default-features = false, features = ["renderer-femtovg-wgpu"] }

[build-dependencies]
slint-build = "1.18"
