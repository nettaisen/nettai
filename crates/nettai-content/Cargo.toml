[package]
name = "nettai-content"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The battle content: a game's Luau, strings, library order and look, loaded into the engine's data; its bundles and their store"

[dependencies]
# Files, threads, time and dialogs: the desktop's, or the browser's.
nettai-platform = { path = "../nettai-platform" }
nettai-assets = { path = "../nettai-assets" }
# The battle data model the content loads into.
nettai-battle.workspace = true
# The definitions the define phase reads (the lint of `nettai-content check`).
nettai-content-api = { path = "../nettai-content-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Writing TOML with hex ids and flag words (the version toml uses).
toml_edit = "0.22"
# Content bundles (bundle.rs): the deterministic tar, its gzip, and its SHA-256 id.
tar = { version = "0.4", default-features = false }
flate2 = "1"
sha2 = "0.10"
# Reading and drawing the frames' drawings (`shapes`, SVG): the version
# Slint builds into the app, so the build has one copy.
resvg = { version = "=0.48.1", default-features = false }

[dev-dependencies]
nettai-battle = { workspace = true, features = ["test-content"] }
