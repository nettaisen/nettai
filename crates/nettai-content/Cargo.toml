[package]
name = "nettai-content"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Content packs: the battle data, graphics and sound in open, editable formats (TOML, indexed PNG + JSON, MIDI + TOML + WAV), loaded exactly into the engine's data"

[dependencies]
nettai-assets = { path = "../nettai-assets" }
# The battle data model the pack's battle files load into.
nettai-battle.workspace = true
# The definitions the define phase reads (the lint of `nettai-content check`).
nettai-content-api = { path = "../nettai-content-api" }
m4a.workspace = true
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Writing TOML with hex ids and flag words (the version toml uses).
toml_edit = "0.22"
miniz_oxide = "0.8"

[dev-dependencies]
nettai-battle = { workspace = true, features = ["test-content"] }
