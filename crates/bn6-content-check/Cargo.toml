[package]
name = "bn6-content-check"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Type-checks a Luau content pack against the content API definitions (core.d.luau)"

# Luau's analysis frontend, in process. It bundles its own copy of Luau, so
# this crate must never be linked into a binary with bn6-luau (mlua's Luau):
# the two copies' C++ symbols collide.
[dependencies]
luau-analyze = "0.0.1"
