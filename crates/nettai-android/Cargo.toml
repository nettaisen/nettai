[package]
name = "nettai-android"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Android's side of the app: the activity the entry point hands over, and Java's calls through JNI, which the other crates' Android parts use (empty elsewhere)"

# The app's activity (as Slint's Android backend has it, a NativeActivity) and Java's calls, through JNI.
[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
jni = "0.22"
