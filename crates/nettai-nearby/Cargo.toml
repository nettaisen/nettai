[package]
name = "nettai-nearby"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The Legacy Collection's ROMs from one device to another on the local network: found by DNS-SD (Bonjour), sent over TCP"

[dependencies]
log = "0.4"

# The desktop's discovery: mDNS and DNS-SD in Rust, its own thread.
[target.'cfg(not(any(target_arch = "wasm32", target_os = "ios", target_os = "android")))'.dependencies]
mdns-sd = "0.21"

# iOS's discovery is the system's DNS-SD (dns_sd.h, libSystem's: no crate), waited on with poll; on macOS too, for
# this crate's tests. The desktop's name is its host name (gethostname) on every Unix.
[target.'cfg(all(unix, not(target_os = "android")))'.dependencies]
libc = "0.2"

# The device's name on iOS: UIDevice's (the model's, "iPhone", without an entitlement Apple grants).
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
objc2-ui-kit = { version = "0.3", default-features = false, features = ["std", "UIDevice"] }

# Android's discovery is NsdManager, from Kotlin (android/), heard through native methods; started through JNI on the
# activity (ndk-context's VM and activity, which android-activity sets).
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
ndk-context = "0.1"

[build-dependencies]
# The targets by name (build.rs).
cfg_aliases = "0.2"
