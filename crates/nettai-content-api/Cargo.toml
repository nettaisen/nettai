[package]
name = "nettai-content-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The battle engine's content API: what chips, attacks and effects see of the core"

[dependencies]
# SpriteId is written "CC-II" in content files; the derives (`serde(transparent)`).
serde = { version = "1", features = ["derive"] }
