[package]
name = "nettai-match"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Match files: everything a round needs (the game and its ruleset, the arena, each side's navi, folder, Crosses, patch cards and NaviCust), by name in the game, checked against the content; and live play's random draw of one"

[dependencies]
nettai-battle.workspace = true
nettai-content-api = { path = "../nettai-content-api" }
# The save importers alone (src/import.rs, src/import_exe5.rs): a save file
# is the original's bytes, which a game's compat crate reads. EXE5's also
# gives the original's chip numbers, the tie-break of the auto battle data
# the game's writer would make (src/auto_battle.rs).
exe6-compat = { path = "../exe6-compat" }
exe5-compat = { path = "../exe5-compat" }
serde ={ version = "1", features = ["derive"] }
toml = "0.8"
# A match file's folder entries written one a line.
toml_edit = "0.22"
# `testing`: EXE6's content for other crates' tests (its strings).
nettai-content = { path = "../nettai-content", optional = true }

[features]
# `testing::exe6_content`: content/exe6's definitions on a made-up asset index,
# for this and other crates' tests (nothing from a ROM).
testing = ["dep:nettai-content", "nettai-battle/test-content"]

# Prints the setups of random matches and match files, to compare before and
# after a change to how a side is made.
[[example]]
name = "setup_dump"
required-features = ["testing"]

[dev-dependencies]
nettai-battle = { workspace = true, features = ["test-content"] }
nettai-content = { path = "../nettai-content" }
