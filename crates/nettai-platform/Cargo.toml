[package]
name = "nettai-platform"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "What the app asks of the system, the same on the desktop and in a browser: files, threads, time, dialogs, the clipboard, files dropped, files over HTTP"

[dependencies]
# Files over HTTP(S) (`http`): reqwest, hyper and rustls on the desktop (no provider of its own: ring's, given),
# the browser's fetch there.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
# A body taken as it comes, for its progress (`http::get_reporting`).
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# What goes wrong, said as a warning: the app keeps them in its log.
log = "0.4"
# Work done off the window's thread, awaited (`task::off_thread`).
futures-channel = "0.3"
# Time: std's on the desktop, the browser's `performance.now()` there (std's panics).
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The system's file dialogs.
rfd = "0.15"
# The system's clipboard.
arboard = { version = "3", default-features = false }
# The TLS provider reqwest is given (`http`): ring's, as the tree's rustls has (nettai-rtc's).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# The browser's: its workers, dialogs, downloads and clipboard.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[dev-dependencies]
# A plain executor, to poll a future as the window's loop would (`task`'s test).
futures-executor = "0.3"
