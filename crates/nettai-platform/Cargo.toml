[package]
name = "nettai-platform"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "What the app asks of the system, the same on the desktop, in a browser and on a phone: files, threads, time, dialogs, the clipboard, files dropped, files over HTTP"

[dependencies]
# Files over HTTP(S) (`http`): reqwest, hyper and rustls on the desktop (no provider of its own: ring's, given),
# the browser's fetch there.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
# A body taken as it comes, for its progress (`http::get_reporting`).
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# What goes wrong, said as a warning: the app keeps them in its log.
log = "0.4"
# Work done off the window's thread, awaited (`task::off_thread`).
futures-channel = "0.3"
# Time: std's on the desktop, the browser's `performance.now()` there (std's panics).
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The TLS provider reqwest is given (`http`): ring's, as the tree's rustls has (nettai-rtc's).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# The desktop's file dialogs and clipboard (neither has a phone's).
[target.'cfg(not(any(target_arch = "wasm32", target_os = "ios", target_os = "android")))'.dependencies]
rfd = "0.15"
arboard = { version = "3", default-features = false }

# The browser's: its workers, dialogs, downloads and clipboard.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

# Android: the app's activity (as Slint's Android backend has it, a NativeActivity) and Java's calls, through JNI.
[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
jni = "0.22"

[build-dependencies]
# The targets by name (build.rs: `desktop`, `web`, `phone`).
cfg_aliases = "0.2"

[dev-dependencies]
# A plain executor, to poll a future as the window's loop would (`task`'s test).
futures-executor = "0.3"
