[package]
name = "nettai-platform"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "What the app asks of the system, the same on the desktop and in a browser: files, threads, time, dialogs, the clipboard, files dropped"

[dependencies]
# What goes wrong, said as a warning: the app keeps them in its log.
log = "0.4"
# Time: std's on the desktop, the browser's `performance.now()` there (std's panics).
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The system's file dialogs.
rfd = "0.15"
# The system's clipboard.
arboard = { version = "3", default-features = false }

# The browser's: its workers, dialogs, downloads and clipboard.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
