[package]
name = "nettai-demo"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The desktop program over nettai-frontend: the match editor and the battle played in its window (iced), the command line, headless frames, the audits, the replay of the original's recordings, and the audio device"

[dependencies]
# What plays the battles: the program is a host of this library.
nettai-frontend = { path = "../nettai-frontend" }
# Its headless tools, which nettai-tools now holds.
nettai-tools = { path = "../nettai-tools" }
nettai-battle = { path = "../nettai-battle" }
nettai-render = { path = "../nettai-render" }
# The recording replay alone (src/trace.rs: `trace_rounds`): a recording is
# the original's numbers, which a game's compat crate reads and compares.
exe6-compat = { path = "../exe6-compat", features = ["trace"] }
# EXE5's recordings (the chip lab's EXE5 library), played as EXE6's are.
exe5-compat = { path = "../exe5-compat", features = ["trace"] }
nettai-assets = { path = "../nettai-assets" }
# The audio device (`AudioOut`: the `playback` feature, cpal).
nettai-audio = { path = "../nettai-audio" }
nettai-netplay = { path = "../nettai-netplay" }
# Netplay's transport: WebRTC data channels, in a signaling server's room or
# directly (src/net.rs).
nettai-rtc = { path = "../nettai-rtc" }
nettai-content = { path = "../nettai-content" }
nettai-match = { path = "../nettai-match" }
nettai-content-api = { path = "../nettai-content-api" }
m4a.workspace = true
# The window.
iced = { version = "0.14", default-features = false, features = ["wgpu", "tiny-skia", "crisp", "web-colors", "thread-pool", "linux-theme-detection", "x11", "wayland", "canvas", "image-without-codecs", "advanced"] }
# The battle's picture on the GPU renderer: a texture written in place
# (src/picture.rs: iced_wgpu's custom primitive, wgpu through iced).
iced_wgpu = { version = "0.14", default-features = false }
bytemuck = "1"
rfd = "0.15"
png = "0.17"
toml = "0.8"
# A recording's setup line, for the game it states.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Reading the headless test's PNGs back.
png = "0.17"
nettai-battle = { path = "../nettai-battle", features = ["test-content"] }
nettai-match = { path = "../nettai-match", features = ["testing"] }
# A signaling server in process (the handshake in a room).
nettai-rtc = { path = "../nettai-rtc", features = ["testing"] }
