[package]
name = "exe5-extract"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Extracts the EXE5 ROMs' battle assets (graphics, sound) into a content pack"

[dependencies]
# EXE5's asset names (content/exe5/compat/assets.toml) and chip keys.
exe5-compat = { path = "../exe5-compat" }
m4a.workspace = true
nettai-assets = { path = "../nettai-assets" }
nettai-content = { path = "../nettai-content" }
nettai-content-api = { path = "../nettai-content-api" }
