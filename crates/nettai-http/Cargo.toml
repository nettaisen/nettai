[package]
name = "nettai-http"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "A file over HTTP(S), async, the same call everywhere: reqwest's, on hyper and rustls natively and the browser's fetch in a browser"

[dependencies]
# Files over HTTP(S): reqwest, hyper and rustls natively (no provider of its own: ring's, given), the browser's fetch
# there.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
# A body taken as it comes, for its progress (`get_reporting`).
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The TLS provider reqwest is given: ring's, as the tree's rustls has (nettai-rtc's).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
