[package]
name = "exe6-compat"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The original game's numbers for EXE6's content (content/exe6/compat), and what reads them: the codecs of the game's setup records and the golden-trace harness. The engine never depends on it."

[dependencies]
nettai-battle.workspace = true
nettai-content-api = { path = "../nettai-content-api" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
toml = "0.8"

[features]
# Recorded battles (golden traces): reading them, replaying them through
# the engine, and comparing it with them.
trace = ["dep:serde_json"]

[dev-dependencies]
nettai-battle = { workspace = true, features = ["test-content"] }
# content/exe6 itself, for the test of what its forms say of each other
# (tests/forms.rs).
nettai-match = { path = "../nettai-match", features = ["testing"] }
