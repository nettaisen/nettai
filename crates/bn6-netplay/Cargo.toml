[package]
name = "bn6-netplay"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Rollback netplay (GGPO-style) for the battle engine, with a simulated network for testing"

[dependencies]
bn6-battle.workspace = true

[features]
# Run the battles with the GunDelSol slice as content (docs/design/scripting.md):
# the Luau pack, or the same slice in Rust against the content API.
luau = ["bn6-battle/luau"]
rust-content = ["bn6-battle/rust-content"]
# Reading golden traces (examples/rollback_cost).
trace = ["bn6-battle/trace"]

[[example]]
name = "rollback_cost"
required-features = ["trace"]
