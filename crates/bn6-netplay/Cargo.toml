[package]
name = "bn6-netplay"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Rollback netplay for the battle engine on getgud, with a simulated network for testing"

[dependencies]
bn6-battle.workspace = true
getgud.workspace = true

[features]
# Reading golden traces (examples/rollback_cost).
trace = ["bn6-battle/trace"]

[dev-dependencies]
bn6-battle = { workspace = true, features = ["test-content"] }
# rollback_cost loads the BN6 content pack.
bn6-content = { path = "../bn6-content" }

[[example]]
name = "rollback_cost"
required-features = ["trace"]
