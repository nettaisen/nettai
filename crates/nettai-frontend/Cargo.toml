[package]
name = "nettai-frontend"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The desktop app that shows nettai battles drawn by nettai-render: replays golden traces, plays live or over the network, with sound"

[dependencies]
nettai-battle = { path = "../nettai-battle" }
# The drawing: a battle into frames.
nettai-render = { path = "../nettai-render" }
# Trace playback, and the live driver's setup records.
bn6-compat = { workspace = true, features = ["trace"] }
# BN5's recordings (the chip lab's BN5 library), played as BN6's are.
bn5-compat = { path = "../bn5-compat", features = ["trace"] }
nettai-assets = { path = "../nettai-assets" }
nettai-audio = { path = "../nettai-audio" }
# Live play against another player: rollback (getgud) over the rennet
# protocol, on UDP.
nettai-netplay = { path = "../nettai-netplay" }
nettai-content = { path = "../nettai-content" }
# Match files (--match): the setup a round is played from, checked; live
# play's random draw of one.
nettai-match = { path = "../nettai-match" }
# The handles the engine names content by (a chip in a hand).
nettai-content-api = { path = "../nettai-content-api" }
m4a.workspace = true
minifb = "0.28"
# A netplay offer: a match file's names, in TOML.
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
# Reading the headless test's PNGs back.
png = "0.17"
nettai-battle = { path = "../nettai-battle", features = ["test-content"] }
nettai-match = { path = "../nettai-match", features = ["testing"] }
