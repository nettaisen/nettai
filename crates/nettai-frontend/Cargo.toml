[package]
name = "nettai-frontend"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Draws nettai battles: replays golden traces or plays live"

[dependencies]
nettai-battle = { path = "../nettai-battle" }
# Trace playback, and the live driver's setup records.
bn6-compat = { workspace = true, features = ["trace"] }
nettai-assets = { path = "../nettai-assets" }
nettai-audio = { path = "../nettai-audio" }
# Live play against another player: rollback (getgud) over the rennet
# protocol, on UDP.
nettai-netplay = { path = "../nettai-netplay" }
nettai-content = { path = "../nettai-content" }
# The handles the engine names content by (a chip in a hand).
nettai-content-api = { path = "../nettai-content-api" }
m4a.workspace = true
minifb = "0.28"
png = "0.17"
# The text layer's vector font: shaping with kerning, outlines rasterized with
# antialiasing (docs/design/text-rendering.md).
swash = "0.2"

[dev-dependencies]
nettai-battle = { path = "../nettai-battle", features = ["test-content"] }
