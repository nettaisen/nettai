[package]
name = "nettai-frontend"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Plays nettai battles for a host app to show: loads a game, runs a set live or over the network, and gives its frames and sound. A library with no window, audio device or command line in it (nettai-demo is a desktop program over it)"

[dependencies]
nettai-battle = { path = "../nettai-battle" }
# The drawing: a battle into frames.
nettai-render = { path = "../nettai-render" }
nettai-assets = { path = "../nettai-assets" }
# The battle's sound as samples (`BattleAudio`), for the host's own output:
# without `playback`, which is the audio device (cpal).
nettai-audio = { path = "../nettai-audio", default-features = false }
# Live play against another player: rollback (getgud) over the rennet
# protocol, on UDP.
nettai-netplay = { path = "../nettai-netplay" }
# The packs: a game's content, graphics, strings and sound.
nettai-content = { path = "../nettai-content" }
# A match: the setup a set is played from, checked; live play's random pick
# of one; how a set goes on.
nettai-match = { path = "../nettai-match" }
# The handles the engine names content by (a chip in a hand).
nettai-content-api = { path = "../nettai-content-api" }
m4a.workspace = true

[dev-dependencies]
nettai-battle = { path = "../nettai-battle", features = ["test-content"] }
nettai-match = { path = "../nettai-match", features = ["testing"] }
