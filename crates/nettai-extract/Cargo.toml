[package]
name = "nettai-extract"
# The app's: its line (major.minor) is in each pack's fingerprint, the primitives changing only with one.
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Embeddable asset extraction by the games' recipes, and its command-line tool"

[dependencies]
# Files, threads, time and dialogs: the desktop's, or the browser's.
nettai-platform = { path = "../nettai-platform" }
m4a.workspace = true
nettai-assets = { path = "../nettai-assets" }
nettai-content = { path = "../nettai-content" }
nettai-content-api = { path = "../nettai-content-api" }
# The recipes' VM (`nettai_luau::tool`) and its binding.
nettai-luau = { path = "../nettai-luau" }
# A recipe's `data` (its compat TOML) and its fingerprint (SHA-256).
toml = "0.8"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
# The content audit of a pack (tests/extract.rs): the lookups a frontend
# makes of everything the content defines.
nettai-frontend = { path = "../nettai-frontend" }
nettai-tools = { path = "../nettai-tools" }
