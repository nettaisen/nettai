<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 32 32">
<!-- The Regular chip's frame (frame 2 of 2), square round the slot as every box a chip's icon goes in: a dark red band, its outer corners cut, lit along its top, a red line along its inside, the left side wider with a square lamp at its top and bottom ends. -->
<!-- The dark red band round the slot, its outer corners cut (legs 1.5, the art's one-pixel step) -->
<path fill-rule="evenodd" d="M2 4.5 L3.5 3 L21.5 3 L23 4.5 L23 19.5 L21.5 21 L3.5 21 L2 19.5 Z M7 5 L21 5 L21 19 L7 19 Z" fill="#bd314a" data-color="15"/>
<!-- Lit along its top -->
<path d="M3.5 3 L21.5 3 L22.5 4 L2.5 4 Z" fill="#f79418" data-color="10"/>
<!-- The red line along its inside -->
<rect x="5" y="4" width="1" height="15" fill="#ff3121" data-color="14"/>
<rect x="21" y="4" width="1" height="16" fill="#ff3121" data-color="14"/>
<rect x="3" y="19" width="19" height="1" fill="#ff3121" data-color="14"/>
<rect x="2" y="8" width="1" height="7" fill="#ff3121" data-color="14"/>
<!-- A lamp at each end of the left side: a square, lit down its left edge, a darker core at its lower right -->
<rect x="3" y="4" width="2" height="3" fill="#ffe739" data-color="13"/>
<path d="M2 4.5 L2.5 4 L3 4 L3 7 L2 7 Z" fill="#f79418" data-color="10"/>
<rect x="4" y="5" width="1" height="2" fill="#ffd629" data-color="12"/>
<rect x="3" y="16" width="2" height="3" fill="#ffe739" data-color="13"/>
<rect x="2" y="16" width="1" height="3" fill="#ff3121" data-color="14"/>
<rect x="4" y="17" width="1" height="2" fill="#ffd629" data-color="12"/>
</svg>
