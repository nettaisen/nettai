<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1280" viewBox="0 0 120 160">
<!-- The Cross window opening, 24 rows down (what differs from the custom window's and from the open Cross window's): the same frame, its bottom under the tab still the window's. -->
<!-- The panel -->
<rect x="0" y="24" width="88" height="64" fill="#c6d6de" data-color="2" data-palette="9"/>
<rect x="0" y="24" width="1" height="64" fill="#738ca5" data-color="4" data-palette="9"/>
<!-- Beside the header row (its words stay the picture's): the panel and the box's sides going on down -->
<rect x="0" y="88" width="7" height="8" fill="#c6d6de" data-color="2" data-palette="9"/>
<rect x="81" y="88" width="7" height="8" fill="#c6d6de" data-color="2" data-palette="9"/>
<rect x="0" y="88" width="1" height="8" fill="#738ca5" data-color="4" data-palette="9"/>
<rect x="7" y="88" width="1" height="8" fill="#4a637b" data-color="5" data-palette="9"/>
<rect x="80" y="88" width="1" height="8" fill="#4a637b" data-color="5" data-palette="9"/>
<!-- The grooves down its sides: a line a pixel wide leaving the window's edge at 45 degrees, mitered into its straight run down to the window's bottom; the right one the left one mirrored -->
<path d="M0 29.293 L4 33.293 L4 96 L3 96 L3 33.707 L0 30.707 Z" fill="#738ca5" data-color="4" data-palette="9"/>
<path d="M88 29.293 L84 33.293 L84 96 L85 96 L85 33.707 L88 30.707 Z" fill="#738ca5" data-color="4" data-palette="9"/>
<!-- The box round the names -->
<path fill-rule="evenodd" d="M7 31 H81 V88 H7 Z M8 32 V88 H80 V32 Z" fill="#4a637b" data-color="5" data-palette="9"/>
<!-- The window's bottom under the tab, its lines going on down -->
<rect x="72" y="96" width="16" height="4" fill="#c6d6de" data-color="2" data-palette="9"/>
<rect x="78" y="96" width="1" height="4" fill="#9cadbd" data-color="3" data-palette="9"/>
<rect x="79" y="96" width="1" height="4" fill="#738ca5" data-color="4" data-palette="9"/>
<rect x="80" y="96" width="1" height="4" fill="#4a637b" data-color="5" data-palette="9"/>
<rect x="84" y="96" width="1" height="4" fill="#738ca5" data-color="4" data-palette="9"/>
<rect x="72" y="100" width="16" height="1" fill="#738ca5" data-color="4" data-palette="9"/>
<rect x="72" y="101" width="16" height="3" fill="#eff7ff" data-color="1" data-palette="9"/>
</svg>
