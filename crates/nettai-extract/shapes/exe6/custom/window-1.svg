<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1280" viewBox="0 0 120 160">
<!-- EXE6's custom window with the Cross tab (every cell the screen doesn't lay something in; other window maps use it where their cells are the same), drawn as one object: its layers nested, each band one width all round, nested bands offset in parallel so their cuts stay parallel, corners cut at 45 degrees where the art cuts them; round only the glossy chip window (radius 3) and the orb's holder; one ground under the lower window so nothing behind shows through. -->
<!-- The frame round the chip window: its ground, the light lines down the left (x 0 and 3) and beside the column (x 84); BATTLE CHIP is text -->
<rect x="0" y="0" width="88" height="88" fill="#dedeef" data-color="6" data-palette="9"/>
<rect x="0" y="0" width="1" height="88" fill="#a5adbd" data-color="7" data-palette="9"/>
<rect x="3" y="0" width="1" height="88" fill="#a5adbd" data-color="7" data-palette="9"/>
<rect x="84" y="0" width="1" height="88" fill="#a5adbd" data-color="7" data-palette="9"/>
<!-- The chip window, glossy: its top corners round, radius 3 (the most the art allows: radius 4 would take its pixel at 8,8); its bottom runs on under the tab -->
<path d="M7 11 A3 3 0 0 1 10 8 L78 8 A3 3 0 0 1 81 11 L81 88 L7 88 Z" fill="#292929" data-color="8" data-palette="9"/>
<!-- Its glare in the top left corner, a pixel in from its edge, round it at radius 2 (concentric), tapering along the top and down the side -->
<path d="M17 9 L10 9 A2 2 0 0 0 8 11 L8 24 Q12 12 17 9 Z" fill="#524a5a" data-color="10" data-palette="9"/>
<!-- Its lit edge on that corner: a band a pixel wide (radius 2 to 1, concentric), darkest at its ends, lightest down the corner's side -->
<path d="M12.5 9 L10 9 A2 2 0 0 0 8 11 L8 18.5 L9 17.5 L9 11 A1 1 0 0 1 10 10 L11.5 10 Z" fill="#4a637b" data-color="5" data-palette="9"/>
<path d="M11.5 9 L10 9 A2 2 0 0 0 8 11 L8 15.5 L9 14.5 L9 11 A1 1 0 0 1 10 10 L10.5 10 Z" fill="#738ca5" data-color="4" data-palette="9"/>
<path d="M8.586 9.586 A2 2 0 0 0 8 11 L8 12.5 L9 11.5 L9 11 A1 1 0 0 1 9.293 10.293 Z" fill="#9cadbd" data-color="3" data-palette="9"/>
<!-- The glint down its right side: a streak tapering to a point at each end, lighter toward its middle -->
<path d="M78.5 33 L79 45.75 L79 71.25 L78.5 84 L78 71.25 L78 45.75 Z" fill="#524a5a" data-color="10" data-palette="9"/>
<path d="M78.5 41 L79 49 L79 65 L78.5 73 L78 65 L78 49 Z" fill="#4a637b" data-color="5" data-palette="9"/>
<path d="M78.5 49 L79 51 L79 55 L78.5 57 L78 55 L78 51 Z" fill="#738ca5" data-color="4" data-palette="9"/>
<path d="M78.5 51 L79 52 L79 53 L78.5 54 L78 53 L78 52 Z" fill="#9cadbd" data-color="3" data-palette="9"/>
<!-- The panel: one ground under the whole lower window, reaching under the bar so no seam shows; the bar's cut corner stays open -->
<path d="M0 88 L120 88 L120 155 L5.5 155 L0 160.5 Z" fill="#eff7ff" data-color="1" data-palette="9"/>
<!-- The Cross tab: a blue outline a pixel wide all round its light face, its step down one 45-degree cut four rows deep, the outline as wide along it; CROSSSELECT is text -->
<path d="M0 88 L88 88 L88 101 L58.793 101 L54.793 97 L0 97 Z" fill="#738ca5" data-color="4" data-palette="9"/>
<path d="M1 89 L88 89 L88 100 L59.207 100 L55.207 96 L1 96 Z" fill="#c6d6de" data-color="2" data-palette="9"/>
<!-- The groove at its right end: a line a pixel wide slanting down from the column, then straight down into its bottom, mitered -->
<path d="M88 94 L88 95.414 L85 98.414 L85 100 L84 100 L84 98 Z" fill="#738ca5" data-color="4" data-palette="9"/>
<!-- The tab's arrow: an orange outline a pixel wide (its tip cut flat a pixel across, its base's ends upright), an amber face, a yellow light along its left side -->
<path d="M6 89 L7 89 L11 93 L11 95 L2 95 L2 93 Z" fill="#ce6339" data-color="13" data-palette="9"/>
<path d="M6.414 90 L6.586 90 L10 93.414 L10 94 L3 94 L3 93.414 Z" fill="#ffad29" data-color="12" data-palette="9"/>
<path d="M6.414 90 L6.586 90 L7.043 90.457 L3.5 94 L3 94 L3 93.414 Z" fill="#fff729" data-color="11" data-palette="9"/>
<!-- The slots' side: a bar across its top, two notches -->
<rect x="0" y="105" width="6" height="2" fill="#738ca5" data-color="4" data-palette="9"/>
<rect x="0" y="125" width="5" height="1" fill="#9cadbd" data-color="3" data-palette="9"/>
<rect x="0" y="138" width="5" height="1" fill="#9cadbd" data-color="3" data-palette="9"/>
<!-- The housing's shadow on the panel: its outline a pixel lower -->
<path d="M88 12.5 A16 16 0 0 1 120 12.5 L120 106.657 L115.657 111 L92.343 111 L88 106.657 Z" fill="#9cadbd" data-color="3" data-palette="9"/>
<!-- The bar and the window's right border, one blue (the border is the housing's outline going on straight down); the bar's bottom right corner cut 2.5. Where a side meets the bar, the frame is mitered: one 45-degree line through the inner corner, every band of the side ending on it and every band of the bar ending on it -->
<path d="M6.7 154 L118 154 L118 100 L120 100 L120 157.5 L117.5 160 L0 160 L0 159 L1.7 159 Z" fill="#738ca5" data-color="4" data-palette="9"/>
<!-- The bar's groove, three rows: its left end on the miter (under its light), its right end slanting back -->
<path d="M4.7 156 L114.5 156 L117.5 159 L1.7 159 Z" fill="#9cadbd" data-color="3" data-palette="9"/>
<rect x="16" y="156" width="1" height="3" fill="#738ca5" data-color="4" data-palette="9"/>
<rect x="29" y="156" width="1" height="3" fill="#738ca5" data-color="4" data-palette="9"/>
<rect x="90" y="156" width="1" height="3" fill="#738ca5" data-color="4" data-palette="9"/>
<rect x="103" y="156" width="1" height="3" fill="#738ca5" data-color="4" data-palette="9"/>
<!-- The slots' side's line and the border's light line, a pixel wide, straight down to the bar, each ending on its corner's miter (mirror images) -->
<path d="M5 107 L6 107 L6 154.7 L5 155.7 Z" fill="#9cadbd" data-color="3" data-palette="9"/>
<path d="M119 100 L118 100 L118 154 L119 155 Z" fill="#9cadbd" data-color="3" data-palette="9"/>
<!-- The bottom left miter: a 45-degree line from the inner corner (where the slots' line meets the bar's top) to the window's bottom left, lit along the bar's side a pixel wide down to the bar's bottom line, which runs on unbroken under it to the corner; the side's line and the bar's bands end on it -->
<path d="M6 154 L7.414 154 L2.414 159 L1 159 Z" fill="#c6d6de" data-color="2" data-palette="9"/>
<!-- Left of the housing's arch: the column's line up to the top, the dark corner -->
<rect x="89" y="0" width="7" height="8" fill="#292929" data-color="8" data-palette="9"/>
<rect x="88" y="0" width="1" height="12" fill="#738ca5" data-color="4" data-palette="9"/>
<!-- The housing, symmetric about x 104: a blue outline a pixel wide, a slate line a pixel, white two, the dark inside; round over the orb (radii 16, 15, 14 about its center), straight down, its bottom corners cut 45 degrees, each band's cut the one inside it offset in parallel (legs 4.34, 3.76, 3.17, 2), so each band keeps its width round the cut -->
<path d="M88 11.5 A16 16 0 0 1 120 11.5 L120 105.657 L115.657 110.0 L92.343 110.0 L88 105.657 Z" fill="#738ca5" data-color="4" data-palette="9"/>
<path d="M89 11.5 A15 15 0 0 1 119 11.5 L119 105.243 L115.243 109.0 L92.757 109.0 L89 105.243 Z" fill="#9cadbd" data-color="3" data-palette="9"/>
<!-- The slate line lit where it turns under the housing and along its bottom -->
<path d="M89 105.243 L92.757 109 L115.243 109 L119 105.243 L118 104.828 L114.828 108 L93.172 108 L90 104.828 Z" fill="#c6d6de" data-color="2" data-palette="9"/>
<path d="M90 11.5 A14 14 0 0 1 118 11.5 L118 104.828 L114.828 108.0 L93.172 108.0 L90 104.828 Z" fill="#eff7ff" data-color="1" data-palette="9"/>
<!-- The dark inside: its shoulders under the orb cut 45 degrees (legs 3, as the art steps), its bottom the housing four pixels in -->
<path d="M92 21 L95 18 L113 18 L116 21 L116 104 L114 106 L94 106 L92 104 Z" fill="#4a637b" data-color="5" data-palette="9"/>
<!-- The orb's holder, round: its blue edge, the dark ring, the reflection along its bottom, the square tabs at 9 and 3 o'clock, the dark socket -->
<circle cx="104" cy="11.5" r="12" fill="#738ca5" data-color="4" data-palette="9"/>
<circle cx="104" cy="11.5" r="11" fill="#4a637b" data-color="5" data-palette="9"/>
<path d="M103 20.7 L105 20.7 L106 22.2 L102 22.2 Z" fill="#738ca5" data-color="4" data-palette="9"/>
<path d="M103.4 20.7 L104.6 20.7 L105.2 22.2 L102.8 22.2 Z" fill="#9cadbd" data-color="3" data-palette="9"/>
<path d="M103.7 21.4 L104.3 21.4 L104.7 22.2 L103.3 22.2 Z" fill="#c6d6de" data-color="2" data-palette="9"/>
<rect x="93" y="10" width="22" height="3" fill="#292929" data-color="8" data-palette="9"/>
<circle cx="104" cy="11.5" r="9" fill="#292929" data-color="8" data-palette="9"/>
<!-- The black lines across the top and the bottom of the stack of picked chips, square -->
<rect x="95" y="23" width="18" height="3" fill="#292929" data-color="8" data-palette="9"/>
<rect x="95" y="96" width="18" height="9" fill="#292929" data-color="8" data-palette="9"/>
<!-- OK: a black outline a pixel wide, its corners cut (legs 2); inside, the red face, its bevel two wide: light along the top and the left, shade along the right and the bottom, each band stopping square at the corners it shares with the other, so those two corners stay the face's red (a triangle each under the outline's cut, as the art); yellow in the top left corner; the art's shade halfway down the left and the outline thicker halfway down the right -->
<path d="M91 114 L93 112 L114 112 L116 114 L116 130 L114 132 L93 132 L91 130 Z" fill="#292929" data-color="8" data-palette="9"/>
<path d="M92 114.414 L93.414 113 L113.586 113 L115 114.414 L115 129.586 L113.586 131 L93.414 131 L92 129.586 Z" fill="#ff3121" data-color="14" data-palette="9"/>
<path d="M92 114.414 L93.414 113 L113 113 L113 115 L94 115 L94 129 L92 129 Z" fill="#ffad29" data-color="12" data-palette="9"/>
<path d="M113 115 L115 115 L115 129.586 L113.586 131 L94 131 L94 129 L113 129 Z" fill="#a5314a" data-color="15" data-palette="9"/>
<path d="M92 114.414 L93.414 113 L94 113 L94 115 L92 115 Z" fill="#fff729" data-color="11" data-palette="9"/>
<rect x="92" y="120" width="1" height="4" fill="#a5314a" data-color="15" data-palette="9"/>
<rect x="114" y="120" width="1" height="4" fill="#292929" data-color="8" data-palette="9"/>
<text data-words="window.ok" data-box="96 117 16 10" fill="#eff7ff" data-color="1" data-palette="9" x="96" y="127" font-size="13.333" textLength="16">OK</text>
</svg>
