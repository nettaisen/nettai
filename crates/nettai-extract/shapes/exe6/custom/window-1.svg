<polygon points="0,154 4.5,154 0,158.5" fill="#eff7ff" data-color="1" data-palette="9"/>
<polygon points="4.5,154 6.5,154 1.5,159 -0.5,159" fill="#c6d6de" data-color="2" data-palette="9"/>
<polygon points="6,154.5 7.5,156 4.5,156" fill="#9cadbd" data-color="3" data-palette="9"/>
<polygon points="5,152 6,152 7.5,153.5 8,154 8,156 7.5,156 5,153.5" fill="#738ca5" data-color="4" data-palette="9"/>
<polygon points="5.5,152 6.5,152 8.5,154 7.5,154" fill="#9cadbd" data-color="3" data-palette="9"/>
<!-- The bottom right corner: the bar's end, chamfered -->
<polygon points="118.5,152 120,152 120,157.5 117.5,160 117.5,159 114.5,156 116.5,154" fill="#738ca5" data-color="4" data-palette="9"/>
<polygon points="117.5,152 118.5,152 116.5,154 115.5,154" fill="#9cadbd" data-color="3" data-palette="9"/>
<!-- The column's bottom: bands turning 45 degrees into its level bottom -->
<rect x="88" y="104" width="32" height="8" fill="#eff7ff" data-color="1" data-palette="9"/>
<polygon points="86.51,104 93.51,111 114.49,111 121.49,104" fill="#9cadbd" data-color="3" data-palette="9"/>
<polygon points="87.93,104 93.93,110 114.07,110 120.07,104" fill="#738ca5" data-color="4" data-palette="9"/>
<polygon points="89.34,104 94.34,109 113.66,109 118.66,104" fill="#c6d6de" data-color="2" data-palette="9"/>
<polygon points="90.76,104 94.76,108 113.24,108 117.24,104" fill="#eff7ff" data-color="1" data-palette="9"/>
<polygon points="92.17,104 95.17,107 112.83,107 115.83,104" fill="#4a637b" data-color="5" data-palette="9"/>
<polygon points="95,104 96,105 112,105 113,104" fill="#292929" data-color="8" data-palette="9"/>
<!-- The column's right border -->
<rect x="118" y="104" width="1" height="8" fill="#9cadbd" data-color="3" data-palette="9"/>
<rect x="119" y="104" width="1" height="8" fill="#738ca5" data-color="4" data-palette="9"/>
<!-- The orb's housing: the dark corner left of its arch -->
<rect x="88" y="0" width="8" height="8" fill="#292929" data-color="8" data-palette="9"/>
<!-- The housing's outer line -->
<path d="M88 24 V12 A16 16 0 0 1 120 12 V24 Z" fill="#738ca5" data-color="4" data-palette="9"/>
<rect x="88" y="0" width="1" height="24" fill="#738ca5" data-color="4" data-palette="9"/>
<path d="M89 24 V12 A15 15 0 0 1 119 12 V24 Z" fill="#9cadbd" data-color="3" data-palette="9"/>
<!-- Its white ring -->
<path d="M90 24 V12 A14 14 0 0 1 118 12 V24 Z" fill="#eff7ff" data-color="1" data-palette="9"/>
<!-- The orb: a line, a dark gray ring, the dark hole with its slots -->
<circle cx="104" cy="12" r="12" fill="#738ca5" data-color="4" data-palette="9"/>
<circle cx="104" cy="12" r="11" fill="#4a637b" data-color="5" data-palette="9"/>
<!-- The socket under the orb -->
<polygon points="92,24 92,19.5 116,19.5 116,24" fill="#4a637b" data-color="5" data-palette="9"/>
<circle cx="104" cy="12" r="9" fill="#292929" data-color="8" data-palette="9"/>
<rect x="93" y="10" width="22" height="3" fill="#292929" data-color="8" data-palette="9"/>
<!-- The socket's V and its light -->
<polygon points="95.5,19.5 97,19.5 102.5,22.5 101,22.5" fill="#738ca5" data-color="4" data-palette="9"/>
<polygon points="112.5,19.5 111,19.5 105.5,22.5 107,22.5" fill="#738ca5" data-color="4" data-palette="9"/>
<polygon points="104,19.8 106.2,23 101.8,23" fill="#9cadbd" data-color="3" data-palette="9"/>
<polygon points="104,21.3 105.2,23 102.8,23" fill="#c6d6de" data-color="2" data-palette="9"/>
