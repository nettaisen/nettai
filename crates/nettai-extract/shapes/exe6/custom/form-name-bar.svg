<svg xmlns="http://www.w3.org/2000/svg" width="576" height="128" viewBox="0 0 72 16">
<!-- The bar the Cross window's names lie on (the name drawn as text over it, the Cross's portrait at its left kept as the picture): dark orange, a dark outline down its sides and along its bottom, light orange bands toward its right, stepping in from the left, a row of dashes along its middle. -->
<!-- The outline -->
<rect x="0" y="0" width="72" height="16" fill="#313939" data-color="13"/>
<!-- The bar -->
<rect x="1" y="0" width="70" height="15" fill="#d68400" data-color="12"/>
<!-- The light bands toward the right, above and below the dashes (mirror images): each stepping in from the left, its tip cut 45 degrees, a slant down to its deeper part -->
<path d="M28.5 1 L71 1 L71 6 L44 6 L44 4.5 L41 3 L30.5 3 Z" fill="#ffbd10" data-color="11"/>
<path d="M28.5 15 L71 15 L71 10 L44 10 L44 11.5 L41 13 L30.5 13 Z" fill="#ffbd10" data-color="11"/>
<!-- The dashes along the middle, the first two's facing ends slanting as the art's -->
<path d="M43 7 L46 7 L47 9 L43 9 Z" fill="#ffbd10" data-color="11"/>
<rect x="49" y="7" width="4" height="2" fill="#ffbd10" data-color="11"/>
<path d="M56 7 L59 7 L59 9 L55 9 Z" fill="#ffbd10" data-color="11"/>
<rect x="62" y="7" width="3" height="2" fill="#ffbd10" data-color="11"/>
<rect x="67" y="7" width="4" height="2" fill="#ffbd10" data-color="11"/>
</svg>
