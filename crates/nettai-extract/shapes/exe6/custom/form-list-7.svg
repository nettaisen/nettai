<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1280" viewBox="0 0 120 160">
<!-- The Cross window's frame (what differs from the custom window's; its other cells are that drawing's): a panel with an outline down its left and a box round the Crosses' names. -->
<!-- The panel -->
<rect x="0" y="0" width="88" height="96" fill="#c6d6de" data-color="2" data-palette="9"/>
<rect x="0" y="0" width="1" height="96" fill="#738ca5" data-color="4" data-palette="9"/>
<!-- The grooves down its sides, from the window's edge at 45 degrees -->
<path d="M0 7 H1 L3.207 9.207 A1 1 0 0 1 3.5 9.914 V88.5 H0" fill="none" stroke="#738ca5" stroke-width="1" data-stroke="4" data-palette="9"/>
<path d="M88 6 H87 L84.793 8.207 A1 1 0 0 0 84.5 8.914 V88.5 H88" fill="none" stroke="#738ca5" stroke-width="1" data-stroke="4" data-palette="9"/>
<!-- The box round the names -->
<path d="M7 7 H81 V89 H7 Z M8 8 V88 H80 V8 Z" fill="#4a637b" data-color="5" data-palette="9"/>
<!-- The tab's end under the window, with no groove -->
<rect x="80" y="96" width="8" height="4" fill="#c6d6de" data-color="2" data-palette="9"/>
<rect x="80" y="100" width="8" height="1" fill="#738ca5" data-color="4" data-palette="9"/>
<rect x="80" y="101" width="8" height="3" fill="#eff7ff" data-color="1" data-palette="9"/>
</svg>
