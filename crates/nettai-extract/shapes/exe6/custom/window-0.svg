<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1280" viewBox="0 0 120 160">
<!-- The custom window's frame without the Cross tab: what differs from the window with it (its other cells are that drawing's): the frame going on down to the panel, the light lines down its sides closing under the chip window, two dashes, the panel's edge stepping down. -->
<!-- The panel under the strip -->
<rect x="0" y="88" width="88" height="16" fill="#eff7ff" data-color="1" data-palette="9"/>
<!-- The strip under the chip window, the frame going on down to the panel's step (its middle line, under the blue) -->
<path d="M0 88 L88 88 L88 100.5 L59 100.5 L55 96.5 L0 96.5 Z" fill="#dedeef" data-color="6" data-palette="9"/>
<rect x="0" y="88" width="1" height="8" fill="#a5adbd" data-color="7" data-palette="9"/>
<!-- The light lines down the sides closing under the chip window: a pixel wide down the sides, two along the bottom, the outer corners cut (legs 1.5) and the inside ones filled as much, as the art steps them; two dashes under it -->
<path d="M3 88 L3 91.5 L4.5 93 L83.5 93 L85 91.5 L85 88 L84 88 L84 89.5 L82.5 91 L5.5 91 L4 89.5 L4 88 Z" fill="#a5adbd" data-color="7" data-palette="9"/>
<rect x="9" y="93" width="7" height="1" fill="#a5adbd" data-color="7" data-palette="9"/>
<rect x="72" y="93" width="7" height="1" fill="#a5adbd" data-color="7" data-palette="9"/>
<!-- The panel's edge: a blue line a pixel wide, stepping down 45 degrees four rows, as wide along the step (window-1's tab's bottom) -->
<path d="M0 96 L55.207 96 L59.207 100 L88 100 L88 101 L58.793 101 L54.793 97 L0 97 Z" fill="#738ca5" data-color="4" data-palette="9"/>
</svg>
