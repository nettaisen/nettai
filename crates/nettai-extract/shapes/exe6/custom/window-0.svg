<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1280" viewBox="0 0 120 160">
<!-- The custom window's frame without the Cross tab: what differs from the window with it (its other cells are that drawing's): the chip window's border closing under it, two dashes, the strip down to the panel's slanted step. -->
<!-- The strip under the chip window -->
<rect x="0" y="88" width="88" height="13" fill="#dedeef" data-color="6" data-palette="9"/>
<rect x="0" y="88" width="1" height="8" fill="#a5adbd" data-color="7" data-palette="9"/>
<!-- The border's inner line closing under the chip window, its corners cut at 45 degrees -->
<path d="M3 88 H4 V90 L5 91 H83 L84 90 V88 H85 V91.5 L83.5 93 H4.5 L3 91.5 Z" fill="#a5adbd" data-color="7" data-palette="9"/>
<!-- Two dashes -->
<rect x="9" y="93" width="7" height="1" fill="#a5adbd" data-color="7" data-palette="9"/>
<rect x="72" y="93" width="7" height="1" fill="#a5adbd" data-color="7" data-palette="9"/>
<!-- The panel, its step down slanting at 45 degrees -->
<polygon points="0,97 54.5,97 58.5,101 0,101" fill="#eff7ff" data-color="1" data-palette="9"/>
<rect x="0" y="101" width="88" height="3" fill="#eff7ff" data-color="1" data-palette="9"/>
<polygon points="0,96 55.5,96 59.5,100 88,100 88,101 58.5,101 54.5,97 0,97" fill="#738ca5" data-color="4" data-palette="9"/>
<polygon points="53.5,97 54.5,97 58.5,101 57.5,101" fill="#9cadbd" data-color="3" data-palette="9"/>
</svg>
