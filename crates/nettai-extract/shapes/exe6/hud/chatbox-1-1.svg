<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="512" viewBox="0 0 240 64">
<!-- The chatbox's box, the description box (opening, step 1 of 3): a dark blue outline a pixel wide, its corners cut 45 degrees, a light blue band inside it two wide, the white ground the text is written on; every layer's cuts parallel to the outline's, each band as thick through a cut as along its edges. -->
<!-- The outline, a pixel wide, its corners cut 45 degrees -->
<path d="M1 24 L5 20 L211 20 L215 24 L215 40 L211 44 L5 44 L1 40 Z" fill="#086bc6" data-color="11"/>
