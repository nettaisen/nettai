<path d="M2 24.414 L5.414 21 L210.586 21 L214 24.414 L214 39.586 L210.586 43 L5.414 43 L2 39.586 Z" fill="#4abdf7" data-color="10"/>
<!-- The ground, three pixels in, its cuts parallel to the outline's -->
<path d="M4 25.243 L6.243 23 L209.757 23 L212 25.243 L212 38.757 L209.757 41 L6.243 41 L4 38.757 Z" fill="#f7fff7" data-color="1"/>
