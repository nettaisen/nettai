<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="128" viewBox="0 0 144 16">
<!-- The custom gauge's frame (its word off, its fill's cells laid over its middle): a bar with pointed ends sloping 2:1, its outline a line a pixel wide all round (along the top, down each slope, across each tip), a light dash in each end's tip. -->
<!-- The outline, a pixel wide all round: along the top, down each end's point (sloping 2:1) and across its tip -->
<path d="M6 6 L138 6 L144 9 L144 13 L138 16 L6 16 L0 13 L0 9 Z" fill="#39526b" data-color="12"/>
<!-- The dark inside -->
<path d="M6.236 7 L137.764 7 L143 9.618 L143 12.382 L137.764 15 L6.236 15 L1 12.382 L1 9.618 Z" fill="#292929" data-color="2"/>
<!-- A light dash in each end's tip -->
<rect x="2" y="10" width="5" height="2" fill="#7b9cde" data-color="7"/>
<rect x="137" y="10" width="5" height="2" fill="#7b9cde" data-color="7"/>
</svg>
