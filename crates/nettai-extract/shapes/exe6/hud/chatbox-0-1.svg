<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="512" viewBox="0 0 240 64">
<!-- The chatbox's box, the message box, its name's tab on its top edge at the right (opening, step 1 of 3): a dark blue outline a pixel wide, its corners cut 45 degrees, a light blue band inside it two wide, the white ground the text is written on; every layer's cuts parallel to the outline's, each band as thick through a cut as along its edges. -->
<!-- The tab on the top edge: its outline, its left side slanting at 45 degrees, its top right corner cut 45 degrees -->
<path d="M190.5 16 L235 16 L239 20 L239 24 L182.5 24 Z" fill="#086bc6" data-color="11"/>
<!-- The outline, a pixel wide, its corners cut 45 degrees (its top right square under the tab) -->
<path d="M1 24 L5 20 L239 20 L239 40 L235 44 L5 44 L1 40 Z" fill="#086bc6" data-color="11"/>
<!-- The band inside the tab, a pixel in all round, its slant and its cut parallel to the outline's -->
<path d="M190.914 17 L234.586 17 L238 20.414 L238 23 L184.914 23 Z" fill="#4abdf7" data-color="10"/>
<!-- The band, two pixels wide, a pixel in, its cuts parallel to the outline's -->
<path d="M2 24.414 L5.414 21 L238 21 L238 39.586 L234.586 43 L5.414 43 L2 39.586 Z" fill="#4abdf7" data-color="10"/>
<!-- The box's top edge running on through the tab, two rows, three pixels in from the tab's outline: its left end slanting as the tab's side, its right end cut as the tab's corner, parallel -->
<path d="M191.743 19 L233.757 19 L235.757 21 L189.743 21 Z" fill="#086bc6" data-color="11"/>
<!-- The ground, three pixels in, its cuts parallel to the outline's -->
<path d="M4 25.243 L6.243 23 L233.757 23 L236 25.243 L236 38.757 L233.757 41 L6.243 41 L4 38.757 Z" fill="#f7fff7" data-color="1"/>
</svg>
