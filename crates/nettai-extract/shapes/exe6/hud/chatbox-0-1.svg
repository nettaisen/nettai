<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="512" viewBox="0 0 240 64">
<!-- The chatbox's box, the message box, its name's tab on its top edge at the right (opening, step 1 of 3): a dark blue outline a pixel wide, its corners cut 45 degrees, a light blue band inside it two wide, the white ground the text is written on; the outline's cuts as light as the art's, every layer's cuts parallel to them, each band as thick through a cut as along its edges. -->
<!-- The tab on the top edge: its outline, its left side slanting at 45 degrees, its top right corner cut 45 degrees -->
<path d="M190.5 16 L236.5 16 L239 18.5 L239 24 L182.5 24 Z" fill="#086bc6" data-color="11"/>
<!-- The outline, a pixel wide, its corners cut 45 degrees, as lightly as the art's (its top right square under the tab) -->
<path d="M1 22.5 L3.5 20 L239 20 L239 41.5 L236.5 44 L3.5 44 L1 41.5 Z" fill="#086bc6" data-color="11"/>
<!-- The band inside the tab, a pixel in all round, its slant and its cut parallel to the outline's -->
<path d="M190.914 17 L236.086 17 L238 18.914 L238 23 L184.914 23 Z" fill="#4abdf7" data-color="10"/>
<!-- The band, two pixels wide, a pixel in, its cuts parallel to the outline's (smaller; square where it lies further in than a cut reaches) -->
<path d="M2 22.914 L3.914 21 L238 21 L238 41.086 L236.086 43 L3.914 43 L2 41.086 Z" fill="#4abdf7" data-color="10"/>
<!-- The box's top edge running on through the tab, two rows, three pixels in from the tab's outline: its left end slanting as the tab's side, its right end cut as the tab's corner, parallel -->
<path d="M191.743 19 L235.257 19 L236 19.743 L236 21 L189.743 21 Z" fill="#086bc6" data-color="11"/>
<!-- The ground, three pixels in, its cuts parallel to the outline's (smaller; square where it lies further in than a cut reaches) -->
<path d="M4 23.743 L4.743 23 L235.257 23 L236 23.743 L236 40.257 L235.257 41 L4.743 41 L4 40.257 Z" fill="#f7fff7" data-color="1"/>
</svg>
