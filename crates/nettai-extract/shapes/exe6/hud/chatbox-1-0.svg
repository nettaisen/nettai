<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="512" viewBox="0 0 240 64">
<!-- The chatbox's box, the description box (opening, step 0 of 3): a dark blue outline a pixel wide, its corners cut 45 degrees, a light blue band inside it two wide, the white ground the text is written on; the outline's cuts as light as the art's, every layer's cuts parallel to them, each band as thick through a cut as along its edges. -->
<!-- The outline, a pixel wide, its corners cut 45 degrees, as lightly as the art's -->
<path d="M2 29.5 L3.5 28 L212.5 28 L214 29.5 L214 34.5 L212.5 36 L3.5 36 L2 34.5 Z" fill="#086bc6" data-color="11"/>
<!-- The band, two pixels wide, a pixel in, its cuts parallel to the outline's (smaller; square where it lies further in than a cut reaches) -->
<path d="M3 29.914 L3.914 29 L212.086 29 L213 29.914 L213 34.086 L212.086 35 L3.914 35 L3 34.086 Z" fill="#4abdf7" data-color="10"/>
<!-- The ground, three pixels in, its cuts parallel to the outline's (smaller; square where it lies further in than a cut reaches) -->
<path d="M5 31 L211 31 L211 33 L5 33 Z" fill="#f7fff7" data-color="1"/>
</svg>
