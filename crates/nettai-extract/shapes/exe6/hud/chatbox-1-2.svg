<path d="M2 16.414 L5.414 13 L210.586 13 L214 16.414 L214 47.586 L210.586 51 L5.414 51 L2 47.586 Z" fill="#4abdf7" data-color="10"/>
<!-- The ground, three pixels in, its cuts parallel to the outline's -->
<path d="M4 17.243 L6.243 15 L209.757 15 L212 17.243 L212 46.757 L209.757 49 L6.243 49 L4 46.757 Z" fill="#f7fff7" data-color="1"/>
