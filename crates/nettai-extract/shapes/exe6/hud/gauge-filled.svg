<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 8 8">
<!-- A cell of the custom gauge, filled: the fill in the picture's rows of color, a blue row at its top and its bottom round four light rows (no smooth ramp: the user, "remove the gradient on the custom bar in enhanced mode"); the frame's lines under it. -->
<rect x="0" y="0" width="8" height="1" fill="#7b9cde" data-color="7"/>
<rect x="0" y="1" width="8" height="4" fill="#e7efff" data-color="5"/>
<rect x="0" y="5" width="8" height="1" fill="#7b9cde" data-color="7"/>
<!-- The frame's lines under it -->
<rect x="0" y="6" width="8" height="1" fill="#292929" data-color="2"/>
<rect x="0" y="7" width="8" height="1" fill="#39526b" data-color="12"/>
</svg>
