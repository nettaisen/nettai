<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="512" viewBox="0 0 240 64">
<!-- The chatbox's box, the description box (open): a dark blue outline a pixel wide, its corners cut 45 degrees as the art steps them (the outline two pixels across along each cut), a light blue band inside it two wide, the white ground the text is written on, its corners cut a pixel's stair. -->
<!-- The outline, a pixel wide, its corners cut 45 degrees (as the art steps them) -->
<path d="M1 6.5 L3.5 4 L212.5 4 L215 6.5 L215 57.5 L212.5 60 L3.5 60 L1 57.5 Z" fill="#086bc6" data-color="11"/>
<!-- The band, two pixels wide, its corners cut as the outline's, so the outline is two pixels across along each cut, as the art's stair -->
<path d="M2 7.5 L4.5 5 L211.5 5 L214 7.5 L214 56.5 L211.5 59 L4.5 59 L2 56.5 Z" fill="#4abdf7" data-color="10"/>
<!-- The ground, its corners cut as the art steps them (a pixel's stair, legs 1.5, inside the outline's big cuts; square inside its small ones) -->
<path d="M4 8.5 L5.5 7 L210.5 7 L212 8.5 L212 55.5 L210.5 57 L5.5 57 L4 55.5 Z" fill="#f7fff7" data-color="1"/>
</svg>
