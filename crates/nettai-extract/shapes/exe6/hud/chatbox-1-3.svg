<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="512" viewBox="0 0 240 64">
<!-- The chatbox's box, the description box (open): a dark blue outline a pixel wide, its corners cut 45 degrees, a light blue band inside it two wide, the white ground the text is written on; every layer's cuts parallel to the outline's, each band as thick through a cut as along its edges. -->
<!-- The outline, a pixel wide, its corners cut 45 degrees -->
<path d="M1 8 L5 4 L211 4 L215 8 L215 56 L211 60 L5 60 L1 56 Z" fill="#086bc6" data-color="11"/>
<!-- The band, two pixels wide, a pixel in, its cuts parallel to the outline's -->
<path d="M2 8.414 L5.414 5 L210.586 5 L214 8.414 L214 55.586 L210.586 59 L5.414 59 L2 55.586 Z" fill="#4abdf7" data-color="10"/>
<!-- The ground, three pixels in, its cuts parallel to the outline's -->
<path d="M4 9.243 L6.243 7 L209.757 7 L212 9.243 L212 54.757 L209.757 57 L6.243 57 L4 54.757 Z" fill="#f7fff7" data-color="1"/>
</svg>
