<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 16 16">
<!-- The chatbox's key-wait arrow, frame 3 of 3 (1 pixel down: its bob): a green shield pointing down, a dark outline a pixel wide, its sides meeting at the point at 45 degrees, a square notch in its top's middle, lit along its top, its shadow down and to the right. -->
<g transform="translate(0 1)">
<!-- Its shadow: the arrow's shape a pixel right and a pixel down -->
<path d="M4 1 L14 1 L14 6.5 L9.5 11 L8.5 11 L4 6.5 Z" fill="#313952" data-color="9"/>
<!-- The outline, its sides meeting at the point at 45 degrees -->
<path d="M3 0 L13 0 L13 5.5 L8.5 10 L7.5 10 L3 5.5 Z" fill="#21a521" data-color="11"/>
<!-- The green face, a pixel in, its sides parallel -->
<path d="M4 1 L12 1 L12 5.086 L8.086 9 L7.914 9 L4 5.086 Z" fill="#39ff00" data-color="13"/>
<!-- Lit along its top, either side of the notch -->
<rect x="4" y="1" width="3" height="1" fill="#f7fff7" data-color="15"/>
<rect x="9" y="1" width="3" height="1" fill="#f7fff7" data-color="15"/>
<!-- The notch in its top's middle, square -->
<rect x="7" y="0" width="2" height="3" fill="#21a521" data-color="11"/>
</g>
</svg>
