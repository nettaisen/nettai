<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="512" viewBox="0 0 240 64">
<!-- The chatbox's box, the description box (opening, step 2 of 3): a dark outline, its corners cut 45 degrees, a light band inside it, the ground the text is written on; the outline's cuts as light as the art's, every layer's cuts parallel to them, each band as thick through a cut as along its edges. -->
<!-- The outline, two pixels wide, its corners cut 45 degrees, as lightly as the art's -->
<path d="M2 10.5 L3.5 9 L212.5 9 L214 10.5 L214 53.5 L212.5 55 L3.5 55 L2 53.5 Z" fill="#006bbd" data-color="11"/>
<!-- The band, a pixel wide, its cuts parallel to the outline's (smaller; square where it lies further in than a cut reaches) -->
<path d="M4 11.328 L4.328 11 L211.672 11 L212 11.328 L212 52.672 L211.672 53 L4.328 53 L4 52.672 Z" fill="#94cee7" data-color="10"/>
<!-- The ground, its cuts parallel to the outline's (smaller; square where it lies further in than a cut reaches) -->
<path d="M5 12 L211 12 L211 52 L5 52 Z" fill="#f7fff7" data-color="15"/>
</svg>
