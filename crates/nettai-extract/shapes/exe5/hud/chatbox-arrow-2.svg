<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 16 16">
<!-- The chatbox's key-wait arrow, frame 3 of 3 (1 pixel down: its bob): a capped shield pointing down, a dark green outline a pixel wide all round, its sides meeting at the point at 45 degrees, the cap's band and the shield's face lit along their tops and left sides with a glint in the corner, its shadow down and to the right. -->
<defs>
<path id="outline" d="M3 0 L13 0 L13 8.5 L8.5 13 L7.5 13 L3 8.5 Z"/>
<clipPath id="face"><path d="M4 4 L12 4 L12 8.086 L8.086 12 L7.914 12 L4 8.086 Z"/></clipPath>
<clipPath id="cap"><path d="M4 1 L12 1 L12 3 L4 3 Z"/></clipPath>
</defs>
<g transform="translate(0 1)">
<!-- Its shadow: the arrow's shape a pixel right and a pixel down -->
<use href="#outline" x="1" data-color="9" fill="#313952"/>
<use href="#outline" y="1" data-color="9" fill="#313952"/>
<!-- The outline, a pixel wide all round, its sides meeting at the point at 45 degrees -->
<use href="#outline" data-color="12" fill="#21a521"/>
<!-- The cap's band and the shield's face: light, the face's own green over them a pixel right and down, so the light shows along their tops and left sides -->
<path d="M4 1 L12 1 L12 3 L4 3 Z" data-color="14" fill="#84ff63"/>
<g clip-path="url(#cap)"><path d="M5 2 L13 2 L13 4 L5 4 Z" data-color="13" fill="#39ff00"/></g>
<path d="M4 4 L12 4 L12 8.086 L8.086 12 L7.914 12 L4 8.086 Z" data-color="14" fill="#84ff63"/>
<g clip-path="url(#face)"><path d="M5 5 L13 5 L13 9.086 L9.086 13 L8.914 13 L5 9.086 Z" data-color="13" fill="#39ff00"/></g>
<!-- The glints in their top left corners, a pixel each -->
<rect x="4" y="1" width="1" height="1" fill="#f7fff7" data-color="15"/>
<rect x="4" y="4" width="1" height="1" fill="#f7fff7" data-color="15"/>
</g>
</svg>
