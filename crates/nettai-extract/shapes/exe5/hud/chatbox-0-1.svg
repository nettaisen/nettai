<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="512" viewBox="0 0 240 64">
<!-- The chatbox's box, the message box (opening, step 1 of 3): a dark outline, its corners cut 45 degrees, a tab for the name on its top edge at the left, its right side slanting, a light band inside it, the ground the text is written on; the outline's cuts as light as the art's, every layer's cuts parallel to them, each band as thick through a cut as along its edges. -->
<!-- The tab for the name: its outline two pixels wide, its top left corner cut 45 degrees as the box's, its right side slanting 2:1 -->
<path d="M2 14.5 L3.5 13 L44 13 L52 17 L52 19 L2 19 Z" fill="#006bbd" data-color="11"/>
<!-- The outline, two pixels wide, its corners cut 45 degrees, as lightly as the art's (its top left square under the tab) -->
<path d="M2 17 L236.5 17 L238 18.5 L238 45.5 L236.5 47 L3.5 47 L2 45.5 Z" fill="#006bbd" data-color="11"/>
<!-- The band inside the tab: the outline two pixels in, its cut and its slant parallel -->
<path d="M4 15.328 L4.328 15 L43.528 15 L53.528 20 L4 20 Z" fill="#94cee7" data-color="10"/>
<!-- The band, a pixel wide, its cuts parallel to the outline's (smaller; square where it lies further in than a cut reaches) -->
<path d="M4 19 L235.672 19 L236 19.328 L236 44.672 L235.672 45 L4.328 45 L4 44.672 Z" fill="#94cee7" data-color="10"/>
<!-- The ground, its cuts parallel to the outline's (smaller; square where it lies further in than a cut reaches) -->
<path d="M5 20 L235 20 L235 44 L5 44 Z" fill="#f7fff7" data-color="15"/>
</svg>
