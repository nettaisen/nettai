<svg xmlns="http://www.w3.org/2000/svg" width="192" height="128" viewBox="0 0 24 16">
<!-- The soul button, the blocking look: lit white, a yellow face, shaded orange, BLOCK in dark letters (its words drawn as text): a dark outline with rounded corners. -->
<!-- The window round it -->
<rect x="0" y="0" width="24" height="16" fill="#f7ffff" data-color="1"/>
<!-- The plate's outline -->
<path d="M1 3 A2 2 0 0 1 3 1 L22 1 A2 2 0 0 1 24 3 L24 14 A2 2 0 0 1 22 16 L3 16 A2 2 0 0 1 1 14 Z" fill-rule="evenodd" fill="#292929" data-color="8"/>
<!-- Its shade along the right and the bottom -->
<path d="M2 3 A1 1 0 0 1 3 2 L22 2 A1 1 0 0 1 23 3 L23 14 A1 1 0 0 1 22 15 L3 15 A1 1 0 0 1 2 14 Z" fill-rule="evenodd" fill="#ffad29" data-color="12"/>
<!-- Its light along the top and the left -->
<path d="M2 3 A1 1 0 0 1 3 2 L23 2 L21 3 L4 3 L4 14 L2 15 Z" fill-rule="evenodd" fill="#f7ffff" data-color="1"/>
<!-- Brightest in the top left corner -->
<path d="M2 2.5 A0.5 0.5 0 0 1 2.5 2 L5 2 L5 3 L2 3 Z" fill-rule="evenodd" fill="#fff729" data-color="11"/>
<!-- The face -->
<rect x="4" y="3" width="17" height="11" fill="#fff729" data-color="11"/>
<!-- The words -->
<text data-words="window.block" data-box="4 4 17 9" fill="#292929" data-color="8" x="4" y="13" font-size="12" textLength="17">BLOCK</text>
</svg>
