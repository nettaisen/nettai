<svg xmlns="http://www.w3.org/2000/svg" width="192" height="128" viewBox="0 0 24 16">
<!-- The soul button, the blocking look: lit white, a yellow face, shaded orange, BLOCK in dark letters (its words drawn as text): a dark outline, its corners cut. -->
<!-- The window round it -->
<rect x="0" y="0" width="24" height="16" fill="#f7ffff" data-color="1"/>
<!-- The plate's outline, a pixel wide, its corners cut 45 degrees (legs 2.5, as the art steps them) -->
<path d="M1 3.5 L3.5 1 L21.5 1 L24 3.5 L24 13.5 L21.5 16 L3.5 16 L1 13.5 Z" fill="#292929" data-color="8"/>
<!-- The face, cut parallel; its bevel lit along the top (a pixel) and the left (two), shaded along the right (two) and the bottom (a pixel), each stopping square at the corners it shares with the other, so the face shows there; brightest in the top left corner -->
<path d="M2 3.914 L3.914 2 L21.086 2 L23 3.914 L23 13.086 L21.086 15 L3.914 15 L2 13.086 Z" fill="#fff729" data-color="11"/>
<path d="M2 3.914 L3.914 2 L21 2 L21 3 L4 3 L4 14 L2.914 14 L2 13.086 Z" fill="#f7ffff" data-color="1"/>
<path d="M21 3 L22.086 3 L23 3.914 L23 13.086 L21.086 15 L4 15 L4 14 L21 14 Z" fill="#ffad29" data-color="12"/>
<path d="M3 2.914 L3.914 2 L4 2 L4 3 L3 3 Z" fill="#fff729" data-color="11"/>
<!-- The words -->
<text data-words="window.block" data-box="4 4 17 9" fill="#292929" data-color="8" x="4" y="13" font-size="12" textLength="17">BLOCK</text>
</svg>
