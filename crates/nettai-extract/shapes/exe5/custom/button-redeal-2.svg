<svg xmlns="http://www.w3.org/2000/svg" width="256" height="192" viewBox="0 0 32 24">
<!-- The SHUFFLE button (two slots wide), picked: an orange light, a dark orange face, a dark red shade, its words yellow: a dark outline with rounded corners, lit along its top and left, shaded along its right and bottom, two slots cut in its top edge and two tabs standing on its bottom edge; its words drawn as text. -->
<!-- The window round it -->
<rect x="0" y="0" width="32" height="24" fill="#e7e7ef" data-color="2"/>
<!-- The outline, its corners rounded -->
<path d="M2 4 A2 2 0 0 1 4 2 L28 2 A2 2 0 0 1 30 4 L30 20 A2 2 0 0 1 28 22 L4 22 A2 2 0 0 1 2 20 Z" fill-rule="evenodd" fill="#292929" data-color="8"/>
<!-- The light along the top and the left -->
<path d="M3 4 A1 1 0 0 1 4 3 L29 3 L28 4 L4 4 L4 20 L3 21 Z" fill-rule="evenodd" fill="#ffad29" data-color="12"/>
<!-- The shade along the right and the bottom -->
<path d="M28 4 L29 3 L29 20 A1 1 0 0 1 28 21 L3 21 L4 20 L28 20 Z" fill-rule="evenodd" fill="#a5314a" data-color="15"/>
<!-- The face -->
<rect x="4" y="4" width="24" height="16" fill="#ce6339" data-color="13"/>
<!-- A slot cut down into the top edge: its inside the face, its rim round it, the far walls lit, the near one shaded, meeting at a mitre -->
<rect x="7" y="3" width="5" height="3" fill="#ce6339" data-color="13"/>
<polygon points="11,4 12,4 12,6 7,6 8,5 11,5" fill="#ffad29" data-color="12"/>
<polygon points="7,4 8,4 8,5 7,6" fill="#a5314a" data-color="15"/>
<!-- A tab standing up from the bottom edge: its shaded rim over it, its inside the face -->
<polygon points="7,18 12,18 12,20 11,20 11,19 8,19 8,20 7,20" fill="#a5314a" data-color="15"/>
<rect x="7" y="20" width="5" height="1" fill="#ce6339" data-color="13"/>
<!-- The other slot -->
<rect x="20" y="3" width="5" height="3" fill="#ce6339" data-color="13"/>
<polygon points="24,4 25,4 25,6 20,6 21,5 24,5" fill="#ffad29" data-color="12"/>
<polygon points="20,4 21,4 21,5 20,6" fill="#a5314a" data-color="15"/>
<!-- The other tab -->
<polygon points="20,18 25,18 25,20 24,20 24,19 21,19 21,20 20,20" fill="#a5314a" data-color="15"/>
<rect x="20" y="20" width="5" height="1" fill="#ce6339" data-color="13"/>
<!-- The words -->
<text data-words="window.shuffle" data-box="4 8 23 8" fill="#fff729" data-color="11" x="4" y="16" font-size="10.667" textLength="23">SHUFFLE</text>
</svg>
