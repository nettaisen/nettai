<polygon points="114,153.2 115.4,153.2 119.8,157.6 119.8,159 118.4,159" fill="#e7e7ef" data-color="2" data-palette="9"/>
<polygon points="120,157.4 120,160 117.4,160" fill="#292929" data-color="8" data-palette="9"/>
