<path d="M89 116.5 A2.5 2.5 0 0 1 91.5 114 L109.5 114 A2.5 2.5 0 0 1 112 116.5 L112 131.5 A2.5 2.5 0 0 1 109.5 134 L91.5 134 A2.5 2.5 0 0 1 89 131.5 Z" fill-rule="evenodd" fill="#292929" data-color="8" data-palette="9"/>
