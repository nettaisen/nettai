<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1280" viewBox="0 0 120 160">
<!-- EXE5's custom window's frame (every cell the screen doesn't lay something in): a gray frame with dark holes down its left edge, a light groove round the chip window's frame, the chip window with its corners rounded as the pixels step round them and its glare in three corners, the panel under it (its outline cut at 45 degrees at the top left, its top stepping down at the right), the bottom bar and the right frame, the column's housing with the orb's socket on top (its bottom left corner cut at 45 degrees), the OK button. Square where the pixels are square. -->
<!-- The gray frame -->
<rect x="0" y="0" width="88" height="100" fill="#cecece" data-color="6" data-palette="9"/>
<!-- The holes down the left edge: lit along their top and right edges -->
<rect x="0" y="8" width="2" height="1" fill="#adada5" data-color="7" data-palette="9"/>
<rect x="0" y="9" width="2" height="6" fill="#292929" data-color="8" data-palette="9"/>
<rect x="2" y="9" width="1" height="5" fill="#adada5" data-color="7" data-palette="9"/>
<rect x="0" y="24" width="2" height="1" fill="#adada5" data-color="7" data-palette="9"/>
<rect x="0" y="25" width="2" height="6" fill="#292929" data-color="8" data-palette="9"/>
<rect x="2" y="25" width="1" height="5" fill="#adada5" data-color="7" data-palette="9"/>
<rect x="0" y="40" width="2" height="1" fill="#adada5" data-color="7" data-palette="9"/>
<rect x="0" y="41" width="2" height="6" fill="#292929" data-color="8" data-palette="9"/>
<rect x="2" y="41" width="1" height="5" fill="#adada5" data-color="7" data-palette="9"/>
<rect x="0" y="56" width="2" height="1" fill="#adada5" data-color="7" data-palette="9"/>
<rect x="0" y="57" width="2" height="6" fill="#292929" data-color="8" data-palette="9"/>
<rect x="2" y="57" width="1" height="5" fill="#adada5" data-color="7" data-palette="9"/>
<rect x="0" y="72" width="2" height="1" fill="#adada5" data-color="7" data-palette="9"/>
<rect x="0" y="73" width="2" height="6" fill="#292929" data-color="8" data-palette="9"/>
<rect x="2" y="73" width="1" height="5" fill="#adada5" data-color="7" data-palette="9"/>
<rect x="0" y="88" width="2" height="1" fill="#adada5" data-color="7" data-palette="9"/>
<rect x="0" y="89" width="2" height="6" fill="#292929" data-color="8" data-palette="9"/>
<rect x="2" y="89" width="1" height="7" fill="#adada5" data-color="7" data-palette="9"/>
<!-- The light groove round the chip window's frame, its bottom corners cut at 45 degrees, two feet stepping down along its bottom -->
<path d="M4 -1 L85 -1 L85 89.5 L82.5 92 L6.5 92 L4 89.5 Z M5 -1 L83 -1 L83 89 L82 90 L6 90 L5 89 Z" fill-rule="evenodd" fill="#adada5" data-color="7" data-palette="9"/>
<rect x="11" y="90" width="2" height="1" fill="#cecece" data-color="6" data-palette="9"/>
<rect x="11" y="91" width="3" height="2" fill="#adada5" data-color="7" data-palette="9"/>
<rect x="75" y="90" width="2" height="1" fill="#cecece" data-color="6" data-palette="9"/>
<rect x="75" y="91" width="3" height="2" fill="#adada5" data-color="7" data-palette="9"/>
<!-- The chip window's frame: a light bevel, its corners rounded as the pixels step round them -->
<path d="M6 8.2 A2.2 2.2 0 0 1 8.2 6 L79.8 6 A2.2 2.2 0 0 1 82 8.2 L82 86.8 A2.2 2.2 0 0 1 79.8 89 L8.2 89 A2.2 2.2 0 0 1 6 86.8 Z" fill-rule="evenodd" fill="#adada5" data-color="7" data-palette="9"/>
<!-- The chip window -->
<path d="M7 8.8 A1.8 1.8 0 0 1 8.8 7 L79.2 7 A1.8 1.8 0 0 1 81 8.8 L81 86.2 A1.8 1.8 0 0 1 79.2 88 L8.8 88 A1.8 1.8 0 0 1 7 86.2 Z" fill-rule="evenodd" fill="#292929" data-color="8" data-palette="9"/>
<!-- The glare: hugging the window's top left corner, tapering to a point along the top and down the side -->
<path d="M16.5 8 H10.5 A2.5 2.5 0 0 0 8 10.5 V22.5 Q12 9.5 16.5 8 Z" fill-rule="evenodd" fill="#524a5a" data-color="10" data-palette="9"/>
<!-- Its lit edge: a darker band along the outside of the corner, a lighter one in it, lightest in the corner -->
<path d="M12.8 8 H10.5 A2.5 2.5 0 0 0 8 10.5 V17 L9 15.6 V10.5 A1.5 1.5 0 0 1 10.5 9 H11.6 Z" fill-rule="evenodd" fill="#4a637b" data-color="5" data-palette="9"/>
<path d="M11.6 8 H10.5 A2.5 2.5 0 0 0 8 10.5 V14.2 L9 13 V10.5 A1.5 1.5 0 0 1 10.5 9 H10.9 Z" fill-rule="evenodd" fill="#6b73ad" data-color="4" data-palette="9"/>
<path d="M10.4 8 A2.5 2.5 0 0 0 8 10.5 V11.4 L8.8 10.6 A1.6 1.6 0 0 1 10.4 8.8 Z" fill-rule="evenodd" fill="#9cadbd" data-color="3" data-palette="9"/>
<!-- The glints down the chip window's sides, lighter toward their middles -->
<rect x="8" y="32" width="1" height="40" rx="0.5" fill="#524a5a" data-color="10" data-palette="9"/>
<rect x="8" y="40" width="1" height="24" rx="0.5" fill="#4a637b" data-color="5" data-palette="9"/>
<rect x="8" y="48" width="1" height="8" rx="0.5" fill="#6b73ad" data-color="4" data-palette="9"/>
<rect x="8" y="50" width="1" height="3" rx="0.5" fill="#9cadbd" data-color="3" data-palette="9"/>
<rect x="79" y="32" width="1" height="40" rx="0.5" fill="#524a5a" data-color="10" data-palette="9"/>
<rect x="79" y="40" width="1" height="24" rx="0.5" fill="#4a637b" data-color="5" data-palette="9"/>
<rect x="79" y="48" width="1" height="8" rx="0.5" fill="#6b73ad" data-color="4" data-palette="9"/>
<rect x="79" y="50" width="1" height="3" rx="0.5" fill="#9cadbd" data-color="3" data-palette="9"/>
<!-- The glare in the bottom corners, lit nearest the corner, the right one running on up into the glint -->
<path d="M8 79.6 V84.5 A2.5 2.5 0 0 0 10.5 87 H12.6 L10.5 86 A1.5 1.5 0 0 1 9 84.5 V81 Z" fill-rule="evenodd" fill="#524a5a" data-color="10" data-palette="9"/>
<path d="M8 82.6 V84.5 A2.5 2.5 0 0 0 10.5 87 H11.2 L10.5 86 A1.5 1.5 0 0 1 9 84.5 V83.2 Z" fill-rule="evenodd" fill="#4a637b" data-color="5" data-palette="9"/>
<path d="M8 84 V84.5 A2.5 2.5 0 0 0 9.4 86.7 L9.6 85.9 A1.5 1.5 0 0 1 9 84.5 Z" fill-rule="evenodd" fill="#6b73ad" data-color="4" data-palette="9"/>
<path d="M80 71.6 V84.5 A2.5 2.5 0 0 1 77.5 87 H75.4 L77.5 86 A1.5 1.5 0 0 0 79 84.5 V73 Z" fill-rule="evenodd" fill="#524a5a" data-color="10" data-palette="9"/>
<path d="M80 82.6 V84.5 A2.5 2.5 0 0 1 77.5 87 H76.8 L77.5 86 A1.5 1.5 0 0 0 79 84.5 V83.2 Z" fill-rule="evenodd" fill="#4a637b" data-color="5" data-palette="9"/>
<path d="M80 84 V84.5 A2.5 2.5 0 0 1 78.6 86.7 L78.4 85.9 A1.5 1.5 0 0 0 79 84.5 Z" fill-rule="evenodd" fill="#6b73ad" data-color="4" data-palette="9"/>
<!-- The panel -->
<rect x="0" y="100" width="88" height="54" fill="#f7ffff" data-color="1" data-palette="9"/>
<rect x="0" y="100" width="4" height="1" fill="#9cadbd" data-color="3" data-palette="9"/>
<!-- Its outline, its top left corner cut at 45 degrees -->
<path d="M4 154 L4 98.5 L6.5 96 L64 96 L68 100 L88 100 L88 154 Z" fill-rule="evenodd" fill="#6b73ad" data-color="4" data-palette="9"/>
<!-- A light shadow outside the step -->
<path d="M64 96 L65.351 96 A0.6 0.6 0 0 1 65.776 96.176 L69.6 100 L68.249 100 A0.6 0.6 0 0 1 67.824 99.824 Z" fill-rule="evenodd" fill="#adada5" data-color="7" data-palette="9"/>
<!-- A light edge along its top and its left, shaded inside the step -->
<path d="M5 154 L5 98.9 L6.9 97 L63.4 97 L67.4 101 L88 101 L88 154 Z" fill-rule="evenodd" fill="#f7ffff" data-color="1" data-palette="9"/>
<path d="M62.4 97 L63.234 97 A0.4 0.4 0 0 1 63.517 97.117 L67.4 101 L66.566 101 A0.4 0.4 0 0 1 66.283 100.883 Z" fill-rule="evenodd" fill="#9cadbd" data-color="3" data-palette="9"/>
<!-- The light gray inside -->
<path d="M6 154 L6 99.3 L7.3 98 L62.4 98 L66.4 102 L88 102 L88 154 Z" fill-rule="evenodd" fill="#e7e7ef" data-color="2" data-palette="9"/>
<!-- The groove down the left side, two notches beside it -->
<rect x="4" y="102" width="1" height="51.4" fill="#9cadbd" data-color="3" data-palette="9"/>
<rect x="0" y="134" width="4" height="1" fill="#9cadbd" data-color="3" data-palette="9"/>
<rect x="0" y="142" width="4" height="1" fill="#9cadbd" data-color="3" data-palette="9"/>
<!-- The bottom bar -->
<rect x="0" y="154" width="120" height="6" fill="#6b73ad" data-color="4" data-palette="9"/>
<polygon points="0,156 114.5,156 117.5,159 0,159" fill="#9cadbd" data-color="3" data-palette="9"/>
<rect x="19" y="156" width="1" height="3" fill="#6b73ad" data-color="4" data-palette="9"/>
<rect x="27" y="156" width="1" height="3" fill="#6b73ad" data-color="4" data-palette="9"/>
<rect x="91" y="156" width="1" height="3" fill="#6b73ad" data-color="4" data-palette="9"/>
<rect x="99" y="156" width="1" height="3" fill="#6b73ad" data-color="4" data-palette="9"/>
<!-- Its left end: the panel down to the slant -->
<polygon points="0,153 4,153 0,157" fill="#f7ffff" data-color="1" data-palette="9"/>
<!-- The groove bending 45 degrees into the bar's slanted end, lighter -->
<polygon points="4,152.6 5,153 0,158 -1.4,158" fill="#e7e7ef" data-color="2" data-palette="9"/>
<!-- The panel round the column's bottom and the OK button -->
<rect x="88" y="102" width="26" height="52" fill="#e7e7ef" data-color="2" data-palette="9"/>
<!-- The right frame: two dark lines, light between, two notches across it, running down to where it meets the bottom bar at 45 degrees -->
<polygon points="114,100 120,100 120,160 114,154" fill="#6b73ad" data-color="4" data-palette="9"/>
<polygon points="115,100 119,100 119,157.5 115,153.5" fill="#9cadbd" data-color="3" data-palette="9"/>
<rect x="114" y="134" width="6" height="1" fill="#6b73ad" data-color="4" data-palette="9"/>
<rect x="114" y="142" width="6" height="1" fill="#6b73ad" data-color="4" data-palette="9"/>
<!-- The bottom right corner: the outer line cut at 45 degrees, the corner past it dark; where the bottom bar and the right frame meet, a light mitre from the inner corner, where it starts as a point, two pixels wide to the cut -->
<polygon points="120,156.5 120,157.5 117.5,160 116.5,160" fill="#6b73ad" data-color="4" data-palette="9"/>
<polygon points="120,157.5 120,160 117.5,160" fill="#292929" data-color="8" data-palette="9"/>
<polygon points="114,154 116.25,154.75 119,157.5 117.5,159 114.75,156.25" fill="#e7e7ef" data-color="2" data-palette="9"/>
<!-- The dark corner left of the holder, a light edge beside it -->
<rect x="89" y="0" width="1" height="3" fill="#adada5" data-color="7" data-palette="9"/>
<rect x="90" y="0" width="6" height="8" fill="#292929" data-color="8" data-palette="9"/>
<!-- The housing's outline, two pixels wide down its left, lit above -->
<path d="M87 4.5 A0.5 0.5 0 0 1 87.5 4 L87.5 4 A0.5 0.5 0 0 1 88 4.5 L88 7 L87 7 Z" fill-rule="evenodd" fill="#adada5" data-color="7" data-palette="9"/>
<rect x="87" y="7" width="1" height="94" fill="#6b73ad" data-color="4" data-palette="9"/>
<!-- The column's shadow on the panel: the housing's own shape a little lower, under it -->
<path d="M88 12.75 A16 16 0 0 1 120 12.75 V105.25 A6 6 0 0 1 114 111.25 H94 A6 6 0 0 1 88 105.25 Z" fill-rule="evenodd" fill="#9cadbd" data-color="3" data-palette="9"/>
<!-- The housing: its outline, round over the orb, flowing down into the column's sides, its bottom corners rounded from where the cells above end -->
<path d="M88 11.5 A16 16 0 0 1 120 11.5 V104 A6 6 0 0 1 114 110 H94 A6 6 0 0 1 88 104 Z" fill-rule="evenodd" fill="#6b73ad" data-color="4" data-palette="9"/>
<!-- Its lighter line -->
<path d="M89 11.5 A15 15 0 0 1 119 11.5 V104 A5 5 0 0 1 114 109 H94 A5 5 0 0 1 89 104 Z" fill-rule="evenodd" fill="#9cadbd" data-color="3" data-palette="9"/>
<!-- Its white band -->
<path d="M90 11.5 A14 14 0 0 1 118 11.5 V104 A4 4 0 0 1 114 108 H94 A4 4 0 0 1 90 104 Z" fill-rule="evenodd" fill="#f7ffff" data-color="1" data-palette="9"/>
<!-- The dark gray inside, its shoulders under the orb rounded, its bottom corners round the housing's centers -->
<path d="M92 21 A3 3 0 0 1 95 18 H113 A3 3 0 0 1 116 21 V104 A2 2 0 0 1 114 106 H94 A2 2 0 0 1 92 104 Z" fill-rule="evenodd" fill="#4a637b" data-color="5" data-palette="9"/>
<path d="M95 96 H113 V104 A1 1 0 0 1 112 105 H96 A1 1 0 0 1 95 104 Z" fill-rule="evenodd" fill="#292929" data-color="8" data-palette="9"/>
<!-- The orb's socket, as wide as the art's, evenly lit: its blue-gray edge -->
<circle cx="104" cy="11.5" r="12" fill="#6b73ad" data-color="4" data-palette="9"/>
<!-- The inner gray ring, unbroken -->
<circle cx="104" cy="11.5" r="11" fill="#4a637b" data-color="5" data-palette="9"/>
<!-- The reflection along the inner ring's bottom, inside its edges: a small wedge pointing up, blue-gray flanks fanning out and down, a light core brightest at its base -->
<path d="M102.85 20.888 A0.5 0.5 0 0 1 103.24 20.7 L104.76 20.7 A0.5 0.5 0 0 1 105.15 20.888 L105.81 21.713 A0.3 0.3 0 0 1 105.576 22.2 L102.424 22.2 A0.3 0.3 0 0 1 102.19 21.713 Z" fill-rule="evenodd" fill="#6b73ad" data-color="4" data-palette="9"/>
<path d="M103.299 20.951 A0.4 0.4 0 0 1 103.671 20.7 L104.329 20.7 A0.4 0.4 0 0 1 104.701 20.951 L105.09 21.926 A0.2 0.2 0 0 1 104.905 22.2 L103.095 22.2 A0.2 0.2 0 0 1 102.91 21.926 Z" fill-rule="evenodd" fill="#9cadbd" data-color="3" data-palette="9"/>
<path d="M103.489 21.621 A0.4 0.4 0 0 1 103.847 21.4 L104.153 21.4 A0.4 0.4 0 0 1 104.511 21.621 L104.655 21.911 A0.2 0.2 0 0 1 104.476 22.2 L103.524 22.2 A0.2 0.2 0 0 1 103.345 21.911 Z" fill-rule="evenodd" fill="#e7e7ef" data-color="2" data-palette="9"/>
<!-- The dark socket's two tabs, at 9 and 3 o'clock, reaching out through the gray ring to its edge -->
<path d="M93 11.5 A1.5 1.5 0 0 1 94.5 10 L113.5 10 A1.5 1.5 0 0 1 115 11.5 L115 11.5 A1.5 1.5 0 0 1 113.5 13 L94.5 13 A1.5 1.5 0 0 1 93 11.5 Z" fill-rule="evenodd" fill="#292929" data-color="8" data-palette="9"/>
<!-- The dark socket -->
<circle cx="104" cy="11.5" r="9" fill="#292929" data-color="8" data-palette="9"/>
<!-- The black line across the top of the stack's cells, over the housing's inside -->
<rect x="95" y="23" width="18" height="3" fill="#292929" data-color="8" data-palette="9"/>
<!-- The right frame's inner line running on from the housing's corner -->
<rect x="114" y="109.4" width="1" height="26" fill="#6b73ad" data-color="4" data-palette="9"/>
<!-- The OK button: its outline, its corners rounded -->
<path d="M89 116.5 A2.5 2.5 0 0 1 91.5 114 L109.5 114 A2.5 2.5 0 0 1 112 116.5 L112 131.5 A2.5 2.5 0 0 1 109.5 134 L91.5 134 A2.5 2.5 0 0 1 89 131.5 Z" fill-rule="evenodd" fill="#292929" data-color="8" data-palette="9"/>
<!-- Its shade along the right and the bottom -->
<path d="M90 116.5 A1.5 1.5 0 0 1 91.5 115 L109.5 115 A1.5 1.5 0 0 1 111 116.5 L111 131.5 A1.5 1.5 0 0 1 109.5 133 L91.5 133 A1.5 1.5 0 0 1 90 131.5 Z" fill-rule="evenodd" fill="#a5314a" data-color="15" data-palette="9"/>
<!-- Its light along the top and the left -->
<path d="M90 116.5 A1.5 1.5 0 0 1 91.5 115 L110.6 115 L108.6 117 L92 117 L92 131 L90 132.6 Z" fill-rule="evenodd" fill="#ffad29" data-color="12" data-palette="9"/>
<!-- Brightest in the top left corner -->
<path d="M90 116.1 A1.1 1.1 0 0 1 91.1 115 L92.2 115 L92.2 116.4 A0.8 0.8 0 0 1 91.4 117.2 L90 117.2 Z" fill-rule="evenodd" fill="#fff729" data-color="11" data-palette="9"/>
<!-- A shade halfway down the left, and the outline thicker halfway down the right -->
<path d="M90 122.5 A0.5 0.5 0 0 1 90.5 122 L90.5 122 A0.5 0.5 0 0 1 91 122.5 L91 125.5 A0.5 0.5 0 0 1 90.5 126 L90.5 126 A0.5 0.5 0 0 1 90 125.5 Z" fill-rule="evenodd" fill="#a5314a" data-color="15" data-palette="9"/>
<path d="M110 122.5 A0.5 0.5 0 0 1 110.5 122 L110.7 122 A0.5 0.5 0 0 1 111.2 122.5 L111.2 125.5 A0.5 0.5 0 0 1 110.7 126 L110.5 126 A0.5 0.5 0 0 1 110 125.5 Z" fill-rule="evenodd" fill="#292929" data-color="8" data-palette="9"/>
<!-- The face -->
<rect x="92" y="117" width="17" height="14" fill="#ff3121" data-color="14" data-palette="9"/>
<!-- The words, in white -->
<text data-words="window.ok" data-box="93 119 16 10" fill="#f7ffff" data-color="1" data-palette="9" x="93" y="129" font-size="13.333" textLength="16">OK</text>
</svg>
