<path d="M4 154 L4 99.5 A3.5 3.5 0 0 1 7.5 96 L63.586 96 A1 1 0 0 1 64.293 96.293 L67.707 99.707 A1 1 0 0 0 68.414 100 L88 100 L88 154 Z" fill-rule="evenodd" fill="#6b73ad" data-color="4" data-palette="9"/>
