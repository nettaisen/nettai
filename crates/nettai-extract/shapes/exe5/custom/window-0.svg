<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1280" viewBox="0 0 120 160">
<!-- EXE5's custom window's frame (every cell the screen doesn't lay something in), drawn as one object as EXE6's: a gray frame with dark notches down its left edge, a light groove round the chip window's frame, the glossy chip window round (radius 3, its bevel 4), the panel under it (its outline cut 45 degrees at its top left and its step, a light edge inside, each cut parallel), the housing round the orb as EXE6's, a wide right frame, the bar, the bottom corners as the art draws them, OK. -->
