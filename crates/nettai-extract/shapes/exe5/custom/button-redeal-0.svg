<svg xmlns="http://www.w3.org/2000/svg" width="256" height="192" viewBox="0 0 32 24">
<!-- The SHUFFLE button (two slots wide), its first look: a yellow light, an orange face, a dark orange shade, its words dark: a dark outline with rounded corners, lit along its top and left, shaded along its right and bottom, two slots cut in its top edge and two tabs standing on its bottom edge; its words drawn as text. -->
<!-- The window round it -->
<rect x="0" y="0" width="32" height="24" fill="#e7e7ef" data-color="2"/>
<!-- The outline, its corners rounded -->
<path d="M2 4 A2 2 0 0 1 4 2 L28 2 A2 2 0 0 1 30 4 L30 20 A2 2 0 0 1 28 22 L4 22 A2 2 0 0 1 2 20 Z" fill-rule="evenodd" fill="#292929" data-color="8"/>
<!-- The light along the top and the left -->
<path d="M3 4 A1 1 0 0 1 4 3 L29 3 L28 4 L4 4 L4 20 L3 21 Z" fill-rule="evenodd" fill="#fff729" data-color="11"/>
<!-- The shade along the right and the bottom -->
<path d="M28 4 L29 3 L29 20 A1 1 0 0 1 28 21 L3 21 L4 20 L28 20 Z" fill-rule="evenodd" fill="#ce6339" data-color="13"/>
<!-- The face -->
<rect x="4" y="4" width="24" height="16" fill="#ffad29" data-color="12"/>
<!-- A slot cut in the top edge: its far walls lit, its near wall shaded -->
<path d="M7 3 L12 3 L12 5 L12 6 L11 6 L8 6 L7 6 L7 5 Z" fill-rule="evenodd" fill="#fff729" data-color="11"/>
<path d="M7 3 L8.2 3 L8.2 6 L7.6 6 L7 6 L7 5.4 Z" fill-rule="evenodd" fill="#ce6339" data-color="13"/>
<path d="M8 3 L11 3 L11 4.3 L11 5 L10.3 5 L8.7 5 L8 5 L8 4.3 Z" fill-rule="evenodd" fill="#ffad29" data-color="12"/>
<rect x="7" y="3" width="5" height="1" fill="#ffad29" data-color="12"/>
<!-- A tab standing on the bottom edge: its outline, its face -->
<path d="M7 19 L7 18 L8 18 L11 18 L12 18 L12 19 L12 20.2 L7 20.2 Z" fill-rule="evenodd" fill="#ce6339" data-color="13"/>
<path d="M8 19.6 L8 19 L8.6 19 L10.4 19 L11 19 L11 19.6 L11 21 L8 21 Z" fill-rule="evenodd" fill="#ffad29" data-color="12"/>
<rect x="7" y="20" width="5" height="1" fill="#ffad29" data-color="12"/>
<path d="M20 3 L25 3 L25 5 L25 6 L24 6 L21 6 L20 6 L20 5 Z" fill-rule="evenodd" fill="#fff729" data-color="11"/>
<path d="M20 3 L21.2 3 L21.2 6 L20.6 6 L20 6 L20 5.4 Z" fill-rule="evenodd" fill="#ce6339" data-color="13"/>
<path d="M21 3 L24 3 L24 4.3 L24 5 L23.3 5 L21.7 5 L21 5 L21 4.3 Z" fill-rule="evenodd" fill="#ffad29" data-color="12"/>
<rect x="20" y="3" width="5" height="1" fill="#ffad29" data-color="12"/>
<path d="M20 19 L20 18 L21 18 L24 18 L25 18 L25 19 L25 20.2 L20 20.2 Z" fill-rule="evenodd" fill="#ce6339" data-color="13"/>
<path d="M21 19.6 L21 19 L21.6 19 L23.4 19 L24 19 L24 19.6 L24 21 L21 21 Z" fill-rule="evenodd" fill="#ffad29" data-color="12"/>
<rect x="20" y="20" width="5" height="1" fill="#ffad29" data-color="12"/>
<!-- The words -->
<text data-words="window.shuffle" data-box="4 8 23 8" fill="#292929" data-color="8" x="4" y="16" font-size="10.667" textLength="23">SHUFFLE</text>
</svg>
