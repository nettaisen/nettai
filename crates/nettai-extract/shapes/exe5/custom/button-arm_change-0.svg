<svg xmlns="http://www.w3.org/2000/svg" width="256" height="192" viewBox="0 0 32 24">
<!-- The arm change button (two slots wide), its first look: lit orange, a red face; the square sunk, dark red above it, orange under it: a dark outline, its corners cut, ARM down its left (drawn as text). -->
<!-- The window round it -->
<rect x="0" y="0" width="32" height="24" fill="#e7e7ef" data-color="2"/>
<!-- The plate's outline, a pixel wide, its corners cut 45 degrees (legs 2.5, as the art steps them) -->
<path d="M1 4.5 L3.5 2 L28.5 2 L31 4.5 L31 19.5 L28.5 22 L3.5 22 L1 19.5 Z" fill="#292929" data-color="8"/>
<!-- The face, cut parallel; lit along its top and its left a pixel wide (its right and bottom the face's own color, as the art) -->
<path d="M2 4.914 L3.914 3 L28.086 3 L30 4.914 L30 19.086 L28.086 21 L3.914 21 L2 19.086 Z" fill="#ff3121" data-color="14"/>
<path d="M2 4.914 L3.914 3 L28.086 3 L29.086 4 L3 4 L3 19.086 L2 18.086 Z" fill="#ffad29" data-color="12"/>
<!-- The square the held chip's icon is drawn in: sunk, its edges darker along its top and left, lighter along its right and bottom, each edge stopping square so its corners are the face's color (as the art) -->
<rect x="14" y="4" width="14" height="1" fill="#a5314a" data-color="15"/>
<rect x="13" y="5" width="1" height="14" fill="#a5314a" data-color="15"/>
<rect x="28" y="5" width="1" height="14" fill="#ffad29" data-color="12"/>
<rect x="14" y="19" width="14" height="1" fill="#ffad29" data-color="12"/>
<rect x="14" y="5" width="14" height="14" fill="#292929" data-color="8"/>
<!-- The words, a letter a line -->
<text data-words="window.arm" data-box="4 4 8 16" fill="#292929" data-color="8" x="4" y="20" font-size="21.333" textLength="8">ARM</text>
</svg>
