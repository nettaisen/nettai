<svg xmlns="http://www.w3.org/2000/svg" width="256" height="192" viewBox="0 0 32 24">
<!-- The arm change button (two slots wide), its first look: lit orange, a red face; the square sunk, dark red above it, orange under it: a dark outline with rounded corners, ARM down its left (drawn as text). -->
<!-- The window round it -->
<rect x="0" y="0" width="32" height="24" fill="#e7e7ef" data-color="2"/>
<!-- The plate's outline -->
<path d="M1 4.5 A2.5 2.5 0 0 1 3.5 2 L28.5 2 A2.5 2.5 0 0 1 31 4.5 L31 19.5 A2.5 2.5 0 0 1 28.5 22 L3.5 22 A2.5 2.5 0 0 1 1 19.5 Z" fill-rule="evenodd" fill="#292929" data-color="8"/>
<!-- Its shade along the right and the bottom -->
<path d="M2 4.5 A1.5 1.5 0 0 1 3.5 3 L28.5 3 A1.5 1.5 0 0 1 30 4.5 L30 19.5 A1.5 1.5 0 0 1 28.5 21 L3.5 21 A1.5 1.5 0 0 1 2 19.5 Z" fill-rule="evenodd" fill="#ff3121" data-color="14"/>
<!-- Its light along the top and the left -->
<path d="M2 4.5 A1.5 1.5 0 0 1 3.5 3 L30 3 L30 4 L3 4 L3 21 L2 21 Z" fill-rule="evenodd" fill="#ffad29" data-color="12"/>
<!-- The face -->
<rect x="3" y="4" width="27" height="17" fill="#ff3121" data-color="14"/>
<!-- The square the held chip's icon is drawn in: sunk, its edges darker above and lighter below -->
<rect x="13" y="4" width="16" height="16" fill="#a5314a" data-color="15"/>
<polygon points="29,4 29,20 13,20 14,19 28,19 28,5" fill="#ffad29" data-color="12"/>
<rect x="14" y="5" width="14" height="14" fill="#292929" data-color="8"/>
<!-- The words, a letter a line -->
<text data-words="window.arm" data-box="4 4 8 16" fill="#292929" data-color="8" x="4" y="20" font-size="21.333" textLength="8">ARM</text>
</svg>
