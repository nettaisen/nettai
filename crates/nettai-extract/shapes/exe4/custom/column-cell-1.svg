<svg xmlns="http://www.w3.org/2000/svg" width="64" height="128" viewBox="0 0 8 16">
<!-- The picked column's cell (filled): its side bands, the dark inside past them, a dark notch cut into the band at its middle, a light tab in it. -->
<!-- The cell's inside band -->
<rect x="0" y="0" width="8" height="16" fill="#4a637b" data-color="5"/>
<!-- Its outer line -->
<rect x="0" y="0" width="1" height="16" fill="#7b9cde" data-color="3"/>
<rect x="1" y="0" width="2" height="16" fill="#cee7ff" data-color="2"/>
<!-- The dark inside -->
<rect x="7" y="0" width="1" height="16" fill="#292929" data-color="9"/>
<!-- The notch -->
<path d="M3 6.6 A0.6 0.6 0 0 1 3.6 6 L8 6 L8 10 L3.6 10 A0.6 0.6 0 0 1 3 9.4 Z" fill-rule="evenodd" fill="#292929" data-color="9"/>
<!-- The light tab in it -->
<path d="M5 7.5 A0.5 0.5 0 0 1 5.5 7 L6.5 7 A0.5 0.5 0 0 1 7 7.5 L7 8.5 A0.5 0.5 0 0 1 6.5 9 L5.5 9 A0.5 0.5 0 0 1 5 8.5 Z" fill-rule="evenodd" fill="#7b9cde" data-color="3"/>
</svg>
