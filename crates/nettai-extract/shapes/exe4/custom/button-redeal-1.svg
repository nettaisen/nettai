<svg xmlns="http://www.w3.org/2000/svg" width="256" height="192" viewBox="0 0 32 24">
<!-- The SHUFFLE button (two slots wide), unavailable: a white light, a light gray face, a dark gray shade, its words white: a dark outline with rounded corners, lit along its top and left, shaded along its right and bottom, two slots cut in its top edge and two tabs standing on its bottom edge; its words drawn as text. -->
<!-- The window round it -->
<rect x="0" y="0" width="32" height="24" fill="#f7ffff" data-color="1"/>
<!-- The outline -->
<path d="M2 2.6 A0.6 0.6 0 0 1 2.6 2 L29.4 2 A0.6 0.6 0 0 1 30 2.6 L30 21.4 A0.6 0.6 0 0 1 29.4 22 L2.6 22 A0.6 0.6 0 0 1 2 21.4 Z" fill-rule="evenodd" fill="#292929" data-color="9"/>
<!-- The light along the top and the left -->
<path d="M3 4 A1 1 0 0 1 4 3 L29 3 L28 4 L4 4 L4 20 L3 21 Z" fill-rule="evenodd" fill="#f7ffff" data-color="1"/>
<!-- The shade along the right and the bottom -->
<path d="M28 4 L29 3 L29 20 A1 1 0 0 1 28 21 L3 21 L4 20 L28 20 Z" fill-rule="evenodd" fill="#4a637b" data-color="5"/>
<!-- The face -->
<rect x="4" y="4" width="24" height="16" fill="#dedee7" data-color="8"/>
<!-- A slot cut in the top edge: its far walls lit, its near wall shaded -->
<path d="M7 3 L12 3 L12 5 A1 1 0 0 1 11 6 L8 6 A1 1 0 0 1 7 5 Z" fill-rule="evenodd" fill="#f7ffff" data-color="1"/>
<path d="M7 3 L8.2 3 L8.2 6 L7.6 6 A0.6 0.6 0 0 1 7 5.4 Z" fill-rule="evenodd" fill="#4a637b" data-color="5"/>
<path d="M8 3 L11 3 L11 4.3 A0.7 0.7 0 0 1 10.3 5 L8.7 5 A0.7 0.7 0 0 1 8 4.3 Z" fill-rule="evenodd" fill="#dedee7" data-color="8"/>
<rect x="7" y="3" width="5" height="1" fill="#dedee7" data-color="8"/>
<!-- A tab standing on the bottom edge: its outline, its face -->
<path d="M7 19 A1 1 0 0 1 8 18 L11 18 A1 1 0 0 1 12 19 L12 20.2 L7 20.2 Z" fill-rule="evenodd" fill="#4a637b" data-color="5"/>
<path d="M8 19.6 A0.6 0.6 0 0 1 8.6 19 L10.4 19 A0.6 0.6 0 0 1 11 19.6 L11 21 L8 21 Z" fill-rule="evenodd" fill="#dedee7" data-color="8"/>
<rect x="7" y="20" width="5" height="1" fill="#dedee7" data-color="8"/>
<path d="M20 3 L25 3 L25 5 A1 1 0 0 1 24 6 L21 6 A1 1 0 0 1 20 5 Z" fill-rule="evenodd" fill="#f7ffff" data-color="1"/>
<path d="M20 3 L21.2 3 L21.2 6 L20.6 6 A0.6 0.6 0 0 1 20 5.4 Z" fill-rule="evenodd" fill="#4a637b" data-color="5"/>
<path d="M21 3 L24 3 L24 4.3 A0.7 0.7 0 0 1 23.3 5 L21.7 5 A0.7 0.7 0 0 1 21 4.3 Z" fill-rule="evenodd" fill="#dedee7" data-color="8"/>
<rect x="20" y="3" width="5" height="1" fill="#dedee7" data-color="8"/>
<path d="M20 19 A1 1 0 0 1 21 18 L24 18 A1 1 0 0 1 25 19 L25 20.2 L20 20.2 Z" fill-rule="evenodd" fill="#4a637b" data-color="5"/>
<path d="M21 19.6 A0.6 0.6 0 0 1 21.6 19 L23.4 19 A0.6 0.6 0 0 1 24 19.6 L24 21 L21 21 Z" fill-rule="evenodd" fill="#dedee7" data-color="8"/>
<rect x="20" y="20" width="5" height="1" fill="#dedee7" data-color="8"/>
<!-- The words -->
<text data-words="window.shuffle" data-box="4 8 23 8" fill="#f7ffff" data-color="1" x="4" y="16" font-size="10.667" textLength="23">SHUFFLE</text>
</svg>
