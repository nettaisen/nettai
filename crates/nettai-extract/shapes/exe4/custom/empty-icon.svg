<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 16 16">
<!-- An empty slot's box (16x16), square as every box a chip's icon goes in: the gap round it, a frame, the dark inside. -->
<!-- The gap round the box -->
<rect x="0" y="0" width="16" height="16" fill="#7b9cde" data-color="3"/>
<!-- The box's frame -->
<rect x="1" y="1" width="14" height="14" fill="#4a637b" data-color="5"/>
<!-- The dark inside -->
<rect x="2" y="2" width="12" height="12" fill="#292929" data-color="9"/>
</svg>
