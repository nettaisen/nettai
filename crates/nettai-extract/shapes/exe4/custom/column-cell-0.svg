<rect x="0" y="0" width="1" height="16" fill="#7b9cde" data-color="3"/>
<rect x="1" y="0" width="2" height="16" fill="#cee7ff" data-color="2"/>
<rect x="7" y="0" width="1" height="16" fill="#292929" data-color="9"/>
<!-- The notch cut into the band at its middle, square -->
<rect x="3" y="6" width="5" height="4" fill="#292929" data-color="9"/>
</svg>
