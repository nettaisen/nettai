<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 16 16">
<!-- An element icon's frame (16x16), its symbol drawn over it as its picture: the dark ground, and a light ring a pixel wide in it with its corners rounded, its outer edge and its inner one round the same middle (the art steps the outer corner a pixel and shades the inner one half). -->
<!-- The dark ground round the ring -->
<rect x="0" y="0" width="16" height="16" fill="#292929" data-color="3"/>
<!-- The ring -->
<path d="M1 3.5 A2.5 2.5 0 0 1 3.5 1 L12.5 1 A2.5 2.5 0 0 1 15 3.5 L15 12.5 A2.5 2.5 0 0 1 12.5 15 L3.5 15 A2.5 2.5 0 0 1 1 12.5 Z" fill="#b5adad" data-color="2"/>
<!-- The dark ground in it, where the symbol goes -->
<path d="M2 3.5 A1.5 1.5 0 0 1 3.5 2 L12.5 2 A1.5 1.5 0 0 1 14 3.5 L14 12.5 A1.5 1.5 0 0 1 12.5 14 L3.5 14 A1.5 1.5 0 0 1 2 12.5 Z" fill="#292929" data-color="3"/>
</svg>
