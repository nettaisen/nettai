<!-- The ground, its cuts parallel to the outline's -->
<path d="M4 31.828 L4.828 31 L235.172 31 L236 31.828 L236 32.172 L235.172 33 L4.828 33 L4 32.172 Z" fill="#f7fff7" data-color="11"/>
