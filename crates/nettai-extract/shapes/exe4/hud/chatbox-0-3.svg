<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="512" viewBox="0 0 240 64">
<!-- The chatbox's box, the message box (open): a dark outline, its corners cut 45 degrees, a tab for the name on its top edge at the left, its right side slanting, a light band inside it, the ground the text is written on, each cut parallel to the outline's. -->
<!-- The tab for the name: its outline two pixels wide, its top left corner cut as the box's, its right side slanting 2:1 -->
<path d="M2 2.5 L3.5 1 L44 1 L52 5 L52 7 L2 7 Z" fill="#006bbd" data-color="13"/>
<!-- The outline, two pixels wide, its corners cut 45 degrees (as the art steps them) -->
<path d="M2 6.5 L3.5 5 L236.5 5 L238 6.5 L238 57.5 L236.5 59 L3.5 59 L2 57.5 Z" fill="#006bbd" data-color="13"/>
<!-- The band inside the tab: the outline two pixels in, its cuts parallel -->
<path d="M4 3.328 L4.328 3 L43.528 3 L53.528 8 L4 8 Z" fill="#94cee7" data-color="12"/>
<!-- The band, a pixel wide -->
<path d="M4 7.328 L4.328 7 L235.672 7 L236 7.328 L236 56.672 L235.672 57 L4.328 57 L4 56.672 Z" fill="#94cee7" data-color="12"/>
<!-- The ground -->
<path d="M5 8 L235 8 L235 56 L5 56 Z" fill="#f7fff7" data-color="11"/>
</svg>
