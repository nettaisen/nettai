<rect x="3" y="1" width="2" height="2" fill="#e7efff" data-color="5"/>
<rect x="2" y="3" width="4" height="4" fill="#00a500" data-color="11"/>
<rect x="3" y="4" width="2" height="2" fill="#00ff00" data-color="3"/>
</svg>
