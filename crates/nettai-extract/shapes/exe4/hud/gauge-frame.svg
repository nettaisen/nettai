<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="128" viewBox="0 0 144 16">
<!-- The custom gauge's frame (its word off, its fill's cells laid over its middle): a bar with its corners cut 45 degrees, a dark outline round a dark ground, each end closed off by a line with a nub pointing in, a light bracket round each end, its corners cut parallel, darker above. -->
<!-- The outline, its corners cut 45 degrees (legs 3.5) -->
<path d="M0 9.5 L3.5 6 L140.5 6 L144 9.5 L144 12.5 L140.5 16 L3.5 16 L0 12.5 Z" fill="#39526b" data-color="12"/>
<!-- The ground, a pixel in, its corners cut parallel -->
<path d="M1 9.914 L3.914 7 L140.086 7 L143 9.914 L143 12.086 L140.086 15 L3.914 15 L1 12.086 Z" fill="#292929" data-color="2"/>
<!-- Each end closed off by a line, a square nub pointing in -->
<path d="M6 7 L7 7 L7 15 L6 15 Z" fill="#39526b" data-color="12"/>
<path d="M4 10 L7 10 L7 12 L4 12 Z" fill="#39526b" data-color="12"/>
<!-- The light bracket round the end, a pixel wide, two pixels in, its corners cut parallel to the outline's; darker above -->
<path d="M6 8 L4.328 8 L2 10.328 L2 11.672 L4.328 14 L6 14 L6 13 L4.743 13 L3 11.257 L3 10.743 L4.743 9 L6 9 Z" fill="#7b9cde" data-color="7"/>
<path d="M6 8 L4.328 8 L2 10.328 L2 11 L3 11 L3 10.743 L4.743 9 L6 9 Z" fill="#6373c6" data-color="8"/>
<!-- The other end, mirrored -->
<path d="M138 7 L137 7 L137 15 L138 15 Z" fill="#39526b" data-color="12"/>
<path d="M140 10 L137 10 L137 12 L140 12 Z" fill="#39526b" data-color="12"/>
<!-- Its bracket -->
<path d="M138 8 L139.672 8 L142 10.328 L142 11.672 L139.672 14 L138 14 L138 13 L139.257 13 L141 11.257 L141 10.743 L139.257 9 L138 9 Z" fill="#7b9cde" data-color="7"/>
<path d="M138 8 L139.672 8 L142 10.328 L142 11 L141 11 L141 10.743 L139.257 9 L138 9 Z" fill="#6373c6" data-color="8"/>
</svg>
