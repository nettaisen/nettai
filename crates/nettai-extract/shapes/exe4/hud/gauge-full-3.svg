<rect x="0" y="7" width="8" height="1" fill="#39526b" data-color="12"/>
<rect x="4" y="1" width="4" height="4" fill="#00a500" data-color="11"/>
<rect x="5" y="2" width="2" height="2" fill="#b5ff6b" data-color="13"/>
<rect x="0" y="2" width="4" height="4" fill="#00a500" data-color="11"/>
<rect x="1" y="3" width="2" height="2" fill="#00ff00" data-color="3"/>
</svg>
