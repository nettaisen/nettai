<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 16 16">
<!-- The chatbox's key-wait arrow, frame 2 of 3 (2 pixels down: its bob): a capped shield pointing down, a dark green outline a pixel wide all round, the cap's band and the shield's face lit along their tops and left sides with a glint in the corner, its shadow down and to the right. -->
<defs>
<path id="outline" d="M3 0.8 A0.8 0.8 0 0 1 3.8 0 L12.2 0 A0.8 0.8 0 0 1 13 0.8 L13 8.793 A0.5 0.5 0 0 1 12.854 9.146 L9.264 12.736 A0.9 0.9 0 0 1 8.627 13 L7.373 13 A0.9 0.9 0 0 1 6.736 12.736 L3.146 9.146 A0.5 0.5 0 0 1 3 8.793 Z"/>
<clipPath id="face"><path d="M4 4.3 A0.3 0.3 0 0 1 4.3 4 L11.7 4 A0.3 0.3 0 0 1 12 4.3 L12 8.462 A0.3 0.3 0 0 1 11.912 8.674 L8.762 11.824 A0.6 0.6 0 0 1 8.337 12 L7.663 12 A0.6 0.6 0 0 1 7.238 11.824 L4.088 8.674 A0.3 0.3 0 0 1 4 8.462 Z"/></clipPath>
<clipPath id="cap"><path d="M4 1.3 A0.3 0.3 0 0 1 4.3 1 L11.7 1 A0.3 0.3 0 0 1 12 1.3 L12 2.8 A0.2 0.2 0 0 1 11.8 3 L4.2 3 A0.2 0.2 0 0 1 4 2.8 Z"/></clipPath>
</defs>
<g transform="translate(0 2)">
<!-- Its shadow: the arrow's shape a pixel right and a pixel down -->
<use href="#outline" x="1" data-color="12" fill="#4a637b"/>
<use href="#outline" y="1" data-color="12" fill="#4a637b"/>
<!-- The outline -->
<use href="#outline" data-color="5" fill="#21a521"/>
<!-- The cap's band and the shield's face: light, the face's own green over them a pixel right and down, so the light shows along their tops and left sides -->
<path d="M4 1.3 A0.3 0.3 0 0 1 4.3 1 L11.7 1 A0.3 0.3 0 0 1 12 1.3 L12 2.8 A0.2 0.2 0 0 1 11.8 3 L4.2 3 A0.2 0.2 0 0 1 4 2.8 Z" data-color="7" fill="#84ff63"/>
<g clip-path="url(#cap)"><path d="M4 1.3 A0.3 0.3 0 0 1 4.3 1 L11.7 1 A0.3 0.3 0 0 1 12 1.3 L12 2.8 A0.2 0.2 0 0 1 11.8 3 L4.2 3 A0.2 0.2 0 0 1 4 2.8 Z" transform="translate(1 1)" data-color="6" fill="#39ff00"/></g>
<path d="M4 4.3 A0.3 0.3 0 0 1 4.3 4 L11.7 4 A0.3 0.3 0 0 1 12 4.3 L12 8.462 A0.3 0.3 0 0 1 11.912 8.674 L8.762 11.824 A0.6 0.6 0 0 1 8.337 12 L7.663 12 A0.6 0.6 0 0 1 7.238 11.824 L4.088 8.674 A0.3 0.3 0 0 1 4 8.462 Z" data-color="7" fill="#84ff63"/>
<g clip-path="url(#face)"><path d="M4 4.3 A0.3 0.3 0 0 1 4.3 4 L11.7 4 A0.3 0.3 0 0 1 12 4.3 L12 8.462 A0.3 0.3 0 0 1 11.912 8.674 L8.762 11.824 A0.6 0.6 0 0 1 8.337 12 L7.663 12 A0.6 0.6 0 0 1 7.238 11.824 L4.088 8.674 A0.3 0.3 0 0 1 4 8.462 Z" transform="translate(1 1)" data-color="6" fill="#39ff00"/></g>
<!-- The glints in their top left corners -->
<circle cx="4.55" cy="1.55" r="0.55" data-color="8" fill="#f7f7f7"/>
<circle cx="4.55" cy="4.55" r="0.55" data-color="8" fill="#f7f7f7"/>
</g>
</svg>
