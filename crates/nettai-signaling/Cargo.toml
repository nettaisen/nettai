[package]
name = "nettai-signaling"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The signaling server's protocol and a client of it, on both targets: two players meet in a room and trade what their connections need"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-time = "1"

# Native: the server's WebSocket, on a thread of its own.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
# The WebSocket's TLS needs a crypto backend, which tungstenite doesn't pick:
# without one rustls panics at the first wss:// connection (the signaling
# thread ended at once, every time).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# The test server's room codes.
getrandom = { version = "0.3", optional = true }

# The web: the browser's WebSocket.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.126"
web-sys = { version = "0.3", features = ["CloseEvent", "MessageEvent", "WebSocket"] }

[features]
# `testing`: a signaling server in process, for tests (native).
testing = ["dep:getrandom"]
