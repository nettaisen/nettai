[package]
name = "nettai-editor"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Edits nettai match files (the arena, each side's ruleset, navi, folder, Crosses, patch cards, NaviCust and stats), checked live against the content, and plays them with nettai-frontend"

[dependencies]
nettai-battle.workspace = true
nettai-content = { path = "../nettai-content" }
nettai-content-api = { path = "../nettai-content-api" }
# The pack's pictures (chip icons and art), read through `pictures`, drawn
# as a frame draws them; the bundled font.
nettai-assets = { path = "../nettai-assets" }
nettai-render = { path = "../nettai-render" }
nettai-match = { path = "../nettai-match" }
# The window: iced (Cargo.lock pins the release), drawn in software (tiny-skia:
# no GPU backend to build); a canvas draws the NaviCust.
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "crisp", "web-colors", "thread-pool", "linux-theme-detection", "x11", "wayland", "canvas", "image-without-codecs"] }
# Open and Save As dialogs.
rfd = "0.15"
# --screenshot writes the window as a PNG.
png = "0.17"
toml = "0.8"

[dev-dependencies]
nettai-match = { path = "../nettai-match", features = ["testing"] }
