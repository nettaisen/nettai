[package]
name = "exe5-compat"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The original games' numbers for EXE5's content (content/exe5/compat), and what reads them: the codecs of EXE5's records and its recorded battles (traces), decoded into the engine's terms, and its saves' import (a save into a side, by the game's facts). The engine never depends on it."

[dependencies]
nettai-battle.workspace = true
nettai-content-api = { path = "../nettai-content-api" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
toml = "0.8"
# A save's import (src/import.rs): the side it gives, by its game's facts.
nettai-match = { path = "../nettai-match" }

[dev-dependencies]
# The engine's test content (a round's setup against content without EXE5's).
nettai-battle = { workspace = true, features = ["test-content"] }
# The games' content, for the import's tests.
nettai-match = { path = "../nettai-match", features = ["testing"] }

[features]
# Recorded battles (the chip lab's EXE5 traces): reading them and decoding them.
trace = ["dep:serde_json"]
