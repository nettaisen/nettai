[package]
name = "exe5-compat"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The original games' numbers for EXE5's content (content/exe5/compat), and what reads them: the codecs of EXE5's records and its recorded battles (traces), decoded into the engine's terms. The engine never depends on it."

[dependencies]
nettai-battle.workspace = true
nettai-content-api = { path = "../nettai-content-api" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
toml = "0.8"

[dev-dependencies]
# The engine's test content (a round's setup against content without EXE5's).
nettai-battle = { workspace = true, features = ["test-content"] }

[features]
# Recorded battles (the chip lab's EXE5 traces): reading them and decoding them.
trace = ["dep:serde_json"]
