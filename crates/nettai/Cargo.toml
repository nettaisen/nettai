[package]
name = "nettai"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The nettai app: the menus, the builds, netplay and the replays around a battle played through nettai-frontend, in a Slint window (the UI itself is nettai-ui)"

[dependencies]
# The UI: the Slint files compiled, a crate of its own so an edit here doesn't compile it again (docs/app.md §8).
nettai-ui = { path = "../nettai-ui" }
nettai-frontend = { path = "../nettai-frontend" }
nettai-battle = { path = "../nettai-battle" }
nettai-render = { path = "../nettai-render" }
nettai-content = { path = "../nettai-content" }
nettai-match = { path = "../nettai-match" }
nettai-content-api = { path = "../nettai-content-api" }
# The audio device (`Output`: the `playback` feature, cpal).
nettai-audio = { path = "../nettai-audio" }
# The window's types (the features are nettai-ui's).
slint = { version = "1.18", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "compat-1-2", "unstable-winit-030"] }
# Gamepads: SDL3's, behind one small API (the user's choice; Cargo.lock pins the revision).
gamepad-facade = { git = "https://github.com/tangobattle/gamepad-facade" }
# gamepad-facade says what goes wrong through `log`: it goes to the app's log file.
log = "0.4"
# The system's language, for the first one shown.
sys-locale = "0.3"
# The log's and a replay's times in the local time.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# The screenshot pass's pictures.
png = "0.17"
# A replay's video: its errors are worded here (`errors.rs`); the Replays screen runs the export.
nettai-video = { path = "../nettai-video" }
# Netplay's link: WebRTC through a room of the signaling server.
nettai-rtc = { path = "../nettai-rtc" }
# A build from a save: each game's own reader of its saves.
exe6-compat = { path = "../exe6-compat" }
exe5-compat = { path = "../exe5-compat" }
exe4-compat = { path = "../exe4-compat" }
# The builds' and the settings' files.
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# An invite's code, copied for the other player (the desktop's clipboard).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = { version = "3", default-features = false }
# A save to make a build of, chosen in the system's file dialog.
rfd = "0.15"
# The picture's texture, kept and written in place in the window's OpenGL.
glow = "0.16"

[dev-dependencies]
# The tests: a signaling server in process, the content of the repository.
nettai-rtc = { path = "../nettai-rtc", features = ["testing"] }
nettai-match = { path = "../nettai-match", features = ["testing"] }
