[package]
name = "nettai"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The nettai app: the menus, the builds, netplay and the replays around a battle played through nettai-frontend, in a Slint window (the UI itself is nettai-ui)"

[dependencies]
# The UI: the Slint files compiled, a crate of its own so an edit here doesn't compile it again (docs/app.md §14).
nettai-ui = { path = "../nettai-ui" }
nettai-frontend = { path = "../nettai-frontend" }
# The practice dummy's AI (its Action "Fights"), plugged into live play.
nettai-training = { path = "../nettai-training" }
nettai-battle = { path = "../nettai-battle" }
nettai-render = { path = "../nettai-render" }
nettai-content = { path = "../nettai-content" }
nettai-match = { path = "../nettai-match" }
nettai-content-api = { path = "../nettai-content-api" }
# The audio device (`Output`: the `playback` feature, cpal).
nettai-audio = { path = "../nettai-audio" }
# The window's types (the features are nettai-ui's).
slint = { version = "1.18", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "compat-1-2", "unstable-winit-030"] }
# Gamepads: SDL3's, behind one small API (the user's choice; Cargo.lock pins the revision).
gamepad-facade = { git = "https://github.com/tangobattle/gamepad-facade" }
# gamepad-facade says what goes wrong through `log`: it goes to the app's log file.
log = "0.4"
# The system's language, for the first one shown.
sys-locale = "0.3"
# The log's and a replay's times in the local time.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# The screenshot pass's pictures (the `tour` feature's).
png = { version = "0.17", optional = true }
# The showreel (the `tour` feature's `NETTAI_REEL`): the window's backend, built here and wrapped so that its clock
# is the reel's, a frame at a time. (Both are in the tree already, under slint, at this version.)
i-slint-core = { version = "=1.18.1", default-features = false, optional = true }
i-slint-backend-winit = { version = "=1.18.1", default-features = false, optional = true }
# A replay's video: its errors are worded here (`errors.rs`); the Replays screen runs the export.
nettai-video = { path = "../nettai-video" }
# A replay's file: what its head names (the Replays screen's list) and its writer (the screenshot pass's replays).
nettai-replay = { path = "../nettai-replay" }
# Netplay's link: WebRTC through a room of the signaling server.
nettai-rtc = { path = "../nettai-rtc" }
# A build from a save: each game's own reader of its saves.
exe6-compat = { path = "../exe6-compat" }
exe5-compat = { path = "../exe5-compat" }
exe4-compat = { path = "../exe4-compat" }
# The builds' and the settings' files.
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# Each game's pack, extracted from the player's Legacy Collection on start-up (`packs.rs`; docs/app.md §17).
nettai-extract = { path = "../nettai-extract" }

# An invite's code, copied for the other player (the desktop's clipboard).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = { version = "3", default-features = false }
# A save to make a build of, chosen in the system's file dialog.
rfd = "0.15"
# The picture's texture, kept and written in place in the window's OpenGL.
glow = "0.16"
# The Legacy Collection's install, found through Steam, and its ROMs read out of its archives (`bnlc.rs`, ported
# from Tango's, with the crates it uses).
steamlocate = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

# A terminate request's signals, taken back from SDL (`quit.rs`). (In the tree already.)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Keeping the app's time while a battle runs in a covered window (`awake.rs`): Foundation's process activity.
# (Both are in the tree already, for the window.)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo", "NSString"] }

[features]
# The screenshot pass, the motion probe and the showreel (docs/app.md §13: `NETTAI_TOUR`, `NETTAI_REEL`), with what
# they need: the pictures' encoder, the link library's signaling server in the process, which Play's second player
# meets the first through (`screens/play/tour.rs`), and the window's backend, whose clock the reel drives. A
# player's build has none of it: `cargo run -p nettai --features tour`. The tests compile the pass whatever the
# features (the same two dependencies are the tests' below), the reel only with it.
tour = ["dep:png", "nettai-rtc/testing", "dep:i-slint-core", "dep:i-slint-backend-winit"]

[build-dependencies]
# What the app is built from, for its About screen (build.rs: `cargo metadata`'s JSON).
serde_json = "1"

# The Windows program's icon (build.rs: `NETTAI_WINDOWS_ICON`, an .ico packaging/ makes).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
png = "0.17"
nettai-rtc = { path = "../nettai-rtc", features = ["testing"] }
# The tests: the content of the repository.
nettai-match = { path = "../nettai-match", features = ["testing"] }
# A short set and graphics with no pack, for a battle played to its end.
nettai-frontend = { path = "../nettai-frontend", features = ["testing"] }
# The extraction's tests: their own archives and packs, in folders of their own.
tempfile = "3"
