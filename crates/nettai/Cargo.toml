[package]
name = "nettai"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The nettai app: the menus, the builds, netplay and the replays around a battle played through nettai-frontend, in a Slint window (the UI itself is nettai-ui); built as a cdylib, the module of Android's APK and of the browser's page"

[dependencies]
# What the app asks of its system, the same on the desktop, in a browser and on a phone, a crate a concern: files
# and the app's folders, threads, and dialogs (and the clipboard). (The browser's page and the app's life are the
# app's own modules: `page.rs`, `lifecycle.rs`.)
nettai-files = { path = "../nettai-files" }
nettai-threads = { path = "../nettai-threads" }
nettai-dialogs = { path = "../nettai-dialogs" }
# Time: std's natively, the browser's `performance.now()` there (std's panics).
web-time = "1"
# Files over HTTP(S) (`http.rs`: the games' content, the dummy's network): reqwest, hyper and rustls natively (no
# provider of its own: ring's, given), the browser's fetch there; a body taken as it comes, for its progress.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# The UI: the Slint files compiled, a crate of its own so an edit here doesn't compile it again (docs/app.md §14).
nettai-ui = { path = "../nettai-ui" }
nettai-frontend = { path = "../nettai-frontend" }
# The practice dummy's AI (its Action "Fights"; the `ai` feature): the trained network's player, plugged into live
# play, and its chips' fingerprints made on threads of their own.
nettai-training = { path = "../nettai-training", features = ["live"], optional = true }
# The games' content indexes (`contents.rs`) and the AI network's (`screens/practice/weights.rs`), JSON.
serde_json = "1"
# The SHA-256 a downloaded network is checked by (`screens/practice/weights.rs`).
sha2 = { version = "0.10", optional = true }
nettai-battle = { path = "../nettai-battle" }
nettai-render = { path = "../nettai-render" }
nettai-content = { path = "../nettai-content" }
nettai-match = { path = "../nettai-match" }
nettai-content-api = { path = "../nettai-content-api" }
# The audio device (`Output`: the `playback` feature, cpal).
nettai-audio = { path = "../nettai-audio" }
# The window's types (the features are nettai-ui's).
slint = { version = "1.18", default-features = false, features = ["std", "backend-winit", "compat-1-2", "unstable-fontique-011"] }
# Slint's winit backend, whose window events the app hears before Slint does (`on_winit_window_event`, the
# window's own: `WinitWindowAccessor`), on every system: what `slint::winit_030` re-exports, used directly, as that
# module (Slint's `unstable-winit-030`) doesn't build for Android. The version slint is, exactly.
i-slint-backend-winit = { version = "=1.18.1", default-features = false }
# Gamepads, one pull-based API over each system's (SDL3 on the desktop, the browser's, GameController on iOS,
# Android's events). It says what goes wrong through `log`: it goes to the app's log file.
nettai-gamepad = { path = "../nettai-gamepad" }
# The libraries' warnings go to the app's log file through `log`.
log = "0.4"
# The system's language, for the first one shown.
sys-locale = "0.3"
# Text in capitals by the language's own rules (`I18n::upper`: a Turkish i is İ), from Unicode's data built in.
icu_casemap = "2"
icu_locale_core = "2"
# Lists by the language's own separator (`I18n::list`: "A, B, C", "A、B、C"), from CLDR's data built in.
icu_list = "2"
# The log's and a replay's times in the local time.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# The screenshot pass's pictures (the `tour` feature's).
png = { version = "0.17", optional = true }
# A replay's video: its errors are worded here (`errors.rs`); the Replays screen runs the export.
nettai-video = { path = "../nettai-video" }
# A replay's file: what its head names (the Replays screen's list) and its writer (the screenshot pass's replays).
nettai-replay = { path = "../nettai-replay" }
# Netplay's link: WebRTC through a room of the signaling server.
nettai-rtc = { path = "../nettai-rtc" }
# A build from a save: each game's own reader of its saves.
exe6-compat = { path = "../exe6-compat" }
exe5-compat = { path = "../exe5-compat" }
exe4-compat = { path = "../exe4-compat" }
# The builds' and the settings' files.
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# The Legacy Collection found (or a folder chosen), and each game's recipe, whose ROMs the games' loading extracts
# (`games.rs`; docs/app.md §17).
nettai-extract = { path = "../nettai-extract" }
# The Legacy Collection from a computer nearby, to a device without it (`nearby.rs`; docs/app.md §17).
nettai-nearby = { path = "../nettai-nearby" }

# Updates (`updates.rs`): the installed app's own (Velopack's packages: packaging/), from the project's GitHub
# releases; the desktop's alone (a phone's app is its store's: `updates_none.rs`). The version the release workflow's
# `vpk` is (VPK_VERSION), exactly: the first release on crates.io that asks for zip 9 (the ones before asked for
# zip 8, all of whose versions are yanked).
[target.'cfg(not(any(target_arch = "wasm32", target_os = "ios", target_os = "android")))'.dependencies]
velopack = "=1.3.39-g8d2844f"
# Android: Slint's winit backend set by the app (`select_backend`), as Slint's selector offers none there, with femtovg
# on the activity's OpenGL ES (the version slint is, exactly); winit on the activity android-activity runs
# (GameActivity: android/nettai/app/NettaiActivity.kt), whose entry point is the app's (`activity.rs`).
# (The screenshot pass's window that doesn't take the keyboard: the selector's winit hook, which Android's selector
# hasn't.)
[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { version = "1.18", default-features = false, features = ["unstable-winit-030"] }

[target.'cfg(target_os = "android")'.dependencies]
i-slint-backend-winit = { version = "=1.18.1", default-features = false, features = ["renderer-femtovg"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06", "android-game-activity"] }
# The app's calls into Java and Java's into it (`activity.rs`: the safe area; `lifecycle.rs`: the window's screen
# kept on, by android/nettai/lifecycle/NettaiAwake.kt), through JNI on the activity android-activity hands over.
# (The Kotlin is the APK's: its Gradle build compiles every crate's android/ folder in.)
jni = "0.22"
# reqwest checks certificates with Android's own verifier through this (the version reqwest's is), which calls its
# Kotlin component in the APK through JNI: it is given the VM and the activity first (`android_main`).
rustls-platform-verifier = "0.7"

# macOS: the activity that keeps the app's time while a battle runs in a covered window (`lifecycle::Awake`). (In the
# tree already, for the window.)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo", "NSString"] }

# iOS: the idle timer (`lifecycle::Awake`); the app made active and its sound given back (`lifecycle::resumed`). (In
# the tree already, for the window.)
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSNotification", "NSObject", "NSOperation", "NSString"] }
objc2-ui-kit = { version = "0.3", default-features = false, features = ["std", "UIApplication", "UIResponder"] }
objc2-avf-audio = { version = "0.3", default-features = false, features = ["std", "AVAudioSessionTypes"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The program runs under tokio (main.rs: `#[tokio::main]`, Slint's loop in `block_in_place`), so the futures the
# window's loop runs can use reqwest (`http.rs`).
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# The TLS provider reqwest is given (`http.rs`): ring's, as the tree's rustls has (nettai-rtc's).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# The browser's page: the log on its console, and a panic said there; its own JavaScript and what it calls
# (`page.rs`: the library is the module it loads, packaging/web/build.sh's).
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_log = "1"
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
js-sys = "0.3"

# A terminate request's signals, taken back from SDL (`quit.rs`). (In the tree already.)
[target.'cfg(unix)'.dependencies]
libc = "0.2"


[features]
# The screenshot pass and the motion probe (docs/app.md §13: `NETTAI_TOUR`), with what they need: the pictures'
# encoder, and the link library's signaling server in the process, which Play's second player meets the first
# through (`screens/play/tour.rs`). A player's build has none of it: `cargo run -p nettai --features tour`. The tests
# compile the pass whatever the features (the same two dependencies are the tests' below).
tour = ["dep:png", "nettai-rtc/testing"]
# The practice dummy that fights: its Action "Fights" and its Level, played by the trained network
# (docs/design/training-ai.md §10), downloaded from the nettai-ai repository when Fights is first picked (or
# `NETTAI_AI_WEIGHTS`'s file). Off by default: a build without it offers the dummy's other Actions alone.
# `cargo run -p nettai --features ai`.
ai = ["dep:nettai-training", "dep:sha2"]

[build-dependencies]
# What the app is built from, for its About screen (build.rs: `cargo metadata`'s JSON).
serde_json = "1"
# Android's library: the NDK's clang, asked where its compiler-rt builtins are (build.rs). (In the tree already.)
cc = "1"

# The Windows program's icon (build.rs: `NETTAI_WINDOWS_ICON`, an .ico packaging/ makes).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
png = "0.17"
# The tests' compat tables: the repository's, built in (the app reads its content's at run time).
exe6-compat = { path = "../exe6-compat", features = ["builtin"] }
exe5-compat = { path = "../exe5-compat", features = ["builtin"] }
exe4-compat = { path = "../exe4-compat", features = ["builtin"] }
nettai-rtc = { path = "../nettai-rtc", features = ["testing"] }
# The tests: the content of the repository.
nettai-match = { path = "../nettai-match", features = ["testing"] }
# A short set and graphics with no pack, for a battle played to its end.
nettai-frontend = { path = "../nettai-frontend", features = ["testing"] }
# The games' tests: content and archives of their own, in folders of their own.
tempfile = "3"
nettai-extract = { path = "../nettai-extract", features = ["testing"] }
