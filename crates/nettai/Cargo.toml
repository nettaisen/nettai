[package]
name = "nettai"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The nettai app (Slint): a title screen, offline play, the netplay lobby and the replay browser around a battle played through nettai-frontend"

[dependencies]
nettai-frontend = { path = "../nettai-frontend" }
nettai-battle = { path = "../nettai-battle" }
nettai-render = { path = "../nettai-render" }
nettai-content = { path = "../nettai-content" }
nettai-match = { path = "../nettai-match" }
nettai-content-api = { path = "../nettai-content-api" }
# The audio device (`Output`: the `playback` feature, cpal).
nettai-audio = { path = "../nettai-audio" }
# The window: Slint on winit, drawn with femtovg (OpenGL), the software
# renderer as the fallback. `unstable-winit-030` lets the battle hear
# winit's key events by physical key, before Slint's focus handling.
slint = { version = "1.18", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "renderer-software", "accessibility", "compat-1-2", "unstable-winit-030"] }
# Gamepads.
gilrs = "0.11"
# The system's language, for the first one shown.
sys-locale = "0.3"
# A replay's date in the local time.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# The tour's screenshots.
png = "0.17"
# Netplay's link: WebRTC through a room of the signaling server.
nettai-rtc = { path = "../nettai-rtc" }

# The room's code, copied for the other player (the desktop's clipboard).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = { version = "3", default-features = false }

[build-dependencies]
slint-build = "1.18"

[dev-dependencies]
# The tests: a signaling server in process, the content of the repository.
nettai-rtc = { path = "../nettai-rtc", features = ["testing"] }
nettai-match = { path = "../nettai-match", features = ["testing"] }
