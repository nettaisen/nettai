[package]
name = "nettai-video"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "A replay as video: played frame by frame, encoded by the platform's encoder (ffmpeg run as a child on the desktop, WebCodecs in a browser) and written as a fragmented MP4 as it is made; or as a NUT stream of raw frames and PCM sound"

[dependencies]
# The replay's viewer: the picture and the sound of each tick.
nettai-frontend = { path = "../nettai-frontend" }
# The frame's size.
nettai-render = { path = "../nettai-render" }
# The sound's sample rate (no audio device).
nettai-audio = { path = "../nettai-audio", default-features = false }

# The MP4's boxes (`fmp4`), and ffmpeg's read back (`ffmpeg`).
mp4-atom = "0.16"

# The browser's encoder (`webcodecs`): WebCodecs through wasm-bindgen, on a worker of its own (the platform's).
[target.'cfg(target_arch = "wasm32")'.dependencies]
nettai-platform = { path = "../nettai-platform" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[dev-dependencies]
# A short recorded set, graphics without a pack and a sound of every cue.
nettai-frontend = { path = "../nettai-frontend", features = ["testing"] }
nettai-match = { path = "../nettai-match", features = ["testing"] }
nettai-battle = { path = "../nettai-battle" }
