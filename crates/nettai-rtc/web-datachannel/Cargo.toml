# datachannel-facade's web backend, at the revision Cargo.lock pins, with one
# line changed (`handler` in src/lib.rs: `Closure::wrap_assert_unwind_safe`,
# where `Closure::wrap` doesn't compile in a `-C panic=unwind` build, which
# nettai's wasm build is). The workspace's `[patch]` puts it in place of the
# facade's own until the facade has the change; then this copy goes.
[package]
name = "web-datachannel"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Browser WebRTC data channels, shaped like libdatachannel's Rust API."
repository = "https://github.com/tangobattle/datachannel-facade"
publish = false

[dependencies]
js-sys = "0.3"
log = "0.4"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[dependencies.web-sys]
version = "0.3"
features = [
    "ErrorEvent",
    "Event",
    "MessageEvent",
    "RtcConfiguration",
    "RtcDataChannel",
    "RtcDataChannelEvent",
    "RtcDataChannelInit",
    "RtcDataChannelState",
    "RtcDataChannelType",
    "RtcIceCandidate",
    "RtcIceCandidateInit",
    "RtcIceGatheringState",
    "RtcIceTransportPolicy",
    "RtcPeerConnection",
    "RtcPeerConnectionIceEvent",
    "RtcPeerConnectionState",
    "RtcSdpType",
    "RtcSessionDescription",
    "RtcSessionDescriptionInit",
    "RtcSignalingState",
]

[lints.clippy]
new_without_default = "allow"
# A shared, optional, boxed callback is three wrappers by necessity: Rc to
# share it with spawned tasks, RefCell to swap it, Option because there
# may be none. Aliasing it further just hides what it is.
type_complexity = "allow"
