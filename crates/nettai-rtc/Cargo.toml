[package]
name = "nettai-rtc"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "WebRTC data channels for netplay: one API on both targets, through datachannel-facade (libdatachannel natively, the browser's RTCPeerConnection on the web)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-time = "1"
# The connections, on both targets (libdatachannel natively: C++ and Mbed
# TLS, built with CMake).
datachannel-facade.workspace = true

# Native: the signaling server's WebSocket (on a thread of its own), and the
# system's randomness (reconnect codes).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
# The WebSocket's TLS needs a crypto backend, which tungstenite doesn't pick:
# without one rustls panics at the first wss:// connection (the signaling
# thread ended at once, every time). The rtc crate used to bring ring in.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
getrandom = "0.3"

# The web: the browser's WebSocket and randomness.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.126"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "CloseEvent",
    "Crypto",
    "MessageEvent",
    "WebSocket",
] }

[features]
# `testing`: a signaling server in process, for tests (native).
testing = []

[dev-dependencies]
nettai-rtc = { path = ".", features = ["testing"] }

# The tests' TURN server signs its responses (STUN's long-term credentials).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
hmac = "0.12"
md-5 = "0.10"
sha1 = "0.10"

# The web backend's tests run in a browser (wasm-bindgen-test-runner).
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window"] }
