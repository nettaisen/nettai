[package]
name = "nettai-rtc"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "WebRTC data channels for netplay: one API on both targets (str0m natively, the browser's RTCPeerConnection on the web)"

[dependencies]
# Where two players meet: the signaling server's rooms.
nettai-signaling = { path = "../nettai-signaling" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-time = "1"
log = "0.4"

# Native: the connections (`native::rtc`) and the system's randomness
# (reconnect codes).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# WebRTC sans I/O: ICE, DTLS and SCTP, its crypto pure Rust (dimpl and
# RustCrypto).
str0m = { version = "0.24.1", default-features = false, features = ["rust-crypto"] }
# The connections' runtime, a thread of its own: their sockets, timers and
# the servers' names resolved.
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
# Each datagram's destination address (which candidate it came to), and the
# sockets made IPv6-only.
quinn-udp = { version = "0.6", default-features = false }
socket2 = "0.6"
# The interfaces' addresses: the host candidates.
if-addrs = "0.15"
# A STUN server asked the address the Internet sees, and a TURN server for
# a relayed one (sans I/O).
stun-proto = "2"
turn-client-proto = "0.7"
getrandom = "0.3"

# The web: the browser's connections (`web::rtc`: its RTCPeerConnection and
# data channels, the Promises they answer with awaited) and randomness.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.126"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Crypto",
    "MessageEvent",
    "RtcConfiguration",
    "RtcDataChannel",
    "RtcDataChannelInit",
    "RtcDataChannelType",
    "RtcIceCandidate",
    "RtcIceCandidateInit",
    "RtcIceTransportPolicy",
    "RtcPeerConnection",
    "RtcPeerConnectionIceEvent",
    "RtcPeerConnectionState",
    "RtcSdpType",
    "RtcSessionDescription",
    "RtcSessionDescriptionInit",
] }

[features]
# `testing`: a few of the link's insides, for its tests.
testing = []

[dev-dependencies]
nettai-rtc = { path = ".", features = ["testing"] }
nettai-signaling = { path = "../nettai-signaling", features = ["testing"] }

# The tests' TURN server signs its responses (STUN's long-term credentials).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
hmac = "0.12"
md-5 = "0.10"
sha1 = "0.10"

# The web backend's tests run in a browser (wasm-bindgen-test-runner).
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window"] }
