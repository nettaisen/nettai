[package]
name = "nettai-training"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Opponents for training: an AI that plays a navi on buttons alone, as a player does, plugged into live play (nettai-frontend's `Ai`)"

[dependencies]
nettai-battle.workspace = true
# The handles the engine names content by (a panel's place).
nettai-content-api = { path = "../nettai-content-api" }
# A tick's input from buttons (`standin::tick_input`), and the seeded
# random numbers.
nettai-netplay = { path = "../nettai-netplay" }
# The plug: live play's `Ai`.
nettai-frontend = { path = "../nettai-frontend" }

[dev-dependencies]
nettai-battle = { workspace = true, features = ["test-content"] }
nettai-match = { path = "../nettai-match", features = ["testing"] }
