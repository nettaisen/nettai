[package]
name = "nettai-training"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The learned training AI's Rust side: what a side sees as arrays (observe), what it presses (act), random builds, a round as an episode, a pool of them on worker threads, scripted players and the measures; the trained network's forward pass (net) and, with `live`, live play's player (ai) (docs/design/training-ai.md)"

[dependencies]
nettai-battle.workspace = true
# The handles the engine names content by, and the setup schemas' values.
nettai-content-api = { path = "../nettai-content-api" }
# Matches: random builds from the setup schema, checked; a round's setup.
nettai-match = { path = "../nettai-match" }
# A tick's input from buttons (`standin::tick_input`), and the masher.
nettai-netplay = { path = "../nettai-netplay" }
# The packs a pool plays on (their timings: the battle's content).
nettai-content = { path = "../nettai-content" }
# The chips' fingerprints kept on disk, by content hash.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Live play's AI plug (`driver::Ai`), for the app's player (ai.rs): the only
# thing here that may pull in the frontend.
nettai-frontend = { path = "../nettai-frontend", optional = true }
# Live play's threads and files, the same on the desktop and in a browser
# (the chips' fingerprints made on workers and kept by content hash).
nettai-platform = { path = "../nettai-platform", optional = true }

[features]
live = ["dep:nettai-frontend", "dep:nettai-platform"]
# The test content of all three games (`nettai_match::testing`), for the
# bridge's and other crates' tests.
testing = ["nettai-match/testing"]

[dev-dependencies]
nettai-match = { path = "../nettai-match", features = ["testing"] }
