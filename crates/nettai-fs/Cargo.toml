[package]
name = "nettai-fs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Files: std::fs on the desktop; in the browser, one tree in memory that every thread shares, whose changes the page keeps (nettai-web: OPFS)"

# The time a file was written, in the browser's tree (which the tests run on the desktop too).
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1"

[dev-dependencies]
web-time = "1"
