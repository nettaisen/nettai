[package]
name = "nettai-fs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Files: std::fs on the desktop; in the browser, one tree in memory that every thread shares, whose changes the page keeps (nettai-web: OPFS)"

# The browser's tree: the time a file was written, and its lock as a page's main thread may take one. (The tests
# run it on the desktop too.)
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1"
nettai-thread = { path = "../nettai-thread" }

[dev-dependencies]
web-time = "1"
nettai-thread = { path = "../nettai-thread" }
