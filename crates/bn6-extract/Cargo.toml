[package]
name = "bn6-extract"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Extracts a BN6 (US Falzar) ROM's battle assets (graphics, sound) into a content pack"

[dependencies]
m4a.workspace = true
nettai-assets = { path = "../nettai-assets" }
nettai-content = { path = "../nettai-content" }
# The assets' names (content/bn6/compat/assets.toml).
bn6-compat.workspace = true
nettai-content-api = { path = "../nettai-content-api" }
