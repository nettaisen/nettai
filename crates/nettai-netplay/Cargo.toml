[package]
name = "nettai-netplay"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Rollback netplay for the battle engine on getgud, with a simulated network for testing"

[dependencies]
nettai-battle.workspace = true
# The handles a tick's payload and a player's setup name content by.
nettai-content-api = { path = "../nettai-content-api" }
getgud.workspace = true
rennet.workspace = true

[features]
# rollback_cost reports the calls into Luau per advance
# (docs/design/rules-in-luau.md §6.5).
luau-profile = ["nettai-battle/luau-profile"]

[dev-dependencies]
nettai-battle = { workspace = true, features = ["test-content"] }
# rollback_cost loads the EXE6 content pack and replays a golden trace.
nettai-content = { path = "../nettai-content" }
