[package]
name = "nettai-netplay"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Rollback netplay for the battle engine on getgud, with a simulated network for testing"

[dependencies]
nettai-battle.workspace = true
# The handles a tick's payload and a player's setup name content by.
nettai-content-api = { path = "../nettai-content-api" }
