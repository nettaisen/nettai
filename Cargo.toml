[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["crates/nettai-luau/wasm/libc", "crates/nettai-rtc/web-datachannel"]

[workspace.package]
# The app's version, which nettai, nettai-frontend and nettai-extract take: the lobby and replays compare nettai-frontend's (builds of one minor version play together), and a pack's fingerprint has nettai-extract's line.
version = "0.11.0"
edition = "2024"
license = "MPL-2.0"

[workspace.dependencies]
m4a = { path = "crates/m4a" }
nettai-battle = { path = "crates/nettai-battle" }
cpal = "0.18"
# Rollback netcode core (Tango's); Cargo.lock pins the revision.
getgud = { git = "https://github.com/tangobattle/getgud" }
# Netplay transport (Tango's): reliable, ordered delivery of the players'
# inputs over unreliable datagrams; Cargo.lock pins the revision.
rennet = { git = "https://github.com/tangobattle/rennet" }
# WebRTC data channels (Tango's): one synchronous API over libdatachannel
# natively (C++, built with CMake, its sources git submodules) and the
# browser's RTCPeerConnection on wasm; Cargo.lock pins the revision.
datachannel-facade = { git = "https://github.com/tangobattle/datachannel-facade" }

[profile.dev]
opt-level = 1

# The app's Slint compiled to Rust: one large module that any edit to a .slint file compiles again whole. Without
# optimization and debug info that takes a fifth of the time (docs/app.md §14, measured), and what it does at run
# time (setting properties, laying out) is the Slint library's, which stays optimized.
[profile.dev.package.nettai-ui]
opt-level = 0
debug = false

[profile.release]
debug = 1

[patch.crates-io]
# Supply the file API stubs that stock mlua needs on bare Wasm.
libc = { path = "crates/nettai-luau/wasm/libc" }

[patch."https://github.com/tangobattle/datachannel-facade"]
# The facade's web backend with the one line a `-C panic=unwind` wasm build
# needs (its Cargo.toml says which), until the facade has it.
web-datachannel = { path = "crates/nettai-rtc/web-datachannel" }
