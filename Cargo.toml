[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
m4a = { path = "crates/m4a" }
bn6-battle = { path = "crates/bn6-battle" }
bn6-compat = { path = "crates/bn6-compat" }
cpal = "0.15"
# Rollback netcode core (Tango's); Cargo.lock pins the revision.
getgud = { git = "https://github.com/tangobattle/getgud" }

[profile.dev]
opt-level = 1

[profile.release]
debug = 1
