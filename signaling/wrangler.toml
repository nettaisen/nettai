# nettai's signaling server (src/index.ts): rooms where two players meet and
# trade their WebRTC offer, answer and candidates, and the STUN and TURN
# servers their connections use. After `npm install` (the wrangler that
# package.json pins: wrangler 4.15 left out the TURN rate limit below, with
# only a warning), run it here with `npx wrangler dev`
# (http://127.0.0.1:8787; nettai with NETTAI_SIGNAL=ws://127.0.0.1:8787).
# Deploying it is `npx wrangler deploy`, on your own Cloudflare account: the
# owner's step, as is everything below.
#
# TURN (docs/design/rollback.md §4.8). The Worker hands each client
# short-lived credentials for Cloudflare's TURN service (Cloudflare Realtime),
# asked for with a TURN key of the owner's, which two secrets hold:
#
#   1. Make a TURN key: in the Cloudflare dashboard, Realtime > TURN Server >
#      Create (or the API: POST /accounts/{account_id}/calls/turn_keys). It
#      shows the key's ID (the "Turn Token ID") and its API token, once.
#   2. Give them to the Worker as secrets (never in this file or the repo):
#        npx wrangler secret put CLOUDFLARE_TURN_KEY_ID
#        npx wrangler secret put CLOUDFLARE_TURN_KEY_API_TOKEN
#      For `wrangler dev`, the same names in signaling/.dev.vars
#      (CLOUDFLARE_TURN_KEY_ID=... and CLOUDFLARE_TURN_KEY_API_TOKEN=...),
#      which git ignores.
#
# Without them the Worker still runs: each welcome gives Cloudflare's public
# STUN server alone, and two players whose networks need a relay can't meet.
#
# TURN in mainland China. A player Cloudflare places there (its lookup of
# the IP address says CN; Hong Kong, Macau and Taiwan aren't CN) is given
# only the owner's own coturn there instead. The Worker makes that coturn's
# credentials itself, with the secret it shares with it (coturn's TURN REST
# scheme): they last as long as Cloudflare's, and coturn refuses them after.
#
#   1. In the coturn's turnserver.conf: `use-auth-secret`,
#      `static-auth-secret=SECRET` (a long random string, such as
#      `openssl rand -hex 32` makes), a `realm=`, and UDP on its port (the
#      desktop app relays over UDP only).
#   2. Give the Worker its URLs and that secret, as secrets:
#        npx wrangler secret put CHINA_TURN_URLS
#          its STUN and TURN URLs, separated by spaces, such as
#          stun:turn.example.cn:3478 turn:turn.example.cn:3478?transport=udp
#          (with no stun: URL, those players have no STUN server)
#        npx wrangler secret put CHINA_TURN_SECRET
#
# Without them, players in China are given Cloudflare's, as everyone else is.
#
# The app's default server is wss://matchmaking.nettai.n1gp.net
# (crates/nettai/src/screens/play/session.rs, DEFAULT_SIGNAL). To serve it
# from this Worker, give the Worker that hostname as a custom domain (its zone,
# n1gp.net, on the same account): in the dashboard, the Worker's Settings >
# Domains & Routes > Add > Custom domain, or uncomment this and deploy:
#
routes = [{ pattern = "matchmaking.nettai.n1gp.net", custom_domain = true }]
name = "nettai-signal"
main = "src/index.ts"
compatibility_date = "2025-10-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# How often one client (an IP address; an IPv6 one's /64) may be given TURN
# credentials: TURN_PER_MINUTE, 10 a minute (a match's two players are given
# theirs as the second comes, both counted against that one). Past it, STUN
# alone. Sockets opened only to collect credentials are what it stops.
[[ratelimits]]
name = "TURN_LIMIT"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
