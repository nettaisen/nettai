[project]
name = "nettai-ai"
version = "0.1.0"
description = "Self-play training of nettai's learned opponent (PPO, league, export for the Rust forward pass)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "torch>=2.8",
    "numpy>=2.1",
    "safetensors>=0.6",
    "tensorboard>=2.20",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "maturin>=1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nettai_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
