[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "nettai_gym"
version = "0.1.0"
description = "The Rust pool of nettai's training AI, for the Python trainer (docs/design/training-ai.md §6.6)"
requires-python = ">=3.10"
dependencies = ["numpy"]

[tool.maturin]
module-name = "nettai_gym"
features = ["pyo3/extension-module"]
